# รันบน ainora-agent — มีชุดเดียว ไม่มี staging
#
# คอนเทนเนอร์เดียวจบ: สไลด์ ไฟล์สื่อ และรีเลย์คำสั่งอยู่ในอิมเมจเดียวกันหมด
# ไม่มี volume ไม่มี network พิเศษ ไม่มี service ที่ต้องขึ้นตามกัน
# จะใช้ docker run เปล่า ๆ แทน compose ก็ได้ผลเหมือนกัน
name: nora-exhibition
services:
  nora-exhibition:
    image: "${REGISTRY_NORAEXHIBITION_IMAGE}:latest"
    container_name: nora-exhibition-web
    restart: unless-stopped
    ports:
      - "${EXHIBITION_PORT:-10096}:80"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # โทเคนสั่งงานเป็นทางเลือก ระบบอยู่วงในอยู่แล้ว เว้นว่างได้
      - CONTROL_TOKEN=${CONTROL_TOKEN:-}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
