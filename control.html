<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ควบคุมจอนิทรรศการ · AI NORA</title>
<style>
:root{
  --bg:#12100C; --card:#1D1A14; --line:#332D22; --ink:#F4EEE1; --muted:#A79B85;
  --gold:#E3C468; --gold-dk:#C29B31; --ok:#5FBF7A; --off:#7A6F5C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai","Segoe UI",sans-serif;
  padding:max(14px,env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
h1{font-size:19px;margin:0 0 2px;letter-spacing:.01em}
.sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{flex:1 1 auto;min-height:52px;min-width:64px;font:inherit;font-weight:600;font-size:15px;
  color:var(--ink);background:#26221A;border:1px solid var(--line);border-radius:12px;cursor:pointer}
button:active{transform:translateY(1px)}
button.pri{background:linear-gradient(180deg,#E3C468,#C29B31);color:#2A2208;border-color:#8E7124}
button.sm{min-height:40px;font-size:13px;flex:0 0 auto;padding:0 14px}
button[disabled]{opacity:.4}
input{width:100%;min-height:46px;font:inherit;font-size:15px;color:var(--ink);background:#26221A;
  border:1px solid var(--line);border-radius:12px;padding:0 12px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.tgt{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:-2px 0 12px}
.tgt button{flex:0 0 auto;min-height:40px;font-size:13px;padding:0 14px;border-radius:999px}
.tgt button.on{background:var(--gold);color:#2A2208;border-color:#8E7124}
.scr{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.scr:first-child{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--off);flex:0 0 auto}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(95,191,122,.16)}
.scr .id{font-weight:700;font-size:15px;flex:0 0 auto}
.scr .meta{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.35}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.hint code{background:#26221A;border-radius:6px;padding:1px 6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
  background:#26221A;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13px;
  opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<h1>ควบคุมจอนิทรรศการ</h1>
<div class="sub" id="conn">กำลังต่อ…</div>

<div class="tgt" id="tgt"></div>

<div class="card">
  <div class="row" style="margin-bottom:8px">
    <button class="pri" data-cmd="toggle">⏯ เล่น / หยุด</button>
  </div>
  <div class="row">
    <button data-cmd="prev">◀ ย้อน</button>
    <button data-cmd="next">ถัดไป ▶</button>
    <button data-cmd="restart">↻ หน้าแรก</button>
  </div>
</div>

<div class="card">
  <label for="n">กระโดดไปหน้าที่</label>
  <div class="row">
    <input id="n" type="number" min="1" step="1" inputmode="numeric" placeholder="เช่น 12">
    <button class="sm pri" id="go" style="min-height:46px">ไป</button>
  </div>
</div>

<div class="card">
  <label>โหมดจอ</label>
  <div class="row">
    <button class="sm" data-cmd="mode" data-arg="0">16:9</button>
    <button class="sm" data-cmd="mode" data-arg="1">จอ 1</button>
    <button class="sm" data-cmd="mode" data-arg="2">จอ 2</button>
    <button class="sm" data-cmd="mode" data-arg="3">จอ 3</button>
    <button class="sm" data-cmd="mode" data-arg="w">48:9</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="sm" data-cmd="sync">กลับเข้าจังหวะนาฬิกา</button>
    <button class="sm" data-cmd="full">เต็มจอ</button>
    <button class="sm" data-cmd="reload">โหลดใหม่</button>
  </div>
</div>

<div class="card" id="list"><div class="hint">ยังไม่มีจอรายงานตัวเข้ามา</div></div>

<div class="card">
  <div id="tokBox" hidden>
    <label for="tok">โทเคน</label>
    <input id="tok" type="password" autocomplete="off" placeholder="กรอกโทเคนที่ตั้งไว้ที่รีเลย์">
  </div>
  <div class="hint" id="guard" style="margin-bottom:10px"></div>
  <div class="hint">
    เปิดจอด้วย <code>?screen=&lt;ชื่อจอ&gt;</code> เช่น
    <code>/exhibition/?panel=1&amp;screen=left</code><br>
    ไม่ใส่ ระบบจะตั้งให้เองเป็น <code>screen-1/2/3</code> ตามโหมดจอ
  </div>
</div>

<div id="toast"></div>
<script>
const API = new URLSearchParams(location.search).get('api')
  || location.pathname.replace(/\/[^/]*$/, '') + '/api';
const $ = s => document.querySelector(s);
const tokBox = $('#tok');
tokBox.value = sessionStorage.getItem('nora-token') || '';
tokBox.addEventListener('input', () => sessionStorage.setItem('nora-token', tokBox.value));

let target = '*';
let screens = [];

function toast(t){
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1600);
}

async function send(cmd, arg){
  try{
    const r = await fetch(API + '/cmd', { method:'POST',
      headers:{ 'content-type':'application/json' },
      body:JSON.stringify({ cmd, arg, target, token:tokBox.value }) });
    const j = await r.json();
    if(!r.ok) return toast(j.error || 'สั่งไม่สำเร็จ');
    toast(j.sent ? `ส่ง ${cmd} ไป ${j.sent} จอ` : 'ไม่มีจอที่ตรงเป้าหมาย');
  }catch(e){ toast('ต่อรีเลย์ไม่ได้'); }
}

document.body.addEventListener('click', e => {
  const b = e.target.closest('button[data-cmd]');
  if(b) send(b.dataset.cmd, b.dataset.arg);
});
$('#go').addEventListener('click', () => {
  const v = parseInt($('#n').value, 10);
  if(v > 0) send('goto', v); else toast('ใส่เลขหน้าก่อน');
});

function drawTargets(){
  const el = $('#tgt');
  const opts = [['*', 'ทุกจอ'], ...screens.map(s => [s.id, s.id])];
  if(!screens.some(s => s.id === target)) if(target !== '*') target = '*';
  el.innerHTML = opts.map(([v, t]) =>
    `<button data-t="${v}" class="${v === target ? 'on' : ''}">${t}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { target = b.dataset.t; drawTargets(); });
}
function drawList(){
  $('#list').innerHTML = screens.length ? screens.map(s => `
    <div class="scr">
      <span class="dot ${s.online ? 'on' : ''}"></span>
      <span class="id">${s.id}</span>
      <span class="meta">${s.slide ? `หน้า ${s.slide} / ${s.total}` : '—'}
        · ${s.playing ? 'เล่นอยู่' : 'หยุด'}<br>
        โหมด ${s.mode || '?'}${s.sync ? ' · ตามนาฬิกา' : ''}</span>
    </div>`).join('') : '<div class="hint">ยังไม่มีจอรายงานตัวเข้ามา</div>';
}

let es;
function connect(){
  try{ es = new EventSource(API + '/events?role=controller'); }
  catch(e){ $('#conn').textContent = 'ต่อรีเลย์ไม่ได้'; return; }
  es.addEventListener('open', () => { $('#conn').textContent = 'ต่อรีเลย์แล้ว'; });
  es.addEventListener('screens', ev => {
    try{ screens = JSON.parse(ev.data); }catch(e){ screens = []; }
    const on = screens.filter(s => s.online).length;
    $('#conn').textContent = `ต่อรีเลย์แล้ว · จอออนไลน์ ${on} จาก ${screens.length}`;
    drawTargets(); drawList();
  });
  es.onerror = () => {
    $('#conn').textContent = 'สายหลุด กำลังต่อใหม่…';
    try{ es.close(); }catch(e){}
    setTimeout(connect, 4000);
  };
}
/* ถ้ารีเลย์ไม่ได้ตั้งโทเคน ก็ไม่ต้องโชว์ช่องให้กรอก
   ด่านจริงคือ nginx ที่จำกัด /exhibition/api/cmd ไว้เฉพาะวงภายใน */
fetch(API + '/healthz').then(r => r.json()).then(h => {
  $('#tokBox').hidden = !h.auth;
  $('#guard').innerHTML = h.auth
    ? 'รีเลย์ตั้งโทเคนไว้ — ต้องกรอกก่อนสั่งงาน'
    : 'รีเลย์ไม่ได้ตั้งโทเคน — หน้านี้ถูกจำกัดด้วยวงเครือข่ายที่ nginx แทน '
      + 'ถ้าเปิดหน้านี้ได้ ก็สั่งจอได้เลย';
}).catch(() => { $('#guard').textContent = 'ต่อรีเลย์ไม่ได้'; });

drawTargets(); drawList(); connect();
</script>
</body>
</html>
