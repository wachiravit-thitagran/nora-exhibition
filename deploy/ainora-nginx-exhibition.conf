# จองพาธ /exhibition/ บน nginx ของ ainora.psu.ac.th ให้ชี้มาที่คอนเทนเนอร์สไลด์
#
# วางบล็อกนี้ไว้ใน server block ของ ainora.psu.ac.th (ตัวที่ถือใบรับรอง TLS)
# หรือเซฟไฟล์นี้ไว้แล้ว include เข้าไปในบล็อกนั้น
#     include /etc/nginx/snippets/exhibition.conf;
#
# ทดสอบและโหลดใหม่
#     sudo nginx -t && sudo systemctl reload nginx
#     curl -I https://ainora.psu.ac.th/exhibition/

location = /exhibition {
    return 301 /exhibition/;
}

# ใช้ ^~ ไม่ใช่แค่ / เฉย ๆ
# เพราะถ้าในไฟล์คอนฟิกมี location แบบ regex อยู่ก่อน เช่น
#     location ~* \.(jpg|png|mp4|woff2)$ { root /var/www/...; }
# regex จะชนะ prefix ธรรมดา แล้วไปคว้าไฟล์ภาพ/วิดีโอของสไลด์ไปเสิร์ฟเอง จนขึ้น 404
# ส่วน ^~ บอก nginx ว่า "เจอ prefix นี้แล้วหยุด ไม่ต้องไปดู regex ต่อ"
location ^~ /exhibition/ {
    proxy_pass http://127.0.0.1:10096;     # <— ห้ามมี / ปิดท้าย
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # คลิปเป็นสตรีมขนาดหลาย MB ปล่อยผ่านตรง ๆ ไม่ต้องบัฟทั้งก้อน
    # และไม่ตั้ง proxy_cache เพื่อให้ byte-range ของเบราว์เซอร์ทำงานได้เต็มที่
    proxy_buffering    off;
    proxy_read_timeout 300s;

    # คอนเทนเนอร์ตั้ง Cache-Control มาให้ครบแล้ว
    # (index.html = no-store, brand/ = 30 วัน, assets/ = 7 วัน)
    # อย่าใส่ expires หรือ add_header Cache-Control ทับที่ชั้นนี้
}
