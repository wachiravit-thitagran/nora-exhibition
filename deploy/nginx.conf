# nginx ในคอนเทนเนอร์ — เสิร์ฟไฟล์ static ล้วน ไม่มีตัวแปรที่ต้องแทนค่าตอน start
#
# ข้อกำหนด: service นี้ตอบเฉพาะ /exhibition/* เท่านั้น อะไรนอกนั้นตอบ 404
# สื่อทั้งหมด (วิดีโอ ภาพ ฟอนต์ โลโก้ พื้นหลัง) ถูกฝังลงอิมเมจแล้ว
# คอนเทนเนอร์นี้จึงไม่ต่อออกไปที่ไหนเลย ไม่มี proxy ไม่มี upstream ไม่ต้องมีเน็ต

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # ---- IP ผู้ใช้จริง -----------------------------------------------
    # คอนเทนเนอร์นี้อยู่หลัง nginx ของ production เสมอ $remote_addr จึงเป็น
    # IP ของ nginx ตัวหน้า/docker bridge ไม่ใช่ของผู้ชมจริง
    #
    # เรื่องนี้เคยทำให้ allow/deny ไม่มีผลมาก่อน: docker bridge เป็น 172.17.x
    # ซึ่งตกอยู่ในช่วง 172.16.0.0/12 ที่เขียน allow ไว้พอดี ผลคืออนุญาตทุกคน
    # ต้องอ่าน X-Forwarded-For ก่อน กฎด้านล่างจึงจะทำงานจริง
    #
    # เชื่อ X-Forwarded-For เฉพาะจากวงภายใน — ถ้าใครยิงพอร์ต 10096 ตรง ๆ
    # จากภายนอก header ที่ปลอมมาจะไม่ถูกนับ
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # คลิปมีขนาดหลาย MB — เปิด byte-range ให้เบราว์เซอร์ seek ได้
    # (nginx เปิด range ของไฟล์ static ให้อยู่แล้ว ไม่ต้องตั้งอะไรเพิ่ม)
    sendfile on;
    tcp_nopush on;

    # ---- นอก /exhibition/ ไม่ให้บริการ -------------------------------
    location / {
        return 404;
    }

    location = /exhibition {
        return 301 /exhibition/;
    }

    # ---- health check ------------------------------------------------
    location = /exhibition/healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- รีเลย์คำสั่งจาก controller -----------------------------------
    # สไลด์ยังเป็น static เหมือนเดิม รีเลย์เป็นคอนเทนเนอร์แยกที่ทำหน้าที่
    # ส่งคำสั่งจากมือถือไปยังจอเท่านั้น ถ้ารีเลย์ไม่ขึ้น สไลด์ก็ยังเล่นได้ปกติ
    #
    # proxy_buffering off สำคัญมาก — /events เป็นสตรีม SSE ที่เปิดค้าง
    # ถ้าปล่อยให้บัฟเฟอร์ คำสั่งจะค้างอยู่ใน nginx ไม่ถึงจอ
    # สั่งงาน = เขียน จำกัดเฉพาะวงภายในสถานที่จัดงาน
    # ถ้าตั้ง CONTROL_TOKEN ไว้ด้วยก็เป็นชั้นที่สอง แต่ด่านนี้สำคัญกว่า
    # เพราะ /exhibition/ เปิดสู่อินเทอร์เน็ต ใครเดา URL ถูกก็สั่งจอได้
    location = /exhibition/api/cmd {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://nora-exhibition-control:10097;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # /events กับ /state เปิดไว้ — จอต้องต่อได้เสมอ และไม่ได้เปลี่ยนอะไร
    location ^~ /exhibition/api/ {
        proxy_pass http://nora-exhibition-control:10097;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        add_header Cache-Control "no-store" always;
    }

    # ---- หน้า controller ----------------------------------------------
    location = /exhibition/control.html {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /exhibition/control {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        add_header Cache-Control "no-store, must-revalidate";
        try_files /exhibition/control.html =404;
    }

    # ---- ตัวสไลด์ ----------------------------------------------------
    # ห้ามแคช เพราะแก้เนื้อหาแล้วต้องเห็นผลทันทีตอนรีเฟรชจอนิทรรศการ
    location = /exhibition/index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /exhibition/ {
        add_header Cache-Control "no-store, must-revalidate";
        try_files /exhibition/index.html =404;
    }

    location ^~ /exhibition/brand/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /exhibition/assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # เครื่องมือเลือกเฟรมเป็นของทีมงาน ไม่ใช่ของผู้เข้าชม
    # แก้ allow ให้ตรงกับซับเน็ตของสำนักงานก่อนใช้จริง
    # กฎนี้เพิ่งมามีผลจริงหลังตั้ง real_ip ด้านบน — ก่อนหน้านี้เปิดให้ทุกคนโดยไม่ตั้งใจ
    location ^~ /exhibition/tools/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        autoindex off;
    }

    location /exhibition/ {
        try_files $uri $uri/ =404;
    }
}
