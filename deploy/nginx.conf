# nginx ในคอนเทนเนอร์ — เสิร์ฟไฟล์ static ล้วน ไม่มีตัวแปรที่ต้องแทนค่าตอน start
#
# ข้อกำหนด: service นี้ตอบเฉพาะ /exhibition/* เท่านั้น อะไรนอกนั้นตอบ 404
# สื่อทั้งหมด (วิดีโอ ภาพ ฟอนต์ โลโก้ พื้นหลัง) ถูกฝังลงอิมเมจแล้ว
# คอนเทนเนอร์นี้จึงไม่ต่อออกไปที่ไหนเลย ไม่มี proxy ไม่มี upstream ไม่ต้องมีเน็ต
#
# ---- นโยบายแคช -----------------------------------------------------
# งานนี้ใช้กับจอ Maxhub Pivot ซึ่งเป็น Android WebView ที่เก็บแคชดื้อมาก
# แก้สไลด์แล้วรีเฟรชอาจยังเห็นของเก่า จึงตั้งให้ "ห้ามใช้ของเก่าโดยไม่ถาม" ทั้งไซต์
#
#   HTML / API      -> no-store  (ไม่เก็บเลย โหลดใหม่ทุกครั้ง)
#   assets/ brand/  -> no-cache  (เก็บได้ แต่ต้องถามเซิร์ฟเวอร์ก่อนใช้ทุกครั้ง)
#
# ที่ไฟล์สื่อใช้ no-cache ไม่ใช่ no-store เพราะ no-cache ยังยิง conditional
# request ได้ ไฟล์ไม่เปลี่ยนก็ตอบ 304 ตัวเปล่า วิดีโอหลายสิบ MB จึงไม่ต้อง
# โหลดซ้ำทุกรอบลูป แต่พอเปลี่ยนไฟล์เมื่อไหร่ ETag เปลี่ยน จอเห็นทันที
# ถ้าใช้ no-store กับวิดีโอ จอจะดาวน์โหลดคลิปใหม่ทุกรอบจนภาพกระตุก

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server_tokens off;

    # ---- IP ผู้ใช้จริง -----------------------------------------------
    # คอนเทนเนอร์อยู่หลัง nginx ของ production เสมอ $remote_addr จึงเป็น IP
    # ของ docker bridge ไม่ใช่ของผู้ชม ตั้งไว้เพื่อให้ access log อ่านรู้เรื่อง
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ค่าเริ่มต้นทั้งไซต์: ห้ามแคช
    # Pragma/Expires ใส่เผื่อ WebView รุ่นเก่าบนจอที่ยังดูสองอันนี้อยู่
    #
    # หมายเหตุ nginx: add_header ใน location จะ "ทับ" ของ server ทั้งชุด
    # ไม่ใช่เพิ่มเข้าไป — location ไหนที่ประกาศ add_header เอง ต้องเขียนครบทุกบรรทัด
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    gzip on;
    # text/html ถูก gzip ให้อยู่แล้วเสมอ ใส่ซ้ำ nginx จะเตือน duplicate MIME type
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # คลิปมีขนาดหลาย MB — เปิด byte-range ให้เบราว์เซอร์ seek ได้
    # (nginx เปิด range ของไฟล์ static ให้อยู่แล้ว ไม่ต้องตั้งอะไรเพิ่ม)
    sendfile on;
    tcp_nopush on;

    # ---- นอก /exhibition/ ไม่ให้บริการ -------------------------------
    location / {
        return 404;
    }

    location = /exhibition {
        return 301 /exhibition/;
    }

    # ---- health check ------------------------------------------------
    # ใช้ default_type ไม่ใช่ add_header Content-Type — add_header จะ "เพิ่ม"
    # Content-Type อีกอัน (ได้สองหัวข้อ) และยังไปทับชุด add_header ของ server ทิ้งด้วย
    location = /exhibition/healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- รีเลย์คำสั่งจาก controller -----------------------------------
    # สไลด์ยังเป็น static เหมือนเดิม รีเลย์เป็นคอนเทนเนอร์แยกที่ทำหน้าที่
    # ส่งคำสั่งจากมือถือไปยังจอเท่านั้น ถ้ารีเลย์ไม่ขึ้น สไลด์ก็ยังเล่นได้ปกติ
    #
    # proxy_buffering off สำคัญมาก — /events เป็นสตรีม SSE ที่เปิดค้าง
    # ถ้าปล่อยให้บัฟเฟอร์ คำสั่งจะค้างอยู่ใน nginx ไม่ถึงจอ
    #
    # ไม่มี allow/deny แล้ว — ระบบนี้ใช้ในวงภายในของหน่วยงาน
    # ถ้าวันหนึ่งต้องเปิดสู่ภายนอกจริง ค่อยกลับมาใส่ด่านที่ชั้นนี้
    #
    # ชื่อ upstream อยู่ในตัวแปร + resolver ไม่ได้เขียนตรง ๆ ในบรรทัด proxy_pass
    # เพราะถ้าเขียนตรง ๆ nginx จะ resolve ชื่อนี้ "ตอนสตาร์ต" ถ้าคอนเทนเนอร์รีเลย์
    # ยังไม่ขึ้น (หรือไม่ได้ deploy) nginx จะไม่ยอมสตาร์ตเลย = สไลด์ดับทั้งงาน
    # เพราะของเสริมตัวเดียว ใช้ตัวแปรแล้ว resolve ตอนมี request แทน
    # รีเลย์ไม่อยู่ก็แค่ /api/ ตอบ 502 ส่วนสไลด์ยังเล่นปกติ
    #
    # 127.0.0.11 คือ DNS ในตัวของ docker (ใช้ได้เมื่ออยู่ใน network ของ compose)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    location ^~ /exhibition/api/ {
        # ต้องต่อ $request_uri เองด้วย — พอ proxy_pass มีตัวแปร
        # nginx จะไม่ส่งพาธเดิมไปให้อัตโนมัติเหมือนตอนเขียนชื่อโฮสต์ตรง ๆ
        set $nora_relay nora-exhibition-control:10097;
        proxy_pass http://$nora_relay$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    # ---- หน้า controller ----------------------------------------------
    # /exhibition/control ให้พิมพ์สั้น ๆ ที่มือถือได้ ไม่ต้องเติม .html
    location = /exhibition/control {
        try_files /exhibition/control.html =404;
    }

    # ---- ตัวสไลด์ ----------------------------------------------------
    location = /exhibition/ {
        try_files /exhibition/index.html =404;
    }

    # ---- ไฟล์สื่อ ------------------------------------------------------
    # no-cache = เก็บไว้ได้ แต่ต้องถามก่อนใช้ทุกครั้ง (ดูหัวไฟล์)
    # ต้องเขียน add_header ครบชุด เพราะบล็อกนี้ทับของ server ทั้งหมด
    location ^~ /exhibition/assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /exhibition/brand/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # เครื่องมือเลือกเฟรมเป็นของทีมงาน ไม่ใช่ของผู้เข้าชม แต่ระบบอยู่วงในอยู่แล้ว
    location ^~ /exhibition/tools/ {
        autoindex off;
    }

    location /exhibition/ {
        try_files $uri $uri/ =404;
    }
}
