<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI NORA — นิทรรศการ Breath of Nora</title>
<style>
/* ฟอนต์ Anuphan (Cadson Demak, SIL OFL 1.1) — ดูสัญญาอนุญาตที่ brand/Anuphan-OFL.txt */
@font-face{
  font-family:'Anuphan';
  src:url('brand/Anuphan-var.woff2') format('woff2-variations'),
      url('brand/Anuphan-var.woff2') format('woff2');
  font-weight:100 700;
  font-style:normal;
  font-display:block;
}
/* ============================================================
   AI NORA — Exhibition loop deck
   ธีมสีตาม ainora.psu.ac.th (gold #D4AF37 / paper #F8FAFC / ink #111827)
   ตัวอักษร Anuphan · เวทีวาดที่ 3840x2160 แล้วย่อให้พอดีจอ
   ============================================================ */
:root{
  --paper:#F8FAFC;      /* พื้นหลังหน้า (เหมือนเว็บ) */
  --paper-2:#EFF2F6;
  --card:#FFFFFF;
  --ink:#111827;        /* หัวเรื่อง */
  --body:#374151;
  --muted:#6B7280;
  --line:#E3E7EC;
  --gold:#D4AF37;       /* สีทองของเว็บ ainora.psu.ac.th */
  --gold-dk:#A6841F;
  --gold-soft:#FAF3DE;
  --saffron:#E88B00;    /* สีส้มจากโลโก้ AI NORA */
  --dark:#141A24;
  --stage-w:3840px;
  --stage-h:2160px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* ล็อกความสูงไว้เท่าหน้าจอ ไม่ให้มีแถบเลื่อนหรือการสกรอลล์เด็ดขาด
   (dvh เผื่อกรณีเปิดใน iframe หรือเบราว์เซอร์ที่มีแถบเครื่องมือซ่อน/โผล่) */
html,body{
  height:100vh;height:100dvh;
  min-height:100vh;min-height:100dvh;
  max-height:100vh;max-height:100dvh;
  width:100%;max-width:100%;
  background:#0A0C10;overflow:hidden;
  overscroll-behavior:none;touch-action:none;
}
body{position:fixed;inset:0}
body{font-family:"Anuphan","Noto Sans Thai",system-ui,-apple-system,sans-serif;
     color:var(--body);font-variant-numeric:tabular-nums}

#viewport{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#0A0C10}
#stage{
  width:var(--stage-w);height:var(--stage-h);
  position:absolute;left:50%;top:50%;
  transform-origin:center center;
  transform:translate(-50%,-50%) scale(0.25);
  overflow:hidden;background:var(--paper);
}

/* ---------- slide shell ---------- */
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease}
.slide.on{opacity:1;visibility:visible}
.slide::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 6% -12%, rgba(212,175,55,.13), transparent 58%),
    radial-gradient(110% 80% at 102% 108%, rgba(212,175,55,.09), transparent 60%),
    var(--paper);
}
.slide > *{position:relative}

/* ---------- header ---------- */
.hdr{position:absolute;top:104px;left:150px;right:150px;display:flex;align-items:flex-start;gap:60px}
.hdr-txt{flex:1;min-width:0}
.eyebrow{
  display:inline-flex;align-items:center;gap:22px;
  font-size:42px;font-weight:700;letter-spacing:.16em;color:var(--gold-dk);
  text-transform:uppercase;margin-bottom:24px;
}
.eyebrow::before{content:"";width:104px;height:6px;background:var(--gold);border-radius:3px;
  transform-origin:left center}
h1.title{
  font-family:"Anuphan",sans-serif;
  font-size:104px;line-height:1.16;font-weight:700;color:var(--ink);
  letter-spacing:-.015em;
}
h1.title .thin{color:var(--muted);font-weight:600}
.sub{margin-top:20px;font-size:48px;font-weight:400;color:var(--body);line-height:1.35}

.wordmark{flex:0 0 auto;text-align:right;padding-top:4px}
.wordmark img{display:block;width:520px;height:auto;margin-left:auto}
.wordmark .org{margin-top:12px;font-size:32px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.lg-light{display:none}
.slide.dark .lg-dark{display:none}
.slide.dark .lg-light{display:block}
.slide.dark .wordmark .org{color:rgba(255,255,255,.58)}

/* ---------- footer + แถบโลโก้ผู้สนับสนุน ---------- */
.ftr{
  position:absolute;left:150px;right:150px;bottom:74px;
  display:flex;align-items:center;gap:36px;
  font-size:34px;color:var(--muted);font-weight:500;
}
.ftr .dot{width:11px;height:11px;border-radius:50%;background:var(--gold);flex:0 0 auto}
.ftr .grow{flex:1}
.ftr .count{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.slide.dark .ftr{color:rgba(255,255,255,.6)}
.slide.dark .ftr .count{color:rgba(255,255,255,.72)}

.logos{
  align-self:flex-start;flex:0 0 auto;
  display:flex;align-items:center;gap:34px;
  background:#fff;border:2px solid var(--line);border-radius:999px;
  padding:16px 40px;box-shadow:0 14px 34px -22px rgba(17,24,39,.4);
}
.logos img{height:calc(84px * var(--k,1));width:auto;display:block}
.logos .sep{width:2px;height:60px;background:var(--line);flex:0 0 auto}
.logobox{
  height:84px;min-width:230px;padding:0 24px;border:3px dashed #C9CFD8;border-radius:16px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:26px;font-weight:600;color:#7C8694;line-height:1.15;background:#FAFBFC;
}
.hero .logobox{height:112px;min-width:280px;font-size:30px}
.hero .logos{padding:22px 52px;gap:52px}
.hero .logos img{height:calc(112px * var(--k,1))}

.progress{position:absolute;left:0;right:0;bottom:0;height:12px;background:rgba(17,24,39,.10)}
.progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--saffron));transition:width .1s linear}

/* ---------- comparison grid ---------- */
.stagebody{position:absolute;left:150px;right:150px;top:404px;bottom:230px;display:flex;flex-direction:column}
.cmp{flex:1;display:grid;grid-template-columns:1fr auto 1fr;gap:70px;align-items:center}
.cmp.solo{grid-template-columns:1fr}
/* สื่อชิ้นเดียวบนจอเสริม/ผืนกว้าง — บีบกรอบให้พอดีของจริง ไม่เหลือพื้นขาวกว้าง
   จอซ้ายเป็นภาพนิ่งแนวตั้ง (กว้างกว่าได้) ส่วนที่เหลือเป็นคลิป 9:16 จึงแคบกว่า */
.pL .cmp.solo{grid-template-columns:minmax(0,1500px);justify-content:center}
.pR .cmp.solo,.pCR .cmp.solo,.pW .cmp.solo,.pCU .cmp.solo{
  grid-template-columns:minmax(0,1100px);justify-content:center}
.panel{
  height:100%;background:var(--card);border:3px solid var(--line);border-radius:40px;
  box-shadow:0 34px 70px -44px rgba(17,24,39,.42);
  display:flex;flex-direction:column;overflow:hidden;
}
.panel .cap{
  flex:0 0 auto;display:flex;align-items:center;gap:26px;
  padding:32px 46px;background:var(--ink);color:#fff;
}
.panel .cap .badge{
  flex:0 0 auto;font-size:32px;font-weight:700;letter-spacing:.1em;
  background:rgba(255,255,255,.18);border-radius:999px;padding:9px 26px;
}
.panel .cap .lbl{font-size:44px;font-weight:600;line-height:1.2}
.panel.alt .cap{background:var(--gold)}
.panel.alt .cap .lbl{color:#2E2405}
.panel.alt .cap .badge{background:rgba(0,0,0,.16);color:#2E2405}
.panel .body{position:relative;flex:1;min-height:0;display:flex;align-items:stretch;
  justify-content:center;gap:26px;padding:40px;background:var(--paper-2);overflow:hidden}
/* สื่อชิ้นเดียว — จัดกลางด้วยตำแหน่งสัมบูรณ์ + margin:auto
   คลิป 9:16 หรือภาพแนวตั้งจึงย่อให้พอดีกรอบเอง ไม่ล้นออกไปแล้วถูก overflow ตัด
   (เดิม width:100% + height:auto ทำให้คลิปแนวตั้งสูงเป็น 1.78 เท่าของความกว้างกรอบ) */
.panel .body > img:only-child,
.panel .body > video:only-child{
  position:absolute;inset:0;margin:auto;width:auto;height:auto;
  max-width:calc(100% - 80px);max-height:calc(100% - 80px);
  object-fit:contain;display:block;border-radius:14px}
/* ภาพคู่ ซ้าย+ขวา — คุมด้วยความสูงของกรอบ */
.panel .body.two img{flex:0 1 48%;min-width:0;height:100%;width:auto;
  object-fit:contain;display:block;border-radius:14px}

.arrow{font-size:150px;line-height:1;color:var(--gold);font-weight:700;user-select:none}
.arrow small{display:block;font-size:32px;color:var(--muted);font-weight:600;text-align:center;margin-top:8px;letter-spacing:.08em}

/* ---------- combine (poses + result) ---------- */
.combine{flex:1;display:grid;grid-template-columns:1fr auto minmax(0,1120px);
  gap:64px;align-items:center}
/* สมการเดียวกันบนผืนกว้าง 2 จอ — การ์ดท่ารำเรียงแนวนอน สูงเต็มผืน
   ไม่ใช้ความกว้างเป็น % เพราะคอลัมน์กว้างเกือบ 4000px จะได้การ์ดเตี้ยแบนผิดสัดส่วน */
.combine.wide{height:100%;grid-template-columns:1fr auto minmax(0,1400px);gap:110px}
.combine.wide .chips{flex-wrap:nowrap;height:100%;gap:44px}
.combine.wide .chip{width:auto;flex:1 1 0;min-width:0;max-width:1250px}
.combine.wide .chip .nm{font-size:44px;padding:24px 26px}
.chips{display:flex;flex-wrap:wrap;gap:32px;align-items:stretch;justify-content:center}
.chip{
  width:calc(33.333% - 24px);min-width:300px;background:var(--card);border:3px solid var(--line);
  border-radius:30px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 50px -36px rgba(17,24,39,.4);
}
.chips.n1 .chip{width:70%}
.chips.n2 .chip{width:calc(50% - 18px)}
.chips.n3 .chip{width:calc(33.333% - 22px);min-width:0}
.chips.n4 .chip{width:calc(50% - 18px)}
.chip .ph{flex:1;min-height:250px;position:relative;background:var(--paper-2);overflow:hidden}
.chip .ph img{position:absolute;inset:18px;width:calc(100% - 36px);height:calc(100% - 36px);object-fit:contain}
.chip .nm{padding:18px 22px;font-size:34px;font-weight:600;text-align:center;color:var(--ink);background:var(--card);line-height:1.25}
.chip.newpose .nm{color:var(--gold-dk)}
.chip.newpose .ph{background:repeating-linear-gradient(135deg,#FBF5E4 0 26px,#F5EDD6 26px 52px)}
.newmark{font-size:92px;color:var(--gold);font-weight:700;line-height:1;text-align:center}
.newmark span{display:block;font-size:30px;color:var(--muted);font-weight:600;margin-top:10px}

/* ---------- placeholder ---------- */
.ph-box{
  width:100%;height:100%;flex:1 1 0;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  background:repeating-linear-gradient(135deg,#EDF1F5 0 30px,#E4E9EF 30px 60px);
  border-radius:16px;padding:60px;text-align:center;
}
.ph-box .ic{font-size:110px;line-height:1;color:var(--gold)}
.ph-box .t1{font-size:50px;font-weight:700;color:var(--ink)}
.ph-box .t2{font-size:32px;color:var(--muted);line-height:1.45;word-break:break-all;max-width:92%}
.ph-box code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:28px;background:rgba(17,24,39,.07);padding:6px 14px;border-radius:10px;display:inline-block;margin-top:6px}

/* ---------- title + section slides ---------- */
.slide.dark::before{
  background:
    radial-gradient(120% 100% at 12% -8%, rgba(212,175,55,.34) 0%, transparent 58%),
    radial-gradient(120% 100% at 100% 104%, rgba(232,139,0,.24) 0%, transparent 60%),
    linear-gradient(158deg,#3A2B15 0%,#241A0E 46%,#15100A 100%);
}
.bgimg{
  position:absolute;inset:0;background-position:center;background-size:cover;
  opacity:.34;mix-blend-mode:soft-light;filter:saturate(1.15) contrast(1.05);
}
.slide.dark{color:#fff}
.slide.dark h1.title{color:#fff}
.slide.dark .sub{color:#F3E6C4}
.slide.dark .eyebrow{color:var(--gold)}
.slide.dark .eyebrow::before{background:var(--gold)}
.slide.dark .progress{background:rgba(255,255,255,.14)}
.hero{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 300px;gap:38px}
.hero .big{
  font-family:"Anuphan",sans-serif;font-weight:700;font-size:150px;line-height:1.06;letter-spacing:-.02em;
  background:linear-gradient(176deg,#F7E6B4 0%,#E3C468 48%,#C29B31 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .lead{font-size:62px;line-height:1.36;color:#F6EEDC;font-weight:400;max-width:2700px}
.hero .rule{width:250px;height:8px;background:var(--gold);border-radius:4px;transform-origin:left center}
.hero .meta{font-size:42px;color:rgba(255,255,255,.66);line-height:1.5}
.hero .herologo{width:1320px;height:auto;margin-bottom:6px;margin-left:-26px}
.secnum{
  position:absolute;right:250px;bottom:190px;
  font-family:"Anuphan",sans-serif;font-size:500px;line-height:.8;font-weight:700;
  color:rgba(255,255,255,.07);
}

/* ============================================================
   ULTRA WIDE 48:9 — จอ 3 จอเรียงยาว จอละ 16:9 (3840x2160)
   ซ้าย  = ตำแหน่งในกระบวนการ (เสริม)
   กลาง = สไลด์หลัก เหมือนโหมดจอเดียวเป๊ะ ๆ
   ขวา  = ป้ายกำกับนิทรรศการ รายละเอียดที่ไม่พอลงจอหลัก (เสริม)
   ============================================================ */
.pane{position:absolute;top:0;left:0;width:3840px;height:2160px;overflow:hidden}
.pL,.pR{display:none}
html.ultra #stage{width:11520px}
html.ultra .pL{display:block;left:0}
html.ultra .pC{left:3840px}
html.ultra .pR{display:block;left:7680px}
/* เส้นแบ่งจอ (เปิดด้วย ?seam=1 ตอนจัดวาง) */
html.ultra.seam .pC,html.ultra.seam .pR{box-shadow:inset 3px 0 0 rgba(212,175,55,.55)}

/* ---------- โหมดจอเดียวยาว (จอ LED ผืนเดียว ไม่มีขอบจอคั่น) ----------
   ต่างจากโหมดแบ่ง 3 จอที่ตรงนี้: องค์ประกอบที่ควรมี "อันเดียวต่อจอ"
   เช่นแถบโลโก้ผู้สนับสนุนและโลโก้ AI NORA จะไม่ซ้ำ 3 ชุด
   เหลือแถบโลโก้ไว้ซ้ายสุด และโลโก้ AI NORA ไว้ขวาสุด ของผืนทั้งหมด   */
/* จัดการจริงใน wallDedupe() เพราะบาง pane ไม่มีโลโก้/wordmark
   จึงต้องดูจากลำดับซ้าย-ขวาของ pane ที่แสดงอยู่จริง */

/* ---------- pane รวมทุกจอ (span) — ใช้ผืนเดียวยาว 11520px ---------- */
.pW,.pLC,.pCR,.pCU{display:none}
/* รวมทั้งผนัง 3 จอ */
html.ultra .slide.span .pL,
html.ultra .slide.span .pC,
html.ultra .slide.span .pR{display:none}
html.ultra .slide.span .pW{display:block;left:0;width:11520px}
/* รวมซ้าย+กลาง เหลือจอขวาอิสระ */
html.ultra .slide.span-lc .pL,
html.ultra .slide.span-lc .pC{display:none}
html.ultra .slide.span-lc .pLC{display:block;left:0;width:7680px}
/* จอซ้ายอิสระ รวมกลาง+ขวา */
html.ultra .slide.span-cr .pC,
html.ultra .slide.span-cr .pR{display:none}
html.ultra .slide.span-cr .pCR{display:block;left:3840px;width:7680px}
/* จอกลางใช้เนื้อหาคนละแบบเมื่ออยู่โหมดจอยาว (เช่นการเทียบ 3 ทาง) */
html.ultra .slide.span-cu .pC{display:none}
html.ultra .slide.span-cu .pCU{display:block;left:3840px;width:3840px}

/* ปกใหญ่แบบรวมจอ */
.wide-hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:52px;padding:0 420px;text-align:center}
.wide-hero .herologo{width:1760px;height:auto}
.wide-hero .eyebrow{margin-bottom:0}
.wide-hero .big{
  font-family:"Anuphan",sans-serif;font-weight:700;font-size:236px;line-height:1.02;
  letter-spacing:-.03em;
  background:linear-gradient(176deg,#F7E6B4 0%,#E3C468 48%,#C29B31 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.wide-hero .lead{font-size:76px;line-height:1.34;color:#F6EEDC;font-weight:400;max-width:8200px}
.wide-hero .meta{font-size:52px;color:rgba(255,255,255,.66);line-height:1.5}
.wide-hero .logos{align-self:center}

/* ปกหมวดแบบรวมจอ: เลขใหญ่ซ้าย · ชื่อขั้นกลาง · บันไดขั้นตอนเรียงยาวด้านล่าง */
.wide-sec{position:absolute;inset:150px 260px 420px;display:flex;align-items:center;gap:150px}
.wide-sec .num{
  flex:0 0 auto;font-size:900px;line-height:.78;font-weight:700;letter-spacing:-.05em;
  background:linear-gradient(176deg,#F7E6B4 0%,#D9B658 55%,#A9821F 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.wide-sec .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:44px}
.wide-sec .tx .big{
  font-family:"Anuphan",sans-serif;font-weight:700;font-size:260px;line-height:1.04;
  letter-spacing:-.03em;color:#fff;
}
.wide-sec .tx .lead{font-size:80px;line-height:1.34;color:#F3E6C4;max-width:6600px}
/* ปกขั้นตอนบนจอกลางจอเดียว (3840px) — เลขอยู่บน ชื่อขั้นตอนอยู่ล่าง */
.pCU .wide-sec{inset:170px 210px 240px;flex-direction:column;align-items:flex-start;
  justify-content:center;gap:56px}
.pCU .wide-sec .num{font-size:430px;line-height:.78}
.pCU .wide-sec .tx{gap:32px}
.pCU .wide-sec .tx .big{font-size:132px}
.pCU .wide-sec .tx .lead{font-size:56px;max-width:3350px}
.secfoot{position:absolute;left:210px;bottom:120px}
/* ---------- กองภาพตัวอย่าง วางเอียงซ้อนกันเหมือนกองรูปถ่าย ---------- */
.pstack{position:relative;flex:1;min-width:0;min-height:0}
.pstack .pc{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) translate(var(--x),var(--y)) rotate(var(--r));
  background:#FFFDF8;padding:26px 26px 18px;border-radius:12px;
  box-shadow:0 46px 90px -34px rgba(0,0,0,.6),0 0 0 2px rgba(17,24,39,.07);
  display:flex;flex-direction:column;gap:12px;
}
.pstack .pc img{height:var(--ih,1180px);width:auto;max-width:none;object-fit:contain;display:block;border-radius:4px}
.pstack .pc i{font-style:normal;font-size:34px;font-weight:600;color:#4B5563;text-align:center;line-height:1.2}
/* กองย่อสำหรับปกขั้นตอนบนจอเดียว 16:9 */
.pstack.side{position:absolute;left:auto;right:170px;top:0;bottom:0;width:1720px;flex:none}
.pstack.side .pc{padding:20px 20px 14px}
.pstack.side .pc img{height:var(--ih,1120px)}
.pstack.side .pc i{font-size:30px}
.hero.dvd{padding-right:2020px}

.wide-foot{position:absolute;left:260px;bottom:150px}

html.motion .slide.on .wide-hero .herologo{animation:riseIn .9s cubic-bezier(.2,.7,.3,1) both}
html.motion .slide.on .wide-hero .big     {animation:riseIn .9s cubic-bezier(.2,.7,.3,1) .14s both}
html.motion .slide.on .wide-hero .lead    {animation:riseIn .9s cubic-bezier(.2,.7,.3,1) .3s both}
html.motion .slide.on .wide-sec .num      {animation:riseIn 1s cubic-bezier(.2,.7,.3,1) both}
html.motion .slide.on .wide-sec .tx .big  {animation:riseIn .9s cubic-bezier(.2,.7,.3,1) .16s both}
html.motion .slide.on .wide-sec .tx .lead {animation:riseIn .9s cubic-bezier(.2,.7,.3,1) .3s both}
html.motion .slide.on .pstack .pc{animation:dealIn .85s cubic-bezier(.2,.7,.3,1) both;
  animation-delay:calc(var(--i) * .13s)}
@keyframes dealIn{
  from{opacity:0;
    transform:translate(-50%,-50%) translate(var(--x),calc(var(--y) + 110px)) rotate(0deg) scale(.93)}
  to  {opacity:1;
    transform:translate(-50%,-50%) translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}
}

/* ---------- เลย์เอาต์ในผืนกว้าง (2 จอ = 7680 / 3 จอ = 11520) ---------- */
.wideband{position:absolute;inset:0;display:flex;flex-direction:column;padding:120px 150px 150px}
.wideband .wb-hd{display:flex;align-items:flex-start;gap:60px;margin-bottom:44px}
.wideband .wb-hd .t{flex:1;min-width:0}
.wideband h2{font-size:110px;font-weight:700;color:var(--ink);line-height:1.12;letter-spacing:-.02em}
.slide.dark .wideband h2{color:#fff}
.wideband .wb-sub{margin-top:16px;font-size:46px;color:var(--body);line-height:1.32}
.slide.dark .wideband .wb-sub{color:#EFE3CB}
.wideband .wb-body{flex:1;min-height:0;display:flex;align-items:stretch;gap:80px}
.wideband .wb-body > *{min-height:0}
.wideband .wb-body > .duowide{max-width:5800px;margin:0 auto}
/* คู่ภาพแนวตั้ง (ต้นฉบับ/ฟื้นฟู) — บีบให้แคบกว่าคู่วิดีโอ ไม่เหลือพื้นว่างสองข้าง */
.wideband .wb-body > .duowide.portrait{max-width:4600px}
.wideband .wb-body > .cmp{flex:1;min-width:0;height:100%}
.wideband .wb-ft{margin-top:40px;display:flex;align-items:center;gap:40px;
  font-size:34px;color:var(--muted);font-weight:500}
.wideband .wb-ft .grow{flex:1}

/* แถบท่ารำเรียงยาว (ท่าครู ๑๒ ท่า) */
.strip{flex:1;min-width:0;height:100%;display:flex;align-items:stretch;gap:22px}
.strip .cell{flex:1;min-width:0;background:var(--card);border:3px solid var(--line);border-radius:26px;
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 50px -36px rgba(17,24,39,.4)}
.strip .cell .im{flex:1;min-height:0;position:relative;background:var(--paper-2);overflow:hidden}
.strip .cell .im img{position:absolute;inset:16px;width:calc(100% - 32px);height:calc(100% - 32px);object-fit:contain}
.strip .cell .nm{padding:16px 12px;font-size:30px;font-weight:600;text-align:center;color:var(--ink);line-height:1.2}
.strip .cell .no{position:absolute}
.strip.two .cell{display:flex}
.strip .cell .duo{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:12px;background:var(--paper-2)}
.strip .cell .duo > div{flex:1;min-height:0;display:grid;place-items:center;position:relative;overflow:hidden}
.strip .cell .duo > div img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain}
.strip .cell .duo > div i{position:absolute;left:8px;top:6px;font-style:normal;font-size:22px;font-weight:700;
  color:var(--muted);background:rgba(255,255,255,.85);border-radius:8px;padding:2px 10px}

/* ไทม์ไลน์กระบวนการเรียงยาว */
.tline2{flex:1;height:100%;display:flex;align-items:center;gap:0;position:relative}
.tline2::before{content:"";position:absolute;left:120px;right:120px;top:50%;height:8px;
  background:linear-gradient(90deg,var(--gold),var(--saffron));border-radius:4px;opacity:.5}
.tline2 .node{flex:1;display:flex;flex-direction:column;align-items:center;gap:26px;position:relative}
.tline2 .dot{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;
  font-size:70px;font-weight:700;color:#2E2405;background:var(--gold);
  box-shadow:0 0 0 18px var(--paper),0 26px 54px -30px rgba(166,132,31,.8)}
.slide.dark .tline2 .dot{box-shadow:0 0 0 18px #1B1408,0 26px 54px -30px rgba(0,0,0,.7)}
.tline2 .cap{text-align:center;max-width:1500px}
.tline2 .cap b{display:block;font-size:52px;font-weight:600;color:var(--ink);line-height:1.2}
.tline2 .cap span{display:block;font-size:34px;color:var(--muted);margin-top:10px;line-height:1.3}
.slide.dark .tline2 .cap b{color:#fff}
.slide.dark .tline2 .cap span{color:rgba(255,255,255,.66)}

/* การ์ดสรุป / เครดิต */
.sumgrid{flex:1;height:100%;display:flex;align-items:stretch;gap:34px}
.sumgrid .kpi{flex:1;background:rgba(255,255,255,.06);border:3px solid rgba(255,255,255,.16);
  border-radius:34px;padding:56px 52px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.sumgrid .kpi b{font-size:190px;line-height:.9;font-weight:700;
  background:linear-gradient(176deg,#F7E6B4,#D9B658 55%,#A9821F);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sumgrid .kpi span{font-size:46px;color:#F1E6CE;line-height:1.3;font-weight:500}
/* แผ่นข้อชี้แจง — ข้อความยาวกว่าตัวเลขสรุป จัดชิดบนและขยายตัวอักษร */
.sumgrid.facecol .kpi{gap:30px;padding:70px 60px}
.sumgrid.facecol .kpi b{font-size:150px}
.sumgrid.facecol .kpi span{font-size:62px}
.credits{flex:1;height:100%;display:flex;gap:100px;align-items:center}
.credits .col{flex:1;display:flex;flex-direction:column;gap:26px}
.credits .col h3{font-size:44px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.credits .col p{font-size:42px;line-height:1.4;color:#F1E6CE}
.credits .col p small{display:block;font-size:32px;color:rgba(255,255,255,.6);margin-top:6px}

/* คู่ภาพ/วิดีโอในผืนกว้าง */
.duowide{flex:1;min-width:0;height:100%;display:grid;grid-template-columns:1fr auto 1fr;gap:70px;align-items:stretch}
.trio{flex:1;display:flex;flex-direction:column;gap:0}
.facebox{flex:0 0 auto;min-width:0;height:100%;display:flex;align-items:stretch;justify-content:center;
  background:rgba(255,255,255,.06);border:3px solid rgba(255,255,255,.16);border-radius:28px;padding:26px}
.facebox img{align-self:stretch;height:auto;width:auto;max-width:100%;object-fit:contain;border-radius:12px}

html.motion .slide.on .wideband h2      {animation:riseIn .7s cubic-bezier(.2,.7,.3,1) .06s both}
html.motion .slide.on .wideband .wb-sub {animation:riseIn .7s cubic-bezier(.2,.7,.3,1) .14s both}
html.motion .slide.on .strip .cell      {animation:riseIn .6s cubic-bezier(.2,.7,.3,1) both;
                                         animation-delay:calc(.18s + var(--i,0) * .055s)}
html.motion .slide.on .tline2 .node     {animation:riseIn .7s cubic-bezier(.2,.7,.3,1) both;
                                         animation-delay:calc(.2s + var(--i,0) * .1s)}
html.motion .slide.on .sumgrid .kpi     {animation:riseIn .7s cubic-bezier(.2,.7,.3,1) both;
                                         animation-delay:calc(.2s + var(--i,0) * .1s)}
html.motion .slide.on .credits .col     {animation:riseIn .7s cubic-bezier(.2,.7,.3,1) both;
                                         animation-delay:calc(.2s + var(--i,0) * .12s)}

/* ---------- จอซ้าย: ตำแหน่งในกระบวนการ ---------- */
.wl{position:absolute;inset:120px 150px 150px;display:flex;flex-direction:column;gap:44px}
.wl-logo{width:520px;height:auto}
.wl-head{font-size:44px;font-weight:700;letter-spacing:.16em;color:var(--gold-dk);text-transform:uppercase}
.slide.dark .wl-head{color:var(--gold)}
.ladder{list-style:none;display:flex;flex-direction:column;gap:26px;margin-top:6px}
.ladder li{
  display:flex;align-items:flex-start;gap:30px;padding:26px 34px;border-radius:26px;
  border:3px solid var(--line);background:rgba(255,255,255,.72);
}
.slide.dark .ladder li{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.05)}
.ladder .no{
  flex:0 0 auto;width:78px;height:78px;border-radius:20px;display:grid;place-items:center;
  font-size:36px;font-weight:700;background:var(--paper-2);color:var(--muted);
}
.slide.dark .ladder .no{background:rgba(255,255,255,.10);color:rgba(255,255,255,.62)}
.ladder .tx b{display:block;font-size:46px;font-weight:600;color:var(--ink);line-height:1.2}
.ladder .tx span{display:block;font-size:32px;color:var(--muted);margin-top:6px;line-height:1.3}
.slide.dark .ladder .tx b{color:#fff}
.slide.dark .ladder .tx span{color:rgba(255,255,255,.6)}
.ladder li.cur{border-color:var(--gold);background:var(--gold-soft);
  box-shadow:0 20px 46px -30px rgba(166,132,31,.6)}
.slide.dark .ladder li.cur{background:rgba(212,175,55,.16);border-color:var(--gold)}
.ladder li.cur .no{background:var(--gold);color:#2E2405}
.ladder li.cur .tx b{color:var(--gold-dk)}
.slide.dark .ladder li.cur .tx b{color:var(--gold)}
.wl .grow{flex:1}
.wl-num{
  position:absolute;right:150px;bottom:210px;font-size:430px;line-height:.8;font-weight:700;
  color:rgba(17,24,39,.085);letter-spacing:-.04em;
}
.slide.dark .wl-num{color:rgba(255,255,255,.07)}

/* ---------- จอขวา: ป้ายกำกับนิทรรศการ ---------- */
.wr{position:absolute;inset:120px 150px 150px;display:flex;flex-direction:column;gap:34px}
.wr h2{font-size:88px;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:-.015em}
.slide.dark .wr h2{color:#fff}
.wr-rows{display:flex;flex-direction:column;gap:0;margin-top:6px}
.wr-rows > div{display:flex;gap:40px;padding:30px 0;border-top:3px solid var(--line);align-items:baseline}
.wr-rows > div:last-child{border-bottom:3px solid var(--line)}
.slide.dark .wr-rows > div{border-color:rgba(255,255,255,.16)}
.wr-rows dt{flex:0 0 520px;font-size:36px;font-weight:600;color:var(--muted);line-height:1.3}
.wr-rows dd{flex:1;font-size:42px;font-weight:500;color:var(--ink);line-height:1.32}
.slide.dark .wr-rows dd{color:#F4EEDF}
.wr-note{
  font-size:38px;line-height:1.45;color:var(--body);
  border-left:8px solid var(--gold);padding:8px 0 8px 34px;
}
.slide.dark .wr-note{color:#EDE3CE}
.wr-src{font-size:32px;color:var(--muted);line-height:1.4}
.wr-tail{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.wr-count{
  font-size:120px;font-weight:700;line-height:.9;letter-spacing:-.02em;
  color:rgba(17,24,39,.14);font-variant-numeric:tabular-nums;
}
.slide.dark .wr-count{color:rgba(255,255,255,.16)}
.wr-url{
  display:inline-flex;align-items:center;gap:24px;
  font-size:52px;font-weight:700;color:var(--gold-dk);letter-spacing:.02em;
}
.wr-url::before{content:"";width:80px;height:6px;background:var(--gold);border-radius:3px}
.slide.dark .wr-url{color:var(--gold)}

/* สลับโลโก้ตามพื้นหลัง — วางไว้ท้ายและเจาะจงกว่า .wordmark img{display:block} */
.slide img.lg-light{display:none}
.slide.dark img.lg-dark{display:none}
.slide.dark img.lg-light{display:block}

html.motion .slide.on .wl-logo {animation:riseIn .7s cubic-bezier(.2,.7,.3,1) both}
html.motion .slide.on .wl-head {animation:riseIn .7s cubic-bezier(.2,.7,.3,1) .08s both}

html.motion .slide.on .wr-url      {animation:fadeIn .8s ease .66s both}

/* ============================================================
   ANIMATION — เล่นใหม่ทุกครั้งที่สไลด์ถูกแสดง
   ปิดทั้งหมดได้ด้วย ?nomotion=1
   ============================================================ */
@keyframes riseIn{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes inL{from{opacity:0;transform:translateX(-90px) scale(.97)}to{opacity:1;transform:none}}

@keyframes popIn{0%{opacity:0;transform:scale(.4)}60%{transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
@keyframes wipeX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.055)}}
@keyframes settle{from{transform:scale(1.03)}to{transform:scale(1)}}
@keyframes nudgeX{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes numIn{from{opacity:0;transform:translateY(90px) scale(.94)}to{opacity:.07;transform:none}}

html.motion .slide.on .eyebrow          {animation:riseIn .55s cubic-bezier(.2,.7,.3,1) both}

html.motion .slide.on h1.title          {animation:riseIn .62s cubic-bezier(.2,.7,.3,1) .07s both}

html.motion .slide.on .cmp > .panel:last-child  {animation:inR .75s cubic-bezier(.2,.7,.3,1) .34s both}
html.motion .slide.on .combine > .panel         {animation:inR .75s cubic-bezier(.2,.7,.3,1) .38s both}

                                                   nudgeX 2.6s ease-in-out 1.2s infinite}

                                         animation-delay:calc(.22s + var(--i,0) * .09s)}

                                         animation-delay:calc(.3s + var(--i,0) * .09s)}
html.motion .slide.on .panel .body video{animation:settle 1.4s cubic-bezier(.2,.7,.3,1) both}
html.motion .slide.on .newmark          {animation:glow 2.4s ease-in-out .6s infinite}

html.motion .slide.dark.on .herologo    {animation:riseIn .8s cubic-bezier(.2,.7,.3,1) both}
html.motion .slide.dark.on .hero .big   {animation:riseIn .8s cubic-bezier(.2,.7,.3,1) .16s both}
html.motion .slide.dark.on .hero .rule  {animation:wipeX .7s cubic-bezier(.2,.7,.3,1) .42s both}
html.motion .slide.dark.on .hero .lead  {animation:riseIn .8s cubic-bezier(.2,.7,.3,1) .5s both}
html.motion .slide.dark.on .hero .meta  {animation:riseIn .8s cubic-bezier(.2,.7,.3,1) .62s both}
html.motion .slide.dark.on .secnum      {animation:numIn 1.1s cubic-bezier(.2,.7,.3,1) .3s both}
html.motion .slide.dark.on .bgimg       {animation:kb 18s ease-out both}

/* ---------- controls ---------- */
#ui{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:999px;
  background:rgba(12,16,22,.84);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.14);
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;
}
#ui.show{opacity:1;pointer-events:auto}
#ui button{
  appearance:none;border:0;background:rgba(255,255,255,.10);color:#fff;
  font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer;
}
#ui button:hover{background:rgba(255,255,255,.22)}
#ui button.on{background:var(--gold);color:#2E2405}
#ui .sep{width:1px;height:22px;background:rgba(255,255,255,.18)}
#ui .grp{display:flex;align-items:center;gap:10px}
#ui [data-panels].hide{display:none}
#ui .info{color:var(--gold);font-size:13px;font-weight:600;padding:0 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>

<body>
<div id="viewport"><div id="stage"></div></div>

<div id="ui">
  <button data-act="prev">◀</button>
  <button data-act="toggle">⏸ หยุด</button>
  <button data-act="next">▶</button>
  <span class="info" id="uiInfo">–</span>
  <span class="sep"></span>
  <button data-mode="0" data-fam="s" title="จอเดียว 16:9">16:9</button>
  <button data-mode="w" data-fam="w" title="จอ 3 จอเรียงกัน จอละ 16:9">48:9 แบ่ง 3</button>
  <span class="sep" data-panels></span>
  <span class="grp" data-panels>
    <button data-mode="0" title="เนื้อหาหลักจอเดียว ไม่แบ่งจอ">เดี่ยว</button>
    <button data-mode="1" title="เฉพาะจอซ้าย">จอ 1</button>
    <button data-mode="2" title="เฉพาะจอกลาง">จอ 2</button>
    <button data-mode="3" title="เฉพาะจอขวา">จอ 3</button>
  </span>
  <span class="sep"></span>
  <button data-act="full">⛶ เต็มจอ</button>
  <button data-act="restart">↻ เริ่มใหม่</button>
</div>

<script>
/* ================================================================
   1. CONFIG — แก้ได้ตรงนี้
   ================================================================ */
const CONFIG = {
  SHOW_DIVIDERS : true,   // false = เอาสไลด์ปกขั้นตอนออก
  /* ---- เปิด/ปิดช่วงที่สื่อยังไม่พร้อม ----------------------------------
     นิทรรศการเปิดให้คนนอกดู ถ้าไฟล์ยังไม่มา สไลด์จะขึ้นกล่อง "อยู่ระหว่างจัดเตรียม"
     ซ้ำ ๆ หลายสิบหน้า ให้ตั้งเป็น false ปิดช่วงนั้นไปเลย
     รอบการแสดงจะยืดหน้าที่เหลือให้ครบ 30 นาทีเองโดยอัตโนมัติ            */
  SHOW_COLORIZE : true,   // 22 หน้า — ต้องมีไฟล์ใน assets/color/
  SHOW_TWOSETS  : true,   // 12 หน้า — ต้องมีไฟล์ใน assets/drive/
  SHOW_STUDENT  : true,   //  4 หน้า — ต้องมีไฟล์ assets/students/นักศึกษา-N.mp4
  SHOW_CLASSROOM: true,   //  2 หน้า — ต้องมีไฟล์ assets/students/นักเรียน-N.mp4
  /* ---- ผังรายการ 30 นาที : วินาทีต่อหน้า (แก้ตัวเลขที่นี่ที่เดียว) ----
     ทุกหน้ามีเวลาคงที่ ไทม์ไลน์จึงคาดเดาได้ ทุกจอซิงก์กันได้แม้ไฟล์สื่อยังไม่ครบ
     คลิปวิดีโอตั้ง loop ไว้ ถ้าคลิปสั้นกว่าเวลาหน้าจะวนซ้ำในหน้าเดียว   */
  DWELL : {
    title     : 14,   // ปกใหญ่

   ถ้าจะใช้ PNG ต้นฉบับแทน ให้ตัด .replace(...) บรรทัดล่างออก                */

/* ?dev=1 = โหมดผู้ดูแล เห็นชื่อไฟล์ที่ยังขาดบนกล่องว่าง
   ค่าปกติ (ไม่ใส่) = โหมดนิทรรศการ ไม่โชว์ path ให้คนดูเห็น */
const DEV = /[?&]dev=1/.test(location.search);
function phBox(kind, file){
  let f = String(file || '');
  if(/^data:/.test(f)) f = '(ภาพที่ฝังในไฟล์)';
  else if(f.length > 90) f = f.slice(0, 88) + '…';
  const dev = DEV ? `<div class="t2">วางไฟล์ไว้ที่<code>${esc(f)}</code></div>` : '';
  return `<div class="ph-box"><div class="ic">${kind==='video'?'▶':'▧'}</div>
    <div class="t1">${kind==='video'?'วิดีโอ':'ภาพ'}ส่วนนี้อยู่ระหว่างจัดเตรียม</div>
    ${dev || '<div class="t2">โครงการยังดำเนินอยู่ — ส่วนนี้จะเพิ่มเข้ามาในนิทรรศการเร็ว ๆ นี้</div>'}
    </div>`;
}
/* media builders — เก็บรายการไฟล์สำรองไว้ใน data-srcs
   ถ้าไฟล์แรกโหลดไม่ได้จะไล่ลองไฟล์ถัดไป ถ้าหมดแล้วจึงขึ้นกล่อง "รอไฟล์" */
/* เดิมลอง .webm ต่อท้าย — ตัดออก ให้เหลือ request เดียวต่อไฟล์ */
const alt = p => [p];
function mediaImg(paths){
  const L = Array.isArray(paths) ? paths : [paths];
  return `<img alt="" data-srcs='${esc(JSON.stringify(L))}' data-i="0" src="${enc(L[0])}">`;
}
function mediaVid(paths, extraClass){
  const L = Array.isArray(paths) ? paths : [paths];
  return `<video class="v ${extraClass||''}" muted playsinline preload="metadata"
    data-srcs='${esc(JSON.stringify(L))}' data-i="0" src="${enc(L[0])}"></video>`;
}

const ROT = [-7, 4.5, -3.5, 7, -5];
const OFF = [34, -30, 26, -34, 30];
function photoStack(items, opt){
  const o = opt || {}, n = items.length;
  const step = o.step || (n > 3 ? 760 : 900);
  return `<div class="pstack ${o.cls || ''}">` + items.map((it,i)=>{
    const x = Math.round((i - (n-1)/2) * step);
    return `<div class="pc" style="--x:${x}px;--y:${OFF[i % OFF.length]}px;`
         + `--r:${ROT[i % ROT.length]}deg;--i:${i};z-index:${i+1}`
         + (o.ih ? `;--ih:${o.ih}px` : '') + `">`
         + mediaImg(it.srcs) + `<i>${esc(it.tag)}</i></div>`;
  }).join('') + `</div>`;
}

        ['จำนวนท่าที่นำมาใช้','๑๒ ท่า']],

     + 'แถวล่างคือผลการฟื้นฟูที่จะเห็นทีละท่าในขั้นตอนถัดไป',
  },
  wide:()=> band({ eyebrow:stepEB(0), title:'ท่าครู ๑๒ ท่า ในตำราฟ้อนรำ พ.ศ. ๒๔๖๖',
    sub:'แถวบน ภาพสแกนจากตำรา · แถวล่าง ผลการฟื้นฟูในขั้นตอนที่ 02',
    body:`<div class="strip">${STRIP12}</div>` }),
  html: frame({ eyebrow:stepEB(0), title:'ท่าครู ๑๒ ท่า ในตำรา',
    section:SECTIONS[0].n+' '+SECTIONS[0].t,
    sub:'แถวบน ภาพสแกนจากตำรา · แถวล่าง ผลการฟื้นฟูในขั้นตอนที่ 02',
    body:`<div class="strip" style="flex-wrap:wrap">${STRIP12}</div>` })});

/* ---- ขั้นที่ 02 ฟื้นฟูภาพ ---- */
divider(1);

/* 12 คู่เปรียบเทียบ — โหมด 2｜1 */
PAIRS.forEach((p,i)=>{
  const fixed = imgFix(p).map(mediaImg).join('');
  const cmpBody = `<div class="duowide portrait">
      ${panel('ภาพสแกนจากตำรา', p.n, mediaImg(imgOrig(p)))}

  const W = { head:stepEB(1), title:p.book,
      rows:[['ชื่อท่า', p.book],
            ['ลำดับในชุด', p.n + ' จาก ๑๒ ท่า'],
            ['ชุดท่า', 'ท่าครู สิบสองท่า']]

  push({ dur:D.compare, step:1, spanLC:true, wall:W,
    lc:()=> band({ eyebrow:stepEB(1),

/* ---- ขั้นที่ 03 สร้างการเคลื่อนไหว — โหมด 1｜2 ---- */
divider(2);
VIDEOS.forEach(([id,title],i)=>{
  const poses = title.split('→').map(x=>x.trim());
  const chips = poses.map((nm,k)=>{
    const isNew = /ท่าใหม่/.test(nm);
    const srcs  = poseSrc(id, k, nm);
    const fb    = isNew ? ['✦','ท่าที่ AI สร้างใหม่'] : ['▧','ภาพท่านี้อยู่ระหว่างจัดเตรียม'];
    return `<div class="chip${isNew?' newpose':''}" style="--i:${k}">
        <div class="ph"><img alt="" data-chip="1" data-fb='${esc(JSON.stringify(fb))}'
          data-srcs='${esc(JSON.stringify(srcs))}' data-i="0" src="${enc(srcs[0])}"></div>
        <div class="nm">${esc(nm)}</div></div>`;
  }).join('');
  const cells = poses.map((nm,k)=>{
    const isNew = /ท่าใหม่/.test(nm);
    return poseCell(k, nm, poseSrc(id, k, nm),
      isNew ? ['✦','ท่าที่ AI สร้างใหม่'] : ['▧','ภาพท่านี้อยู่ระหว่างจัดเตรียม']);
  }).join('');
  const nNew = poses.filter(x=>/ท่าใหม่/.test(x)).length;
  push({ dur:D.combine, step:2, vids:[id], spanCR:true,
    section:stepFoot(2, i+1, VIDEOS.length),
    wall:{ head:stepEB(2), title:title,
      rows:[['จำนวนท่าที่ใช้', poses.length + ' ท่า'],
            ['ลำดับท่า', poses.join('  →  ')],
            ['ท่าที่ AI สร้างใหม่', nNew ? nNew + ' ท่า' : 'ไม่มี — ใช้ท่าดั้งเดิมทั้งหมด'],
            ['ที่มาของภาพท่า', 'ภาพท่ารำที่ฟื้นฟูจากตำรา ๒๔๖๖']],
      note:'นำภาพท่ารำมาต่อกันเป็นลำดับ แล้วให้ AI สร้างช่วงเชื่อมระหว่างท่า จนได้การเคลื่อนไหวที่ต่อเนื่องจากภาพนิ่ง',
      },
    /* จอซ้ายใช้บันไดขั้นตอนตามค่าเริ่มต้น (paneL) ไม่ซ้ำกับการ์ดท่ารำที่อยู่ถัดไป
       จอกลาง+ขวารวมกันเป็นสมการ  ภาพท่า + ภาพท่า = วิดีโอ  เต็มผืน 7680px
       (คลิปเป็นแนวตั้ง 9:16 ถ้าวางคลิปเดี่ยวกลางผืนจะเหลือที่ว่างข้างละมาก) */
    cr:()=> band({ eyebrow:stepEB(2), title:esc(title),
      sub:'คลิปที่ ' + (i+1) + ' จาก ' + VIDEOS.length + ' · ประกอบจาก ' + poses.length
        + ' ท่า — ปัญญาประดิษฐ์สร้างช่วงเชื่อมระหว่างท่า',
      body:`<div class="combine wide">
        <div class="chips n${Math.min(poses.length,4)}">${chips}</div>
        <div class="arrow">»<small>ได้เป็น</small></div>
        ${panel('วิดีโอที่ AI สร้างได้','ผลลัพธ์', mediaVid(vurl(id)), true)}
      </div>` }),
    html: frame({ eyebrow:stepEB(2),
      section:stepFoot(2, i+1, VIDEOS.length),
      title:esc(title),
      sub:`คลิปที่ ${i+1} จาก ${VIDEOS.length} · ประกอบจาก ${poses.length} ท่า`,
      body:`<div class="combine">
        <div class="chips n${Math.min(poses.length,4)}">${chips}</div>
        <div class="arrow">»<small>ได้เป็น</small></div>
        ${panel('วิดีโอที่ AI สร้างได้','ผลลัพธ์', mediaVid(vurl(id)), true)}
      </div>` })});
});

            ['สิ่งที่เพิ่มเข้ามา', 'สีเครื่องแต่งกาย เครื่องประดับ และฉาก']],
      note:'ภาพในตำราเป็นภาพขาวดำ วิดีโอที่สร้างจึงเป็นขาวดำตามต้นฉบับ '

            ['จอขวา', 'ผลการสร้างรอบที่ ๒'],
            ['ข้อมูลตั้งต้น', 'ลำดับท่าเดียวกันทั้งสองรอบ']],

    left:()=> band({ eyebrow:'ข้อมูลตั้งต้น', h2:74, title:esc(first),
      sub:'ภาพท่าที่ป้อนให้ปัญญาประดิษฐ์',
      body:`<div class="cmp solo">${panel('ภาพท่าต้นทาง','ท่าแรก',
        `<img alt="" data-chip="1" data-fb='${esc(JSON.stringify(['▧','ภาพท่านี้อยู่ระหว่างจัดเตรียม']))}'
           data-srcs='${esc(JSON.stringify(poseSrcs))}' data-i="0" src="${enc(poseSrcs[0])}">`)}</div>` }),
    midU:()=> band({ eyebrow:'ผลการสร้างรอบที่ ๑', h2:74, title:esc(title),
      sub:'สร้างจากลำดับท่าที่บันทึกไว้',
      body:`<div class="cmp solo">${panel('วิดีโอรอบที่ ๑','รอบ ๑', mediaVid(vurl(id)), true)}</div>` }),
    right:()=> band({ eyebrow:'ผลการสร้างรอบที่ ๒', h2:74, title:'ลำดับท่าเดิม สร้างใหม่อีกรอบ',
      sub:'อินพุตเดียวกัน — ผลลัพธ์ต่างกันในรายละเอียด',
      body:`<div class="cmp solo">${panel('วิดีโอรอบที่ ๒','รอบ ๒', mediaVid(drv(file).flatMap(alt)), true)}</div>` }),
    html: frame({ eyebrow:stepEB(3),
      section:stepFoot(3, i+1, DRIVE_PAIRS.length), title:esc(title),
      sub:'คลิปที่ ' + (i+1) + ' จาก ' + DRIVE_PAIRS.length
        + ' · ลำดับท่าเดียวกันที่บันทึกไว้ สั่งสร้างใหม่ได้อีกรอบ',
      body:`<div class="cmp">
        ${panel('ผลการสร้างรอบที่ ๑','รอบ ๑', mediaVid(vurl(id)))}
        <div class="arrow">»<small>เทียบกับ</small></div>
        ${panel('ผลการสร้างรอบที่ ๒','รอบ ๒', mediaVid(drv(file).flatMap(alt)), true)}
      </div>` })});

      note:'ขั้นตอนนี้เป็นการตรวจสอบกลับ ถ้าคนรำตามได้จริง แปลว่าท่ารำที่ AI ออกแบบ '
         + 'ยังอยู่ในหลักการเคลื่อนไหวของโนรา ไม่ใช่ท่าที่เป็นไปไม่ได้ทางกายภาพ' },
    lc:()=> band({ eyebrow:stepEB(4) + ' — นักศึกษา', title:esc(title),
      sub:'คลิปที่ ' + (i+1) + ' จาก 4 · นำวิดีโอที่ AI สร้างไปให้นักศึกษารำตาม เพื่อตรวจว่ารำได้จริง',
      body }),
    html: frame({ eyebrow:stepEB(4) + ' — นักศึกษา',
      section:stepFoot(4, i+1, 4) + ' (นักศึกษา)',
      title:esc(title),
      sub:'คลิปที่ ' + (i+1) + ' จาก 4 · นักศึกษารำตามวิดีโอที่ AI สร้าง', body })});
});

      <p>ครูธรรมนิตย์ นิคมรัตน์<small>ศิลปินแห่งชาติ สาขาศิลปะการแสดง</small></p></div>

      <p>คณะศิลปกรรมศาสตร์<small>มหาวิทยาลัยทักษิณ</small></p></div>

push({ dur:D.credits, dark:true, step:-1, span:true, wall:{
  head:'เครดิต', title:'ที่มาและผู้ร่วมงาน',
  rows:[['ต้นฉบับท่ารำ','ตำราฟ้อนรำ ฉบับหอพระสมุดวชิรญาณ พ.ศ. ๒๔๖๖'],
        ['อ้างอิงการรำ','ครูธรรมนิตย์ นิคมรัตน์'],
        ['ดำเนินโครงการ','DIIS ม.สงขลานครินทร์ · คณะศิลปกรรมศาสตร์ ม.ทักษิณ'],
        ['สนับสนุน','สำนักงานศิลปวัฒนธรรมร่วมสมัย กระทรวงวัฒนธรรม']],
  note:'ขอบคุณครูโนราและผู้ถ่ายทอดองค์ความรู้ทุกท่านที่ทำให้ท่ารำเหล่านี้ยังมีลมหายใจ' },
  wide:()=> `<div class="bgimg"></div>` + band({ eyebrow:'เครดิต', title:'ที่มาและผู้ร่วมงาน', body:CREDITS }),
  html:`<div class="bgimg"></div>` + frame({ eyebrow:'เครดิต', title:'ที่มาและผู้ร่วมงาน', body:CREDITS })});

/* ================================================================
   4. RENDER + PLAYER
   ================================================================ */
/* อนิเมชัน: เติมคลาส motion ที่ <html> (ปิดด้วย ?nomotion=1 หรือ CONFIG.ANIMATE=false) */
const QS = new URLSearchParams(location.search);

/* โหมดจอยาว 48:9 — panel=1|2|3 คือแสดงเฉพาะจอซ้าย/กลาง/ขวา (กรณีแยกเครื่องต่อจอ) */
const PANEL = Math.max(0, Math.min(3, parseInt(QS.get('panel'), 10) || 0));
let WALL_ON  = QS.get('wall') === '1';                       // จอเดียวยาวเท่า 3 จอ
let ULTRA_ON = CONFIG.ULTRA || QS.get('ultra') === '1' || PANEL > 0 || WALL_ON;
let PANEL_ON = PANEL;      // จอที่กำลังแสดง (0 = ไม่ครอป) เปลี่ยนได้ด้วยปุ่มโหมด
if(WALL_ON) document.documentElement.classList.add('wall');
if(ULTRA_ON) document.documentElement.classList.add('ultra');
if(QS.get('seam') === '1') document.documentElement.classList.add('seam');

/* โหมดซิงก์ตามนาฬิกา — จอแยกเครื่องกันแต่คำนวณเวลาเดียวกัน จึงแสดงหน้าเดียวกันพร้อมกัน */
const SYNC = QS.get('sync') === '1' ? true
           : QS.get('sync') === '0' ? false
           : (CONFIG.SYNC === 'auto' ? PANEL > 0 : !!CONFIG.SYNC);

if(CONFIG.ANIMATE && QS.get('nomotion') !== '1' &&
   !matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.documentElement.classList.add('motion');
}
/* ภาพพื้นหลังลายไทยจากหน้าเว็บ ainora.psu.ac.th (ถ้าโหลดไม่ได้ก็เหลือแค่ gradient) */
if(CONFIG.HERO_BG){
  document.head.insertAdjacentHTML('beforeend',
    '<style>.bgimg{background-image:url("' + enc(CONFIG.HERO_BG) + '")}</style>');
}

const want2 = (a,b) => !PANEL || PANEL === a || PANEL === b;

const stage = document.getElementById('stage');
SLIDES.forEach((s,i)=>{
  const el = E('section','slide' + (s.cls ? ' ' + s.cls : ''));
  // ย้ายภาพพื้นหลังไปไว้ระดับสไลด์ ให้ต่อเนื่องข้ามทั้ง 3 จอในโหมด ultra wide
  const PROG = '<div class="progress"><i data-bar></i></div>';
  const hasBg = s.html.includes('<div class="bgimg"></div>');
  let mid = hasBg ? s.html.replace('<div class="bgimg"></div>','') : s.html;
  mid = mid.replace(PROG, '');                     // ย้ายไปไว้ระดับสไลด์
  // แยกเครื่องต่อจอ: สร้างแค่ pane ของจอนั้น ไม่ต้องถอดรหัสวิดีโอที่มองไม่เห็น
  const want = n => !PANEL || PANEL === n;
  // สร้าง pane ของทุกโหมดไว้เสมอ ปุ่มสลับโหมดจึงทำงานสดได้
  // (ไฟล์เดียวกันที่ถูกอ้างซ้ำ เบราว์เซอร์โหลดครั้งเดียวจากแคช และวิดีโอใน pane ที่ซ่อนถูกหยุดไว้)
  const U = true;
  el.innerHTML =
      (hasBg ? '<div class="bgimg"></div>' : '')
    + (want(1) ? '<div class="pane pL">' + (s.left ? s.left() : paneL(s.step)) + '</div>' : '')
    + (want(2) ? '<div class="pane pC">' + mid + '</div>' : '')
    + (want(3) ? '<div class="pane pR">' + (s.right ? s.right() : paneR(s.wall)) + '</div>' : '')
    + (U && s.wide           ? '<div class="pane pW">'  + s.wide() + '</div>'  : '')
    + (U && s.lc   && want2(1,2) ? '<div class="pane pLC">' + s.lc()   + '</div>' : '')
    + (U && s.cr   && want2(2,3) ? '<div class="pane pCR">' + s.cr()   + '</div>' : '')
    + (U && s.midU && want(2)    ? '<div class="pane pCU">' + s.midU() + '</div>' : '')
    + PROG;
  const c = el.querySelector('[data-count]');
  if(c) c.textContent = (i+1) + ' / ' + SLIDES.length;
  const c2 = el.querySelector('[data-count2]');
  if(c2) c2.textContent = String(i+1).padStart(2,'0') + ' / ' + SLIDES.length;
  s.el = el; s.bar = el.querySelector('[data-bar]');
  stage.appendChild(el);
});

/* fallback chain สำหรับไฟล์ที่หาไม่เจอ */
function attachFallback(node, kind){
  node.addEventListener('error', () => {
    if(!node.parentNode) return;                 // ถูกถอดออกไปแล้ว
    const srcs = JSON.parse(node.dataset.srcs || '[]');
    const next = (+node.dataset.i || 0) + 1;
    if(next < srcs.length){ node.dataset.i = next; node.src = enc(srcs[next]); if(node.load) node.load(); return; }

    const box = document.createElement('div');
    if(node.dataset.logo){
      let nm = '';
      try{ nm = JSON.parse(node.dataset.logo); }catch(e){ nm = node.alt || ''; }
      box.className = 'logobox';
      box.innerHTML = String(nm).split('\n').map(esc).join('<br>');
      node.replaceWith(box);
      return;
    }
    if(node.dataset.chip){
      let fb = ['▧','ภาพท่านี้อยู่ระหว่างจัดเตรียม'];
      try{ fb = JSON.parse(node.dataset.fb) || fb; }catch(e){}
      box.className = 'newmark';
      box.innerHTML = fb[0] + '<span>' + fb[1] + '</span>';
    } else {
      box.innerHTML = phBox(kind, srcs[0] || '');
    }
    node.replaceWith(box.className ? box : box.firstElementChild || box);
  });
}
stage.querySelectorAll('img[data-srcs]').forEach(n => attachFallback(n, 'image'));
stage.querySelectorAll('video[data-srcs]').forEach(n => {
  attachFallback(n, 'video');
  // ถ้าไฟล์พร้อมเล่นตอนที่สไลด์นี้กำลังแสดงอยู่ ให้เริ่มเล่นทันที
  n.addEventListener('loadeddata', () => {
    const sl = n.closest('.slide');
    if(playing && sl && sl.classList.contains('on')){ n.muted = true; n.play().catch(()=>{}); }
    const s = SLIDES[cur];
    if(!SYNC && s && s.el === sl) durMs = slideDuration(s);
  });
});

function fit(){
  const W = ULTRA_ON ? 11520 : 3840;        // ความกว้างเวทีจริง
  const pn = PANEL_ON;
  const vis = pn ? 3840 : W;                // ส่วนที่ต้องให้พอดีจอ
  const k = Math.min(innerWidth/vis, innerHeight/2160);
  const dx = pn ? (W/2 - (pn - 0.5) * 3840) : 0;   // เลื่อนให้จอที่เลือกมาอยู่กลาง
  stage.style.transform =
    'translate(-50%,-50%) scale(' + k + ') translateX(' + dx + 'px)';
}
addEventListener('resize', fit); fit();

let cur = -1, playing = true, t0 = 0, durMs = 0, raf = 0;

/* ================================================================
   ไทม์ไลน์คงที่ + นาฬิกาโลก (ใช้ในโหมด SYNC)
   ทุกเครื่องคำนวณจากสูตรเดียวกันและนาฬิกาเดียวกัน จึงตรงกันเองโดยไม่ต้องคุยกัน
   ความยาววิดีโออ่านจาก assets/durations.json (สร้างจาก frame-picker.html)
   ถ้าไม่มีไฟล์นั้นจะใช้ SEC_VIDEO_DEF เท่ากันทุกคลิป ซึ่งก็ยังตรงกันทุกจอ
   ================================================================ */
const TL = [];            // เวลาเริ่มของแต่ละหน้า (ms) สะสม
let CYCLE = 0;            // ความยาวรอบทั้งหมด (ms)
let STRETCH = 1;          // ตัวคูณให้รอบลงตัวตาม CYCLE_TARGET_SEC

function fixedDur(i){
  return (SLIDES[i].dur || 10) * 1000 * STRETCH;
}
function buildTimeline(){
  const nat = SLIDES.reduce((a,s)=> a + (s.dur || 10), 0);   // วินาทีตามตาราง DWELL
  STRETCH = CONFIG.CYCLE_TARGET_SEC ? (CONFIG.CYCLE_TARGET_SEC / nat) : 1;
  TL.length = 0; CYCLE = 0;
  for(let i = 0; i < SLIDES.length; i++){ TL.push(CYCLE); CYCLE += fixedDur(i); }
}
function clockPos(){
  const t = (((Date.now() - CONFIG.SYNC_EPOCH) % CYCLE) + CYCLE) % CYCLE;
  let i = TL.length - 1;
  while(i > 0 && TL[i] > t) i--;
  return { i, off: t - TL[i], dur: fixedDur(i) };
}

/* ทุกหน้าใช้เวลาคงที่ตามตาราง DWELL — โหมดปกติกับโหมดซิงก์จึงเดินเหมือนกันเป๊ะ */
function slideDuration(s){ return fixedDur(SLIDES.indexOf(s)); }

/* โหมดจอเดียวยาว: ของที่ควรมี "อันเดียวต่อจอ" ต้องไม่ซ้ำ 3 ชุดบนผืนเดียว
   เหลือแถบโลโก้ผู้สนับสนุนไว้ซ้ายสุด · โลโก้ AI NORA และเลขหน้าไว้ขวาสุด */
function wallDedupe(el){
  el.querySelectorAll('.logos,.wordmark,.ftr .count').forEach(n => { n.style.display = ''; });
  if(!WALL_ON) return;
  const panes = [...el.querySelectorAll('.pane')]
    .filter(p => p.offsetWidth > 0)
    .sort((a,b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left);
  const pick = sel => panes.map(p => p.querySelector(sel)).filter(Boolean);
  pick('.logos').slice(1).forEach(n => { n.style.display = 'none'; });          // เหลือซ้ายสุด
  pick('.wordmark').slice(0, -1).forEach(n => { n.style.display = 'none'; });   // เหลือขวาสุด
  pick('.ftr .count').slice(0, -1).forEach(n => { n.style.display = 'none'; });
}

function show(i, seekMs){
  if(cur >= 0){
    const p = SLIDES[cur];
    p.el.classList.remove('on');
    p.el.querySelectorAll('video').forEach(v => { try{ v.pause(); v.currentTime = 0; }catch(e){} });
  }
  cur = (i + SLIDES.length) % SLIDES.length;
  const s = SLIDES[cur];
  s.el.classList.add('on');
  wallDedupe(s.el);
  const seek = Math.max(0, (seekMs || 0) / 1000);
  // เล่นเฉพาะวิดีโอใน pane ที่แสดงอยู่จริง (pane ที่ซ่อนมี offsetWidth = 0)
  const all = [...s.el.querySelectorAll('video')];
  all.forEach(v => { const pn = v.closest('.pane'); if(pn && pn.offsetWidth === 0){ try{ v.pause(); }catch(e){} } });
  const vids = all.filter(v => { const pn = v.closest('.pane'); return !pn || pn.offsetWidth > 0; });
  vids.forEach(v => {
    v.muted = true;
    v.loop = true;                       // คลิปสั้นกว่าเวลาหน้า จะวนซ้ำในหน้าเดียว
    const align = () => {
      if(seek > 0 && isFinite(v.duration) && v.duration > 0.2){
        // คลิปสั้นกว่าเวลาหน้าและตั้ง loop ไว้ จึงหาตำแหน่งด้วยเศษของการหาร
        // ทุกเครื่องคำนวณเหมือนกัน จอ 3 จอจึงอยู่เฟรมเดียวกันแม้คลิปยาว 2 วินาที
        try{ v.currentTime = Math.min(seek % v.duration, v.duration - 0.05); }catch(e){}
      }
    };
    if(v.readyState >= 1) align();
    v.addEventListener('loadedmetadata', () => {
      align();
      if(!SYNC) durMs = slideDuration(s);
    }, { once:true });
    const pr = v.play(); if(pr && pr.catch) pr.catch(()=>{});
  });
  t0 = performance.now() - (seekMs || 0);
  durMs = SYNC ? fixedDur(cur) : slideDuration(s);
  // preload next slide's media
  const nx = SLIDES[(cur+1) % SLIDES.length];
  nx.el.querySelectorAll('video').forEach(v => {
    const pn = v.closest('.pane');
    if(pn && pn.offsetWidth === 0 && !nx.el.classList.contains('on')) { /* ยังบอกไม่ได้ ปล่อยผ่าน */ }
    if(v.preload!=='auto'){ v.preload='auto'; try{v.load();}catch(e){} }
  });
  const info = document.getElementById('uiInfo');
  if(info) info.textContent = (cur+1) + ' / ' + SLIDES.length
    + (PANEL_ON ? ' · จอ ' + PANEL_ON
       : WALL_ON ? ' · 48:9 ยาว'
       : ULTRA_ON ? ' · 48:9 แบ่ง 3' : '')
    + (SYNC ? ' · sync' : '');
}

function tick(now){
  raf = requestAnimationFrame(tick);
  if(SYNC){
    if(!playing) return;                       // หยุดดูชั่วคราว พอเล่นต่อจะกระโดดกลับเข้าจังหวะเอง
    const q = clockPos();
    if(q.i !== cur) show(q.i, q.off);
    const s = SLIDES[cur];
    if(s && s.bar) s.bar.style.width = (Math.min(1, q.off / q.dur) * 100).toFixed(2) + '%';
    return;
  }
  const s = SLIDES[cur];
  if(!s) return;
  if(!playing){ t0 = now - Math.min(now - t0, durMs); return; }
  const p = Math.min(1, (now - t0) / durMs);
  if(s.bar) s.bar.style.width = (p*100).toFixed(2) + '%';
  if(p >= 1) show(cur + 1);
}

function setPlaying(v){
  playing = v;
  document.querySelector('[data-act="toggle"]').textContent = v ? '⏸ หยุด' : '▶ เล่น';
  const s = SLIDES[cur];
  if(s) s.el.querySelectorAll('video').forEach(x => {
    const pn = x.closest('.pane');
    if(pn && pn.offsetWidth === 0) return;
    v ? x.play().catch(()=>{}) : x.pause();
  });
}

/* controls */
const ui = document.getElementById('ui');
const KIOSK = new URLSearchParams(location.search).get('kiosk') === '1';
let uiTimer;
addEventListener('mousemove', ()=>{
  if(KIOSK) return;
  ui.classList.add('show');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(()=>{ ui.classList.remove('show'); }, 3000);
});
/* ปุ่มสลับโหมดจอ — ทำงานสด ไม่ต้องแก้ URL */
/* ไฮไลต์ปุ่มให้ตรงกับโหมดปัจจุบัน และซ่อนกลุ่มเลือกจอเมื่อไม่ได้อยู่โหมด 16:9 */
function markMode(m){
  const single = !WALL_ON && (m === '0' || PANEL_ON > 0);
  ui.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x.dataset.mode === m));
  ui.querySelectorAll('[data-fam]').forEach(x =>
    x.classList.toggle('on', x.dataset.fam === (single ? 's' : 'w')));
  ui.querySelectorAll('[data-panels]').forEach(x => x.classList.toggle('hide', !single));
}

/* โหมดที่ให้เลือกมีสองกลุ่ม
     16:9        m = '0' (เดี่ยว) หรือ '1' '2' '3' (เลือกดูทีละจอของผัง 3 จอ)
     48:9 แบ่ง 3 m = 'w'
   ('wall' คือจอยาวไม่มีขอบคั่น ไม่มีปุ่มแล้ว แต่ยังเปิดด้วย ?wall=1 ได้) */
function setMode(m){
  const root = document.documentElement;
  PANEL_ON = (m === '1' || m === '2' || m === '3') ? +m : 0;
  WALL_ON  = (m === 'wall');
  ULTRA_ON = (m !== '0');
  root.classList.toggle('ultra', ULTRA_ON);
  root.classList.toggle('wall', WALL_ON);
  markMode(m);
  fit();
  const c = cur; cur = -1; show(c);       // สร้าง/หยุดวิดีโอตาม pane ที่เห็น
}
ui.addEventListener('click', e=>{
  const m = e.target.closest('button')?.dataset.mode;
  if(m !== undefined){ setMode(m); return; }
  const a = e.target.closest('button')?.dataset.act;
  if(a==='prev' && !SYNC) show(cur-1);
  if(a==='next' && !SYNC) show(cur+1);
  if(a==='toggle') setPlaying(!playing);
  if(a==='restart' && !SYNC) show(0);
  if(a==='full'){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); setPlaying(!playing); }
  if(!SYNC && (e.code==='ArrowRight'||e.code==='PageDown')) show(cur+1);
  if(!SYNC && (e.code==='ArrowLeft' ||e.code==='PageUp'))   show(cur-1);
  if(e.key==='f'||e.key==='F'){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  if((e.key==='r'||e.key==='R') && !SYNC) show(0);
  if(e.key==='u'||e.key==='U'){       // วน 16:9 → จอ1 → จอ2 → จอ3 → 48:9 แบ่ง 3
    const order = ['0','1','2','3','w'];
    const now = PANEL_ON ? String(PANEL_ON) : (ULTRA_ON && !WALL_ON ? 'w' : '0');
    setMode(order[(order.indexOf(now) + 1) % order.length]);
  }
});

/* ---------- เริ่มทำงาน ---------- */
function boot(){
  // ทุกหน้าใช้เวลาคงที่ตามตาราง DWELL — ไม่ต้องรออ่านความยาววิดีโอ
  // ไทม์ไลน์จึงเหมือนกันทุกเครื่องแม้ไฟล์สื่อยังไม่ครบ
  buildTimeline();

  if(SYNC){
    const q = clockPos();
    show(q.i, q.off);
  } else {
    const n = Math.max(0, (parseInt(QS.get('slide'), 10) || 1) - 1);
    show(Math.min(n, SLIDES.length - 1));
  }
  markMode(PANEL_ON ? String(PANEL_ON)
                    : (WALL_ON ? 'wall' : (ULTRA_ON ? 'w' : '0')));
  raf = requestAnimationFrame(tick);
}
boot();
