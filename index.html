/* fallback chain สำหรับไฟล์ที่หาไม่เจอ */
function attachFallback(node, kind){
  node.addEventListener('error', () => {
    if(!node.parentNode) return;                 // ถูกถอดออกไปแล้ว
    const srcs = JSON.parse(node.dataset.srcs || '[]');
    const next = (+node.dataset.i || 0) + 1;
    if(next < srcs.length){ node.dataset.i = next; node.src = enc(srcs[next]); if(node.load) node.load(); return; }

    const box = document.createElement('div');
    if(node.dataset.logo){
      let nm = '';
      try{ nm = JSON.parse(node.dataset.logo); }catch(e){ nm = node.alt || ''; }
      box.className = 'logobox';
      box.innerHTML = String(nm).split('\n').map(esc).join('<br>');
      node.replaceWith(box);
      return;
    }
    if(node.dataset.chip){
      let fb = ['▧','ภาพท่านี้อยู่ระหว่างจัดเตรียม'];
      try{ fb = JSON.parse(node.dataset.fb) || fb; }catch(e){}
      box.className = 'newmark';
      box.innerHTML = fb[0] + '<span>' + fb[1] + '</span>';
    } else {
      box.innerHTML = phBox(kind, srcs[0] || '');
    }
    node.replaceWith(box.className ? box : box.firstElementChild || box);
  });
}
stage.querySelectorAll('img[data-srcs]').forEach(n => attachFallback(n, 'image'));
stage.querySelectorAll('video[data-srcs]').forEach(n => {
  attachFallback(n, 'video');
  // ถ้าไฟล์พร้อมเล่นตอนที่สไลด์นี้กำลังแสดงอยู่ ให้เริ่มเล่นทันที
  n.addEventListener('loadeddata', () => {
    const sl = n.closest('.slide');
    if(playing && sl && sl.classList.contains('on')){ n.muted = true; n.play().catch(()=>{}); }
    const s = SLIDES[cur];
    if(!SYNC && s && s.el === sl) durMs = slideDuration(s);
  });
});

function fit(){
  const W = ULTRA_ON ? 11520 : 3840;        // ความกว้างเวทีจริง
  const pn = PANEL_ON;
  const vis = pn ? 3840 : W;                // ส่วนที่ต้องให้พอดีจอ
  const k = Math.min(innerWidth/vis, innerHeight/2160);
  const dx = pn ? (W/2 - (pn - 0.5) * 3840) : 0;   // เลื่อนให้จอที่เลือกมาอยู่กลาง
  stage.style.transform =
    'translate(-50%,-50%) scale(' + k + ') translateX(' + dx + 'px)';
}
addEventListener('resize', fit); fit();

let cur = -1, playing = true, t0 = 0, durMs = 0, raf = 0;

/* ================================================================
   ไทม์ไลน์คงที่ + นาฬิกาโลก (ใช้ในโหมด SYNC)
   ทุกเครื่องคำนวณจากสูตรเดียวกันและนาฬิกาเดียวกัน จึงตรงกันเองโดยไม่ต้องคุยกัน
   ความยาววิดีโออ่านจาก assets/durations.json (สร้างด้วย deploy/build-durations.mjs)
   ถ้าไม่มีไฟล์นั้นจะใช้เวลาตั้งต้นจาก DWELL ซึ่งยังตรงกันทุกจอ
   ================================================================ */
const TL = [];            // เวลาเริ่มของแต่ละหน้า (ms) สะสม
let CYCLE = 0;            // ความยาวรอบทั้งหมด (ms)
let STRETCH = 1;          // ตัวคูณให้รอบลงตัวตาม CYCLE_TARGET_SEC
let VID_DUR = {};         // ความยาวไฟล์จริงจาก assets/durations.json ใช้ร่วมกันทุกจอ
const MEDIA_STARTUP_MS = 2000; // เผื่อเวลาโหลด metadata/เริ่มถอดรหัสก่อนเฟรมแรก

function mediaFloorMs(s){
  let seconds = 0;
  (s.vids || []).forEach(id => { seconds = Math.max(seconds, +VID_DUR[id] || 0); });
  if(s.el) s.el.querySelectorAll('video[data-srcs]').forEach(v => {
    let srcs = [];
    try{ srcs = JSON.parse(v.dataset.srcs || '[]'); }catch(e){}
    srcs.forEach(src => { seconds = Math.max(seconds, +VID_DUR[src] || 0); });
  });
  return seconds > 0 ? seconds * 1000 + MEDIA_STARTUP_MS : 0;
}

function fixedDur(i){
  const s = SLIDES[i];
  const base = (s.dur || 10) * 1000 * STRETCH;
  return Math.max(base, mediaFloorMs(s));
}
function buildTimeline(){
  const nat = SLIDES.reduce((a,s)=> a + (s.dur || 10), 0);   // วินาทีตามตาราง DWELL
  STRETCH = CONFIG.CYCLE_TARGET_SEC ? (CONFIG.CYCLE_TARGET_SEC / nat) : 1;
  TL.length = 0; CYCLE = 0;
  for(let i = 0; i < SLIDES.length; i++){ TL.push(CYCLE); CYCLE += fixedDur(i); }
}
function clockPos(){
  const t = (((Date.now() - CONFIG.SYNC_EPOCH) % CYCLE) + CYCLE) % CYCLE;
  let i = TL.length - 1;
  while(i > 0 && TL[i] > t) i--;
  return { i, off: t - TL[i], dur: fixedDur(i) };
}

/* ใน ?panel=1|2|3 ผืน 48:9 ถูกเลื่อนมาครอปทีละช่วง แม้ pane นอกช่วงครอป
   ยังมี offsetWidth อยู่ จึงต้องตรวจตำแหน่งบนเวทีด้วย ไม่เช่นนั้นจะเล่นคลิป
   ของอีกสองจอเบื้องหลังและนับรวมในการรอวิดีโอจบ */
function paneIsVisible(pn){
  if(!pn) return true;
  if(pn.offsetWidth === 0) return false;
  if(!PANEL_ON) return true;
  const left = (PANEL_ON - 1) * 3840;
  return pn.offsetLeft < left + 3840 && pn.offsetLeft + pn.offsetWidth > left;
}
function visibleVideos(s){
  return [...s.el.querySelectorAll('video')].filter(v => {
    const pn = v.closest('.pane');
    return paneIsVisible(pn);
  });
}
function visibleVideoDurationMs(s){
  const seconds = visibleVideos(s).reduce((d, v) =>
    Math.max(d, isFinite(v.duration) && v.duration > 0 ? v.duration : 0), 0);
  return seconds > 0 ? seconds * 1000 + MEDIA_STARTUP_MS : 0;
}
/* โหมดเดินอิสระใช้ metadata ของไฟล์ที่เห็นจริงเพิ่มอีกชั้น เผื่อมีการเปลี่ยนไฟล์
   แต่ยังไม่ได้สร้าง durations.json ใหม่ จะได้ไม่ตัดวิดีโอกลางคัน */
function slideDuration(s){
  return Math.max(fixedDur(SLIDES.indexOf(s)), visibleVideoDurationMs(s));
}
function firstRoundComplete(s){
  return visibleVideos(s).every(v => v.dataset.firstRound === '1');
}

/* โหมดจอเดียวยาว: ของที่ควรมี "อันเดียวต่อจอ" ต้องไม่ซ้ำ 3 ชุดบนผืนเดียว
   เหลือแถบโลโก้ผู้สนับสนุนไว้ซ้ายสุด · โลโก้ AI NORA ไว้ขวาสุด */
function wallDedupe(el){
  el.querySelectorAll('.logos,.wordmark').forEach(n => { n.style.display = ''; });
  if(!WALL_ON) return;
  const panes = [...el.querySelectorAll('.pane')]
    .filter(p => p.offsetWidth > 0)
    .sort((a,b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left);
  const pick = sel => panes.map(p => p.querySelector(sel)).filter(Boolean);
  pick('.logos').slice(1).forEach(n => { n.style.display = 'none'; });          // เหลือซ้ายสุด
  pick('.wordmark').slice(0, -1).forEach(n => { n.style.display = 'none'; });   // เหลือขวาสุด
}

function show(i, seekMs){
  if(cur >= 0){
    const p = SLIDES[cur];
    p.el.classList.remove('on');
    p.el.querySelectorAll('video').forEach(v => { try{ v.pause(); v.currentTime = 0; }catch(e){} });
  }
  cur = (i + SLIDES.length) % SLIDES.length;
  const s = SLIDES[cur];
  s.el.classList.add('on');
  wallDedupe(s.el);
  const seek = Math.max(0, (seekMs || 0) / 1000);
  // เล่นเฉพาะวิดีโอใน pane ที่แสดงอยู่จริง (pane ที่ซ่อนมี offsetWidth = 0)
  const all = [...s.el.querySelectorAll('video')];
  all.forEach(v => { const pn = v.closest('.pane'); if(!paneIsVisible(pn)){ try{ v.pause(); }catch(e){} } });
  const vids = all.filter(v => paneIsVisible(v.closest('.pane')));
  vids.forEach(v => {
    v.muted = true;
    /* เดินอิสระ: รอบแรกไม่ loop เพื่อให้ ended เป็น state ที่เชื่อถือได้
       พอจบรอบแรกจึงเปิด loop และเล่นต่อระหว่างรอเวลา DWELL */
    v.dataset.firstRound = SYNC ? '1' : '0';
    v.loop = !!SYNC;
    v.onended = SYNC ? null : () => {
      v.dataset.firstRound = '1';
      v.loop = true;
      if(playing && v.closest('.slide')?.classList.contains('on')) v.play().catch(()=>{});
    };
    const align = () => {
      if(seek > 0 && isFinite(v.duration) && v.duration > 0.2){
        // คลิปสั้นกว่าเวลาหน้าและตั้ง loop ไว้ จึงหาตำแหน่งด้วยเศษของการหาร
        // ทุกเครื่องคำนวณเหมือนกัน จอ 3 จอจึงอยู่เฟรมเดียวกันแม้คลิปยาว 2 วินาที
        try{ v.currentTime = Math.min(seek % v.duration, v.duration - 0.05); }catch(e){}
      }
    };
    if(v.readyState >= 1) align();
    v.addEventListener('loadedmetadata', () => {
      align();
      if(!SYNC) durMs = slideDuration(s);
    }, { once:true });
    const pr = v.play(); if(pr && pr.catch) pr.catch(()=>{});
  });
  t0 = performance.now() - (seekMs || 0);
  durMs = SYNC ? fixedDur(cur) : slideDuration(s);
  // preload next slide's media
  const nx = SLIDES[(cur+1) % SLIDES.length];
  nx.el.querySelectorAll('video').forEach(v => {
    const pn = v.closest('.pane');
    if(pn && pn.offsetWidth === 0 && !nx.el.classList.contains('on')) { /* ยังบอกไม่ได้ ปล่อยผ่าน */ }
    if(v.preload!=='auto'){ v.preload='auto'; try{v.load();}catch(e){} }
  });
  NORA && NORA.report();
  paintInfo();
}

/* ข้อความท้ายแถบควบคุมของสไลด์ — แยกออกมาเพราะต้องวาดใหม่ทันทีเมื่อ
   เปลี่ยนชื่อจอหรือสลับโหมดจากมือถือ ไม่ใช่รอให้ถึงหน้าถัดไป */
function paintInfo(){
  const info = document.getElementById('uiInfo');
  if(!info) return;
  info.textContent = (cur+1) + ' / ' + SLIDES.length
    + (PANEL_ON ? ' · จอ ' + PANEL_ON
       : WALL_ON ? ' · 48:9 ยาว'
       : ULTRA_ON ? ' · 48:9 แบ่ง 3' : '')
    + (SYNC ? ' · sync' : '')
    + (DECK !== 'main' ? ' · ' + (CURTAIN_UP ? 'ม่านเปิดแล้ว รอกดชุดหลัก' : DECKS[DECK].label) : '')
    + (GROUP ? ' · กลุ่ม ' + GROUP : '')
    // บอกด้วยว่าต่อรีเลย์ติดหรือยัง ไม่ใช่แค่ชื่อจอ — เดิมขึ้นชื่อจอเฉย ๆ
    // ทำให้เข้าใจผิดว่าจอพร้อมสั่งงานแล้ว ทั้งที่สาย SSE ยังต่อไม่ติดและ
    // กำลังลองใหม่เงียบ ๆ อยู่ทุก 5 วินาที กว่าจะรู้ก็ตอนหยิบมือถือขึ้นมาสั่ง
    + (CTRL_ON ? ' · ' + SCREEN_ID + (NORA.linked ? '' : ' (ไม่ต่อรีเลย์)') : '');
}

/* ---------- ดึงวิดีโอเข้าจังหวะระหว่างที่หน้ายังไม่เปลี่ยน ----------
   เดิมจัดตำแหน่งวิดีโอครั้งเดียวตอน show() ถ้าจอไหนเริ่มเล่นช้ากว่าเพื่อน
   (ไฟล์ยังบัฟเฟอร์ · ตัวถอดรหัสสะดุด · แท็บเพิ่งกลับมาจากพื้นหลัง)
   มันจะช้าอยู่เท่านั้นไปทั้งหน้า เพราะคลิปตั้ง loop ไว้ ความต่างจึงวนตามไปทุกรอบ
   หน้าหนึ่งยาว 32 วินาที คลิป 2 วินาทีวน 16 รอบ ตาเห็นชัดมากว่าไม่พร้อมกัน

   ตรวจทุก 300ms เทียบกับ "เวลาในหน้า" ที่ทุกจอคำนวณเหมือนกัน
     ห่างนิดหน่อย  เร่ง/หน่วงความเร็วให้ค่อย ๆ ไหลเข้าหากัน (ตาไม่เห็น)
     ห่างมาก      กระโดดไปเลย (เห็นเป็นภาพสะดุด จึงใช้เท่าที่จำเป็น)         */
const V_SOFT = 0.06;      // ต่างเกินเท่านี้ (วินาที) เริ่มปรับความเร็วดึงกลับ
                          // ต่ำกว่านี้ราว 2 เฟรม ปล่อยไว้ ตาแยกไม่ออกอยู่แล้ว
                          // และถ้าไล่ละเอียดกว่านี้จะกลายเป็นแกว่งไปมาไม่หยุด
const V_HARD = 0.25;      // ต่างเกินเท่านี้ ไล่ด้วยความเร็วช้าไป กระโดดเลยดีกว่า
const V_EVERY = 250;      // ระยะห่างระหว่างการตรวจ (ms)
const V_PULL = 0.12;      // เร่ง/หน่วงได้มากสุดกี่ % — 12% ตายังจับไม่ได้
let vChecked = 0;
function alignVideos(offMs, now){
  if(!playing || now - vChecked < V_EVERY) return;
  vChecked = now;
  const s = SLIDES[cur];
  if(!s) return;
  const off = offMs / 1000;
  s.el.querySelectorAll('video').forEach(v => {
    const pn = v.closest('.pane');
    if(!paneIsVisible(pn)) return;                      // pane ที่ถูกครอปทิ้ง ไม่ต้องเสียแรง
    // รอบแรกในโหมดเดินอิสระต้องปล่อยให้เล่นตามธรรมชาติ หากอิงเวลาหน้าแล้ว
    // modulo กลับต้นคลิปก่อน ended จะไม่มีวันตั้งสถานะว่าจบรอบแรก
    if(!SYNC && v.dataset.firstRound === '0') return;
    if(v.paused || v.readyState < 2 || !isFinite(v.duration) || v.duration <= 0.2) return;
    const want = off % v.duration;
    let d = v.currentTime - want;
    // คลิปวนลูป ความต่างจึงต้องคิดแบบวงกลม ไม่งั้นตอนคาบเกี่ยวรอยต่อ
    // จะอ่านว่าห่างกันเกือบเต็มคลิป แล้วสั่งกระโดดทั้งที่จริงห่างกันไม่กี่เฟรม
    if(d >  v.duration / 2) d -= v.duration;
    if(d < -v.duration / 2) d += v.duration;
    const a = Math.abs(d);
    if(a > V_HARD){
      try{ v.currentTime = Math.min(want, v.duration - 0.05); }catch(e){}
      if(v.playbackRate !== 1) v.playbackRate = 1;
    } else if(a > V_SOFT){
      // ยิ่งห่างยิ่งดึงแรง แต่ไม่เกิน ±12% — ห่างมากสุดที่ยังไม่กระโดด (0.25 วิ)
      // กลับเข้าที่ในราว 2 วินาที และไม่มีจังหวะไหนที่ตาเห็นว่าภาพเร็วหรือช้าผิดปกติ
      v.playbackRate = 1 - Math.max(-V_PULL, Math.min(V_PULL, d * 0.5));
    } else if(v.playbackRate !== 1){
      v.playbackRate = 1;
    }
  });
}

function tick(now){
  raf = requestAnimationFrame(tick);
  if(SYNC){
    if(!playing) return;                       // หยุดดูชั่วคราว พอเล่นต่อจะกระโดดกลับเข้าจังหวะเอง
    const q = clockPos();
    if(q.i !== cur) show(q.i, q.off);
    const s = SLIDES[cur];
    if(s && s.bar) s.bar.style.width = (Math.min(1, q.off / q.dur) * 100).toFixed(2) + '%';
    alignVideos(q.off, now);
    return;
  }
  const s = SLIDES[cur];
  if(!s) return;
  if(!playing){ t0 = now - Math.min(now - t0, durMs); return; }
  const p = Math.min(1, (now - t0) / durMs);
  if(s.bar) s.bar.style.width = (p*100).toFixed(2) + '%';
  // เดินเวลาเองก็ยังดึงวิดีโอเข้าจังหวะได้ เพราะ t0 ถูกตั้งจากเวลาของรีเลย์
  // ทุกจอจึงนับ "เวลาในหน้า" เป็นเลขเดียวกัน ไม่ใช่ต่างคนต่างนับจากตอนที่คำสั่งมาถึง
  alignVideos(now - t0, now);
  // ชุด intro ค้างหน้าแรกไว้เสมอ วิดีโอยังวนเล่นได้ (loop) แต่ไม่ไปหน้าถัดไป
  // ต้องรอสแตฟฟ์กด "ชุดหลัก" เอง
  if(p >= 1 && firstRoundComplete(s) && DECK !== 'intro') show(cur + 1);
}

function setPlaying(v){
  playing = v;
  document.querySelector('[data-act="toggle"]').textContent = v ? '⏸ หยุด' : '▶ เล่น';
  const s = SLIDES[cur];
  if(s) s.el.querySelectorAll('video').forEach(x => {
    const pn = x.closest('.pane');
    if(pn && pn.offsetWidth === 0) return;
    v ? x.play().catch(()=>{}) : x.pause();
  });
}

/* ---------- สลับชุดสไลด์ / เปิดม่าน ---------- */
const curtainEl = () => document.getElementById('curtain');
let curtainTimer = 0;      // ตัวจับเวลาปิดท้ายอนิเมชันเปิดม่าน ต้องยกเลิกได้
const CURTAIN_MS = 4200;   // ระยะเวลาเปิดม่านแดง CSS จาก cf53625

function setDeck(name, lag){
  const d = DECKS[name] ? name : 'main';
  /* ออกก็ต่อเมื่อ "ไม่มีอะไรต้องเปลี่ยนจริง ๆ" เท่านั้น
     เดิมเช็กแค่ชื่อชุด ทำให้กด "ตั้งม่าน" ซ้ำตอนที่ม่านเปิดไปแล้ว
     ไม่เกิดอะไรขึ้นเลย — ม่านลงมาใหม่ไม่ได้ ต้องอ้อมไปกดชุดหลักก่อน
     ซึ่งระหว่างนั้นผู้ชมเห็นสไลด์จริงโผล่ออกมา ตอนซ้อมคิวจึงพังทุกครั้ง */
  if(d === DECK && !CURTAIN_UP && !curtainTimer) return;
  DECK = d;
  PREF.set('deck', d);
  // กลับเข้าชุด intro = ตั้งม่านใหม่ตั้งแต่ต้น ไม่ใช่โผล่มาที่ม่านเปิดค้างอยู่
  CURTAIN_UP = false;
  PREF.set('curtain', 'down');
  const root = document.documentElement;
  root.classList.toggle('deck-intro', d === 'intro');
  root.classList.remove('curtain-up');
  // ยกเลิกอนิเมชันที่ยังรูดค้างอยู่ให้หมด ทั้งคลาส สไตล์อินไลน์ และตัวจับเวลา
  // ไม่งั้นของที่ค้างจากรอบก่อนจะโผล่มาตอนกดตั้งม่านครั้งถัดไป
  clearTimeout(curtainTimer); curtainTimer = 0;
  const c = curtainEl();
  c.classList.remove('open');
  c.style.removeProperty('--copen');
  NORA.manual();                      // ทั้งสองทางต้องหลุดจากนาฬิกาโลกก่อน
  show(0, Math.max(0, lag || 0));     // หักเวลาเดินทางของคำสั่ง ทุกจอเริ่มนับตรงกัน
  setPlaying(d !== 'intro');          // ตั้งม่าน = ค้างหน้าแรกไว้ใต้ม่าน
  paintInfo();
}

/* เปิดม่าน: หน้าแรกเริ่มเดินตั้งแต่ม่านเริ่มแยก ผู้ชมจะได้เห็นภาพที่มีชีวิต
   ไม่ใช่ภาพนิ่งที่ค่อยขยับตอนม่านเปิดสุด

   เปิดเสร็จแล้ว "ยังอยู่ในชุด intro" — ค้างหน้าแรกไว้ ไม่วิ่งต่อเอง
   เพราะช่วงกล่าวเปิดงานยาวไม่เท่ากันทุกครั้ง สแตฟฟ์กด "ชุดหลัก" เองเมื่อพร้อม

   ใช้ตัวจับเวลาไม่ใช่ transitionend เพราะ transitionend หายได้ถ้าแท็บถูกพัก
   แล้วม่านจะค้างครึ่ง ๆ กลาง ๆ อยู่อย่างนั้น */
/* lag = คำสั่งนี้ออกจากรีเลย์มาแล้วกี่ ms หักออกจากทั้งอนิเมชันและตัวจับเวลา
   ม่านของจอสามบานจึงรูดพร้อมกันเป็นผืนเดียว ไม่ใช่ทยอยกันเปิดทีละบาน */
function openCurtain(lag){
  if(DECK !== 'intro' || CURTAIN_UP) return;
  const c = curtainEl();
  const elapsed = Math.max(0, lag || 0);
  const d = Math.min(CURTAIN_MS, elapsed);
  NORA.manual();
  show(0, d);
  setPlaying(true);                   // ม่าน CSS เบา จึงเล่นหน้าแรกพร้อมเปิดได้เหมือน cf53625
  c.style.setProperty('--copen', -d + 'ms');
  c.classList.add('open');
  /* เก็บ id ไว้ยกเลิกได้ — ถ้าสแตฟฟ์กด "ชุดหลัก" ระหว่างม่านกำลังรูด
     ตัวจับเวลานี้จะยังทำงานต่อแล้วไปตั้ง curtain-up ทั้งที่ออกจากชุด intro
     ไปแล้ว สถานะที่รายงานกลับ controller จะเพี้ยน (บอกว่าม่านเปิดอยู่
     ทั้งที่อยู่ชุดหลัก) และรอบหน้าที่กดตั้งม่านจะเริ่มจากสถานะที่ผิด */
  clearTimeout(curtainTimer);
  curtainTimer = setTimeout(() => {
    curtainTimer = 0;
    if(DECK !== 'intro') return;      // ออกจากชุดม่านไปแล้วระหว่างทาง ไม่ต้องทำอะไร
    CURTAIN_UP = true;
    PREF.set('curtain', 'up');
    document.documentElement.classList.add('curtain-up');
    c.classList.remove('open');
    c.style.removeProperty('--copen');
    paintInfo();
    NORA.report();
  }, Math.max(0, (MOTION_ON ? 4400 : 0) - d));   // 4.2s รูด + เผื่ออีกนิด
}

/* ---------- เต็มจอ ---------------------------------------------------
   requestFullscreen() ต้องถูกเรียก "ต่อเนื่องจากการกดของคนที่เครื่องนั้น"
   เท่านั้น เบราว์เซอร์ถึงจะยอม คำสั่งที่วิ่งมาตามสาย SSE จากหน้า controller
   ไม่นับเป็นการกด จึงโดนปฏิเสธด้วย NotAllowedError — ของเดิม .catch() ทิ้ง
   เงียบ ๆ คนสั่งเลยเห็นแค่ "จอไม่ยอมเต็มจอ" โดยไม่รู้ว่าเพราะอะไร
   (ขาออกไม่มีข้อจำกัดนี้ สั่งให้ออกจากเต็มจอข้ามเครื่องได้ตามปกติ)

   ทำได้สองทาง
     มีคนอยู่หน้าเครื่อง → ตั้งท่ารอไว้ พอมีการกดอะไรก็ได้ที่จอนั้นครั้งถัดไป
                          ค่อยเข้าเต็มจอ ระหว่างรอขึ้นป้ายบอกไว้บนจอ
     จอผนังไม่มีคนเฝ้า  → เปิดเบราว์เซอร์แบบเต็มจอมาตั้งแต่แรก
                          (ดูคำสั่งในการ์ด "จำลองผนัง" ของหน้า controller)  */
let FULL_ARMED = false;
function armFull(on){
  if(FULL_ARMED === !!on) return;
  FULL_ARMED = !!on;
  document.documentElement.classList.toggle('armfull', FULL_ARMED);
  clearTimeout(armFull._t);
  // จอผนังที่ไม่มีใครอยู่ ไม่ควรค้างป้ายไว้ทั้งงาน — ปลดเองใน 45 วินาที
  if(FULL_ARMED) armFull._t = setTimeout(() => armFull(false), 45000);
  NORA.report();
}
function goFull(want){
  const on = want === undefined ? !document.fullscreenElement : !!want;
  if(!on){ armFull(false); if(document.fullscreenElement) document.exitFullscreen(); return; }
  if(document.fullscreenElement) return;
  document.documentElement.requestFullscreen()
    .then(()  => armFull(false))
    .catch(() => armFull(true));      // ไม่มีการกดรองรับ → รอการกดครั้งถัดไป
}
/* การกดใด ๆ ที่เครื่องนี้นับเป็นการกดของคน ใช้จังหวะนั้นสะสางที่ค้างไว้
   capture:true เพื่อให้ได้จังหวะก่อนตัวจัดการอื่นจะกิน event ไป */
['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => {
  if(!FULL_ARMED) return;
  armFull(false);
  document.documentElement.requestFullscreen().catch(()=>{});
}, true));

/* controls */
const ui = document.getElementById('ui');
const KIOSK = PREVIEW || new URLSearchParams(location.search).get('kiosk') === '1';
let uiTimer;
addEventListener('mousemove', ()=>{
  if(KIOSK) return;
  ui.classList.add('show');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(()=>{ ui.classList.remove('show'); }, 3000);
});
/* ปุ่มสลับโหมดจอ — ทำงานสด ไม่ต้องแก้ URL */
/* ไฮไลต์ปุ่มให้ตรงกับโหมดปัจจุบัน และซ่อนกลุ่มเลือกจอเมื่อไม่ได้อยู่โหมด 16:9 */
function markMode(m){
  const single = !WALL_ON && (m === '0' || PANEL_ON > 0);
  ui.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x.dataset.mode === m));
  ui.querySelectorAll('[data-fam]').forEach(x =>
    x.classList.toggle('on', x.dataset.fam === (single ? 's' : 'w')));
  ui.querySelectorAll('[data-panels]').forEach(x => x.classList.toggle('hide', !single));
}

/* โหมดที่ให้เลือกมีสองกลุ่ม
     16:9        m = '0' (เดี่ยว) หรือ '1' '2' '3' (เลือกดูทีละจอของผัง 3 จอ)
     48:9        m = 'w' (แบ่ง 3 จอ) หรือ 'wall' (ผืนเดียวยาว ไม่มีขอบคั่น)
   บนแถบของสไลด์มีปุ่มถึงแค่ 'w' ส่วน 'wall' สั่งจากมือถือหรือ ?wall=1 */
function setMode(m){
  const targetWide = m !== '0';
  PREF.set('mode', m);
  /* จำนวนสไลด์นักศึกษาของสองตระกูลโหมดไม่เท่ากัน จึงต้องสร้าง timeline ใหม่
     เมื่อสลับข้าม 16:9 ↔ 48:9 ส่วนการสลับจอ 1/2/3 หรือ wall ภายใน 48:9
     ยังทำสดได้เหมือนเดิมเพราะใช้ชุดสไลด์เดียวกัน */
  if(targetWide !== WIDE_DECK){
    const q = new URLSearchParams(location.search);
    q.delete('panel'); q.delete('ultra'); q.delete('wall');
    if(m === 'wall') q.set('wall', '1');
    else if(m === 'w') q.set('ultra', '1');
    else if(/^[123]$/.test(m)) q.set('panel', m);
    location.search = q.toString();
    return;
  }
  const root = document.documentElement;
  PANEL_ON = (m === '1' || m === '2' || m === '3') ? +m : 0;
  WALL_ON  = (m === 'wall');
  ULTRA_ON = (m !== '0');
  root.classList.toggle('ultra', ULTRA_ON);
  root.classList.toggle('wall', WALL_ON);
  markMode(m);
  fit();
  const c = cur; cur = -1; show(c);       // สร้าง/หยุดวิดีโอตาม pane ที่เห็น
}
ui.addEventListener('click', e=>{
  const m = e.target.closest('button')?.dataset.mode;
  if(m !== undefined){ setMode(m); return; }
  const a = e.target.closest('button')?.dataset.act;
  if(a==='prev' && !SYNC) show(cur-1);
  if(a==='next' && !SYNC) show(cur+1);
  if(a==='toggle') setPlaying(!playing);
  if(a==='restart' && !SYNC) show(0);
  if(a==='full'){ goFull(); }
});
addEventListener('keydown', e=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.code==='Space'){ e.preventDefault(); setPlaying(!playing); }
  if(!SYNC && (e.code==='ArrowRight'||e.code==='PageDown')) show(cur+1);
  if(!SYNC && (e.code==='ArrowLeft' ||e.code==='PageUp'))   show(cur-1);
  if(e.key==='f'||e.key==='F'){ goFull(); }
  if((e.key==='r'||e.key==='R') && !SYNC) show(0);
  // C = วนสามจังหวะ ตั้งม่าน → เปิดม่าน → เข้าชุดหลัก
  // ไว้ซ้อมลำดับพิธีที่ตัวเครื่องโดยไม่ต้องหยิบมือถือ
  if(e.key==='c'||e.key==='C'){
    if(DECK !== 'intro')  setDeck('intro');
    else if(!CURTAIN_UP)  openCurtain();
    else                  setDeck('main');
  }
  if(e.key==='u'||e.key==='U'){       // วน 16:9 → จอ1 → จอ2 → จอ3 → 48:9 แบ่ง 3
    const order = ['0','1','2','3','w'];
    const now = PANEL_ON ? String(PANEL_ON) : (ULTRA_ON && !WALL_ON ? 'w' : '0');
    setMode(order[(order.indexOf(now) + 1) % order.length]);
  }
});

/* ================================================================
   CONTROLLER — สั่งงานจอจากอีกอุปกรณ์
   ================================================================
   ?screen=<id>  ตั้งชื่อจอนี้ เพื่อให้ controller เรียกถึงได้
   ?api=<base>   ที่อยู่รีเลย์ ค่าเริ่มต้น <AINORA_BASE>/api

   ถ้าไม่มีรีเลย์ให้ต่อ ทุกอย่างทำงานเหมือนเดิมทุกประการ
   สไลด์ไม่ได้พึ่งรีเลย์ในการเดินหน้า — จอยังตรงกันเองด้วยนาฬิกาโลก
   รีเลย์เป็นแค่ทางให้ "แทรกคำสั่ง" เข้ามาเท่านั้น                        */
/* ชื่อจอ = ชื่อของ "เครื่อง" ไม่ผูกกับโหมดที่กำลังแสดง
   หนึ่งเครื่อง = หนึ่งชื่อ · 48:9 คือเครื่องเดียวขับทั้งผนัง (จอเดียวในสายตารีเลย์)
   ส่วน 16:9 ก็กดเลือกเลขจอจาก controller ได้ จึงไม่ต้องมีชื่อแยกซ้าย/กลาง/ขวา

   URL ที่มี query สำหรับงานควบคุมใช้ชื่อตามลำดับ:
   ?screen= > ชื่อที่ตั้งไว้ครั้งก่อน > 'main'
   ส่วน URL เปล่าใช้ชื่อ public ภายในและไม่ต่อรีเลย์
   ตั้งจากมือถือได้ด้วยคำสั่ง name แล้วเครื่องจำไว้เอง ไม่ต้องแก้ URL
   ชื่อซ้ำ = จอเดียวกันในสายตารีเลย์ เครื่องหลังจะเตะเครื่องแรกออก
   ชื่อจอแสดงท้ายแถบควบคุมของสไลด์ ตอนตั้งหน้างานจะได้รู้ว่าเครื่องไหนชื่ออะไร */
let SCREEN_ID = PUBLIC_VIEW ? 'public'
  : (QS.get('screen') || '').trim().slice(0, 40)
  // แท็บกลุ่มตั้งชื่อให้เองจาก กลุ่ม+ช่อง เช่น wall-1 wall-2 wall-3
  // รีเลย์จึงถือสายแยกกันสามเส้น แต่ controller สั่งทีเดียวถึงทั้งกลุ่ม
  || (GROUP ? GROUP + '-' + (PANEL_ON || 1) : '')
  || PREF.get('screen', '').trim().slice(0, 40)
  || 'main';
if(QS.get('screen')) PREF.set('screen', SCREEN_ID);
const API_BASE = (QS.get('api') || (CONFIG.AINORA_BASE + '/api')).replace(/\/$/, '');
// ภาพตัวอย่างต้องไม่ไปรายงานตัวกับรีเลย์จนโผล่เป็นจออีกตัวในรายการ
// และใน srcdoc ไม่มี origin ให้ยิง API อยู่แล้ว
const CTRL_ON  = !PREVIEW && !PUBLIC_VIEW && QS.get('ctrl') !== '0';

const NORA = {
  id: SCREEN_ID,
  linked: false,            // สาย SSE ต่อติดอยู่จริงหรือไม่ (โชว์ท้ายแถบควบคุม)
  get state(){
    const s = SLIDES[cur];
    return { screen:SCREEN_ID, slide:cur + 1, total:SLIDES.length, playing,
      sync:SYNC, mode:(PANEL_ON ? String(PANEL_ON) : (WALL_ON ? 'wall' : (ULTRA_ON ? 'w' : '0'))),
      deck:DECK, curtain:(CURTAIN_UP ? 'up' : 'down'), group:GROUP || undefined,
      seam:SEAM_ON, motion:MOTION_ON, full:!!document.fullscreenElement,
      // farm = สั่งเต็มจอมาแล้วแต่เบราว์เซอร์ยังไม่ยอม กำลังรอการกดที่เครื่องนั้น
      farm:FULL_ARMED || undefined,
      title:(s && s.wall && s.wall.title) || '' };
  },
  /* คำสั่งเดินหน้า/ถอยหลังต้องหลุดจากโหมดนาฬิกาโลกก่อน
     ไม่งั้น tick รอบถัดไปจะดึงกลับไปหน้าตามเวลาทันที */
  manual(){ if(SYNC){ SYNC = false; t0 = performance.now(); durMs = slideDuration(SLIDES[cur]); } },
  apply(m){
    if(!m || !m.cmd) return;
    /* คำสั่งจากรีเลย์พก at = เวลาของรีเลย์ตอนยิงคำสั่งออกมา ทุกจอได้เลขเดียวกัน
       ส่วนเวลาที่คำสั่ง "มาถึง" แต่ละจอไม่เท่ากัน — รีเลย์เขียนลงสาย SSE ทีละเส้น
       และแต่ละจอกว่าจะตื่นมาประมวลผลก็ไม่พร้อมกัน ต่างกันหลักสิบ ms

       ถ้าตั้ง t0 จากเวลาที่คำสั่งมาถึง ความต่างนั้นจะติดไปกับ t0 แล้วอยู่ยาว
       จนกว่าจะเปลี่ยนหน้าครั้งหน้า — จอสามบานพลิกหน้าไม่พร้อมกันตลอดทั้งรอบ
       ตั้งจาก at แทน ทุกจอจึงนับเวลาในหน้าเป็นเลขเดียวกันตั้งแต่วินาทีแรก
       (กันนาฬิกาเพี้ยนไว้ด้วย ถ้าห่างเกิน 5 วินาทีถือว่าเชื่อไม่ได้ ใช้ 0) */
    const lag = m.at && Math.abs(Date.now() - m.at) < 5000
      ? Math.max(0, Date.now() - m.at) : 0;
    switch(m.cmd){
      case 'play':    setPlaying(true); break;
      case 'pause':   setPlaying(false); break;
      case 'toggle':  setPlaying(!playing); break;
      case 'next':    NORA.manual(); show(cur + 1, lag); break;
      case 'prev':    NORA.manual(); show(cur - 1, lag); break;
      case 'goto':    NORA.manual(); show((parseInt(m.arg, 10) || 1) - 1, lag); break;
      case 'step':    {
        const step = parseInt(m.arg, 10);
        const first = SLIDES.findIndex(s => s.step === step);
        if(first >= 0){ NORA.manual(); show(first, lag); }
        break;
      }
      case 'restart': NORA.manual(); show(0, lag); break;
      /* sync ไม่มี arg = กลับเข้าจังหวะนาฬิกา · arg '0' = ปล่อยให้เดินเวลาของตัวเอง

         กลับเข้าจังหวะแล้วต้องกระโดดไปที่ตำแหน่งตามนาฬิกา "เดี๋ยวนั้น" เลย
         เดิมแค่ตั้ง SYNC=true แล้วรอ tick — ถ้าบังเอิญยังอยู่หน้าเดียวกัน
         tick จะไม่เรียก show() วิดีโอจึงค้างอยู่ตำแหน่งเดิมไปจนกว่าจะเปลี่ยนหน้า
         กดปุ่มแล้วเหมือนไม่มีอะไรเกิดขึ้น ทั้งที่ภาพยังเหลื่อมกันอยู่ */
      case 'sync':    if(String(m.arg) === '0'){ NORA.manual(); }
                      else { SYNC = true; const q = clockPos(); show(q.i, q.off); }
                      PREF.set('sync', SYNC ? '1' : '0');
                      paintInfo();
                      break;
      /* แท็บกลุ่มล็อกช่องของตัวเองไว้ ถ้ารับคำสั่งเปลี่ยนโหมด ทั้งสามแท็บ
         จะกลายเป็นช่องเดียวกันหมด ผนังจำลองก็พัง */
      case 'mode':    if(GROUP) break;
                      if(['0','1','2','3','w','wall'].includes(String(m.arg)))
                        setMode(String(m.arg));
                      break;
      case 'deck':    setDeck(String(m.arg), lag); break;
      case 'curtain': openCurtain(lag); break;
      /* เปลี่ยนชื่อก็เช่นกัน — คำสั่งถึงทั้งสามแท็บพร้อมกัน ถ้ายอมเปลี่ยน
         ทั้งสามจะใช้ชื่อเดียวกัน แล้วเตะกันเองออกจากรีเลย์เหลือสายเดียว
         ชื่อของแท็บกลุ่มมาจาก ?group= กับ ?panel= เท่านั้น */
      case 'name':    if(GROUP) break;
                      NORA.rename(m.arg); break;
      case 'seam':    NORA.flag('seam', m.arg); break;
      case 'motion':  NORA.flag('motion', m.arg); break;
      /* ไม่ส่ง arg = สลับ, '1' = เข้าเต็มจอ, '0' = ออกจากเต็มจอ */
      case 'full':    goFull(m.arg === undefined || m.arg === null || m.arg === ''
                        ? undefined : String(m.arg) === '1'); break;
      case 'reload':  location.reload(); break;
    }
    NORA.report();
  },
  /* สวิตช์เปิด/ปิดที่จำค่าไว้ — ไม่ส่ง arg มา = สลับค่า, ส่ง '1'/'0' = บังคับ */
  flag(name, arg){
    const on = arg === undefined || arg === null || arg === ''
      ? !(name === 'seam' ? SEAM_ON : MOTION_ON)
      : String(arg) === '1';
    if(name === 'seam') SEAM_ON = on; else MOTION_ON = on;
    document.documentElement.classList.toggle(name, on);
    PREF.set(name, on ? '1' : '0');
  },
  /* เปลี่ยนชื่อจอสด ๆ จากมือถือ — ต้องต่อสาย SSE ใหม่ด้วยชื่อใหม่
     เพราะรีเลย์ผูกสายกับชื่อที่ส่งไปตอนเปิด ชื่อเดิมจะค้างอยู่ในรายการจน stale */
  rename(v){
    const id = String(v || '').trim().slice(0, 40);
    if(!id || id === SCREEN_ID) return;
    SCREEN_ID = NORA.id = id;
    PREF.set('screen', id);
    paintInfo();
    if(NORA._open) NORA._open();
  },
  async report(){
    if(!CTRL_ON) return;
    try{
      const r = await fetch(API_BASE + '/state', { method:'POST', keepalive:true,
        headers:{ 'content-type':'application/json' },
        body:JSON.stringify(NORA.state) });
      const j = await r.json();
      /* รีเลย์บอกว่าไม่เห็นสายของจอนี้ แต่ฝั่งนี้คิดว่ายังต่ออยู่ = สายตายฝั่งเดียว
         เป็นเคสที่ onerror ไม่มีทางจับได้ ต้องให้อีกฝั่งบอกเท่านั้น
         เว้นช่วงหลังเพิ่งต่อไว้ 20 วิ กันไปแข่งกับจังหวะที่สายกำลังจะติดพอดี */
      if(j && j.linked === false && NORA._es
         && NORA._since && Date.now() - NORA._since > 20000) NORA.relink();
    }catch(e){}
  },

  /* ---- สายที่ต้องเปิดค้างไว้เป็นเดือน ----
     ปัญหาที่เจอจริง: เปิดจอทิ้งไว้ข้ามคืนแล้วสั่งจากมือถือไม่ได้อีกเลย
     ทั้งที่จอยังเล่นสไลด์อยู่ปกติ

     สาเหตุคือสายตายเงียบ — nginx รีโหลด · เน็ตวูบ · NAT ตัดสายที่ไม่มีข้อมูลวิ่ง ·
     จอพักหน้าจอแล้วเบราว์เซอร์แช่แข็งการเชื่อมต่อไว้ พอสายตายแบบไม่มีใครปิดให้ถูกวิธี
     EventSource จะค้างที่ readyState=OPEN โดย "ไม่ยิง error" แล้วก็ไม่ต่อใหม่ให้
     การรอ onerror อย่างเดียวจึงไม่พอ เพราะเคสนี้ onerror ไม่เคยถูกเรียกเลย

     ใช้สามชั้นซ้อนกัน ชั้นไหนจับได้ก่อนก็ต่อใหม่ทันที
       1. รีเลย์ส่ง event ping ทุก 15 วิ — เงียบเกิน 45 วิ ถือว่าตาย
       2. รีเลย์ตอบตอนรายงานสถานะว่ายังเห็นสายของจอนี้อยู่ไหม (ทุก 10 วิ)
       3. ตื่นจากพักหน้าจอ / เน็ตกลับมา — เช็คทันทีไม่ต้องรอครบรอบ            */
  _beat: 0,
  _since: 0,
  _tries: 0,

  connect(){
    if(!CTRL_ON || typeof EventSource === 'undefined') return;

    const open = () => {
      clearTimeout(NORA._timer);
      // ปิดสายเดิมก่อนเสมอ — rename เรียก open() ซ้ำระหว่างที่สายเก่ายังเปิดอยู่
      if(NORA._es){ try{ NORA._es.close(); }catch(e){} NORA._es = null; }

      let es;
      try{ es = new EventSource(API_BASE + '/events?role=screen&screen='
        + encodeURIComponent(SCREEN_ID)); }catch(e){ return retry(); }
      NORA._es = es;
      NORA._beat = Date.now();
      NORA._since = 0;

      const alive = () => { NORA._beat = Date.now(); };
      es.addEventListener('cmd', ev => {
        alive();
        try{ NORA.apply(JSON.parse(ev.data)); }catch(e){}
      });
      es.addEventListener('ping', alive);
      es.addEventListener('open', () => {
        NORA._tries = 0; NORA._since = Date.now(); alive();
        NORA.linked = true; paintInfo(); NORA.report();
      });
      // รีเลย์ล่มหรือยังไม่ได้ deploy ก็ไม่เป็นไร ลองใหม่เรื่อย ๆ แบบเงียบ ๆ
      // (สายที่ถูก rename ปิดไปแล้วต้องไม่มาตั้งเวลาต่อใหม่แข่งกับสายปัจจุบัน)
      es.onerror = () => { if(NORA._es === es) retry(); };
    };

    /* ถอยห่างขึ้นเรื่อย ๆ 2 4 8 16 30 วินาที
       รีเลย์ล่มยาว ๆ จะได้ไม่โดนจอทุกตัวถล่มยิงซ้ำทุก 5 วิพร้อมกัน */
    const retry = () => {
      if(NORA._es){ try{ NORA._es.close(); }catch(e){} NORA._es = null; }
      NORA.linked = false; paintInfo();
      clearTimeout(NORA._timer);
      NORA._timer = setTimeout(open, Math.min(30000, 2000 * Math.pow(2, NORA._tries++)));
    };

    NORA._open = open;
    NORA._retry = retry;
    open();

    setInterval(() => NORA.report(), 10000);
    setInterval(() => {
      if(NORA._es && Date.now() - NORA._beat > 45000) retry();
    }, 5000);

    const wake = () => {
      if(!NORA._es || Date.now() - NORA._beat > 20000) NORA.relink();
    };
    addEventListener('online', wake);
    addEventListener('pageshow', wake);
    addEventListener('visibilitychange', () => { if(!document.hidden) wake(); });
  },

  /* ต่อใหม่เดี๋ยวนี้ ไม่ต้องรอคิวถอยห่าง — ใช้ตอนรู้แน่ว่าสายตายแล้ว */
  relink(){ if(NORA._open){ NORA._tries = 0; NORA._open(); } },
};
window.NORA = NORA;

/* ---------- เริ่มทำงาน ---------- */
async function boot(){
  /* โหลดความยาวจากไฟล์กลางก่อนสร้างไทม์ไลน์ ทุกจอจึงเพิ่มเวลาเท่ากัน
     ถ้าไฟล์หายยังใช้ DWELL ได้ตามเดิม ไม่ทำให้หน้าเปิดไม่ได้ */
  try{
    const r = await fetch('assets/durations.json');
    if(r.ok){ const j = await r.json(); VID_DUR = j.durations || j; }
  }catch(e){}
  buildTimeline();

  if(SYNC){
    const q = clockPos();
    show(q.i, q.off);
  } else {
    const n = Math.max(0, (parseInt(QS.get('slide'), 10) || 1) - 1);
    show(Math.min(n, SLIDES.length - 1));
  }
  // ชุด intro: ค้างหน้าแรกไว้เสมอ ไม่ให้เดินหน้าไปเอง
  // ม่านยังปิด = หยุดวิดีโอไว้ด้วย (ไม่มีใครเห็น เปลืองเปล่า)
  // ม่านเปิดแล้ว = ปล่อยวิดีโอวนเล่น แต่ tick ก็ยังไม่พาไปหน้าถัดไป
  if(DECK === 'intro'){ show(0); setPlaying(CURTAIN_UP); }
  markMode(PANEL_ON ? String(PANEL_ON)
                    : (WALL_ON ? 'wall' : (ULTRA_ON ? 'w' : '0')));
  raf = requestAnimationFrame(tick);
  NORA.connect();
}
boot();
</script>
