<style>
/* ฟอนต์ Anuphan (Cadson Demak, SIL OFL 1.1) — ดูสัญญาอนุญาตที่ brand/Anuphan-OFL.txt */
@font-face{
  font-family:'Anuphan';
  src:url('brand/Anuphan-var.woff2') format('woff2-variations'),
      url('brand/Anuphan-var.woff2') format('woff2');
  font-weight:100 700;
  font-style:normal;
  font-display:block;
}
/* ============================================================
   AI NORA — Exhibition loop deck
   ธีมสีตาม ainora.psu.ac.th (gold #D4AF37 / paper #F8FAFC / ink #111827)
   ตัวอักษร Anuphan · เวทีวาดที่ 3840x2160 แล้วย่อให้พอดีจอ
   ============================================================ */
:root{
  --paper:#F8FAFC;      /* พื้นหลังหน้า (เหมือนเว็บ) */
  --paper-2:#EFF2F6;
  --card:#FFFFFF;
  --ink:#111827;        /* หัวเรื่อง */
  --body:#374151;
  --muted:#6B7280;
  --line:#E3E7EC;
  --gold:#D4AF37;       /* สีทองของเว็บ ainora.psu.ac.th */
  --gold-dk:#A6841F;
  --gold-soft:#FAF3DE;
  --saffron:#E88B00;    /* สีส้มจากโลโก้ AI NORA */
  --dark:#141A24;
  --stage-w:3840px;
  --stage-h:2160px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* ล็อกความสูงไว้เท่าหน้าจอ ไม่ให้มีแถบเลื่อนหรือการสกรอลล์เด็ดขาด
   (dvh เผื่อกรณีเปิดใน iframe หรือเบราว์เซอร์ที่มีแถบเครื่องมือซ่อน/โผล่) */
html,body{
  height:100vh;height:100dvh;
  min-height:100vh;min-height:100dvh;
  max-height:100vh;max-height:100dvh;
  width:100%;max-width:100%;
  background:#0A0C10;overflow:hidden;
  overscroll-behavior:none;touch-action:none;
}
body{position:fixed;inset:0}
body{font-family:"Anuphan","Noto Sans Thai",system-ui,-apple-system,sans-serif;
     color:var(--body);font-variant-numeric:tabular-nums}

#viewport{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#0A0C10}
#stage{
  width:var(--stage-w);height:var(--stage-h);
  position:absolute;left:50%;top:50%;
  transform-origin:center center;
  transform:translate(-50%,-50%) scale(0.25);
  overflow:hidden;background:var(--paper);
}

/* ---------- slide shell ---------- */
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease}
.slide.on{opacity:1;visibility:visible}
.slide::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 6% -12%, rgba(212,175,55,.13), transparent 58%),
    radial-gradient(110% 80% at 102% 108%, rgba(212,175,55,.09), transparent 60%),
    var(--paper);
}
.slide > *{position:relative}

/* ---------- header ---------- */
.hdr{position:absolute;top:104px;left:150px;right:150px;display:flex;align-items:flex-start;gap:60px}
.hdr-txt{flex:1;min-width:0}
.eyebrow{
  display:inline-flex;align-items:center;gap:22px;
  font-size:42px;font-weight:700;letter-spacing:.16em;color:var(--gold-dk);
  text-transform:uppercase;margin-bottom:24px;
}
.eyebrow::before{content:"";width:104px;height:6px;background:var(--gold);border-radius:3px;
  transform-origin:left center}
h1.title{
  font-family:"Anuphan",sans-serif;
  font-size:104px;line-height:1.16;font-weight:700;color:var(--ink);
  letter-spacing:-.015em;
}
h1.title .thin{color:var(--muted);font-weight:600}
.sub{margin-top:20px;font-size:48px;font-weight:400;color:var(--body);line-height:1.35}

.wordmark{flex:0 0 auto;text-align:right;padding-top:4px}
.wordmark img{display:block;width:520px;height:auto;margin-left:auto}
.wordmark .org{margin-top:12px;font-size:32px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.lg-light{display:none}
.slide.dark .lg-dark{display:none}
.slide.dark .lg-light{display:block}
.slide.dark .wordmark .org{color:rgba(255,255,255,.58)}

/* ---------- footer + แถบโลโก้ผู้สนับสนุน ---------- */
.ftr{
  position:absolute;left:150px;right:150px;bottom:74px;
  display:flex;align-items:center;gap:36px;
  font-size:34px;color:var(--muted);font-weight:500;
}
.ftr .dot{width:11px;height:11px;border-radius:50%;background:var(--gold);flex:0 0 auto}
.ftr .grow{flex:1}
.slide.dark .ftr{color:rgba(255,255,255,.6)}

.logos{
  align-self:flex-start;flex:0 0 auto;
  display:flex;align-items:center;gap:34px;
  background:#fff;border:2px solid var(--line);border-radius:999px;
  padding:16px 40px;box-shadow:0 14px 34px -22px rgba(17,24,39,.4);
}
.logos img{height:calc(84px * var(--k,1));width:auto;display:block}
.logos .sep{width:2px;height:60px;background:var(--line);flex:0 0 auto}
.logobox{
  height:84px;min-width:230px;padding:0 24px;border:3px dashed #C9CFD8;border-radius:16px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:26px;font-weight:600;color:#7C8694;line-height:1.15;background:#FAFBFC;
}
.hero .logobox{height:112px;min-width:280px;font-size:30px}
.hero .logos{padding:22px 52px;gap:52px}
.hero .logos img{height:calc(112px * var(--k,1))}

.progress{position:absolute;left:0;right:0;bottom:0;height:12px;background:rgba(17,24,39,.10)}
.progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--saffron));transition:width .1s linear}

/* ---------- comparison grid ---------- */
.stagebody{position:absolute;left:150px;right:150px;top:404px;bottom:230px;display:flex;flex-direction:column}
.cmp{flex:1;display:grid;grid-template-columns:1fr auto 1fr;gap:70px;align-items:center}
.cmp.solo{grid-template-columns:1fr}
/* สื่อชิ้นเดียวบนจอเสริม/ผืนกว้าง — บีบกรอบให้พอดีของจริง ไม่เหลือพื้นขาวกว้าง
   จอซ้ายเป็นภาพนิ่งแนวตั้ง (กว้างกว่าได้) ส่วนที่เหลือเป็นคลิป 9:16 จึงแคบกว่า */
.pL .cmp.solo{grid-template-columns:minmax(0,1500px);justify-content:center}
.pR .cmp.solo,.pCR .cmp.solo,.pW .cmp.solo,.pCU .cmp.solo{
  grid-template-columns:minmax(0,1100px);justify-content:center}
/* คลิปแนวตั้ง 9:16 — บีบกรอบเท่ากันทุก pane รวมทั้งจอซ้าย ต้องอยู่หลังกฎ .pL ด้านบน */
.cmp.solo.clip{grid-template-columns:minmax(0,1100px);justify-content:center}
/* สามคลิปเรียงกันในจอเดียว (โหมด 16:9) — คลิปละไม่เกิน 1100px กลางจอ */
.cmp3{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1100px));
  gap:60px;align-items:stretch;justify-content:center}
.panel{
  height:100%;background:var(--card);border:3px solid var(--line);border-radius:40px;
  box-shadow:0 34px 70px -44px rgba(17,24,39,.42);
  display:flex;flex-direction:column;overflow:hidden;
}
.panel .cap{
  flex:0 0 auto;display:flex;align-items:center;gap:26px;
  padding:32px 46px;background:var(--ink);color:#fff;
}
.panel .cap .badge{
  flex:0 0 auto;font-size:32px;font-weight:700;letter-spacing:.1em;
  background:rgba(255,255,255,.18);border-radius:999px;padding:9px 26px;
}
/* 1.34 ไม่ใช่ 1.2 — แถบหัวการ์ดอยู่ชิดขอบบนของ .panel ที่ overflow:hidden
   หมึกของสระซ้อนวรรณยุกต์ (ที่ · ฟื้น) สูงกว่า ascent ของฟอนต์ จึงเฉี่ยวขอบจนปลายแหว่ง */
.panel .cap .lbl{font-size:44px;font-weight:600;line-height:1.34}
.panel.alt .cap{background:var(--gold)}
.panel.alt .cap .lbl{color:#2E2405}
.panel.alt .cap .badge{background:rgba(0,0,0,.16);color:#2E2405}
.panel .body{position:relative;flex:1;min-height:0;display:flex;align-items:stretch;
  justify-content:center;gap:26px;padding:40px;background:var(--paper-2);overflow:hidden}
/* สื่อชิ้นเดียว — จัดกลางด้วยตำแหน่งสัมบูรณ์ + margin:auto
   คลิป 9:16 หรือภาพแนวตั้งจึงย่อให้พอดีกรอบเอง ไม่ล้นออกไปแล้วถูก overflow ตัด
   (เดิม width:100% + height:auto ทำให้คลิปแนวตั้งสูงเป็น 1.78 เท่าของความกว้างกรอบ) */
.panel .body > img:only-child,
.panel .body > video:only-child{
  position:absolute;inset:0;margin:auto;width:auto;height:auto;
  max-width:calc(100% - 80px);max-height:calc(100% - 80px);
  object-fit:contain;display:block;border-radius:14px}
/* ภาพคู่ ซ้าย+ขวา — คุมด้วยความสูงของกรอบ */
.panel .body.two img{flex:0 1 48%;min-width:0;height:100%;width:auto;
  object-fit:contain;display:block;border-radius:14px}

.arrow{font-size:150px;line-height:1;color:var(--gold);font-weight:700;user-select:none}
.arrow small{display:block;font-size:32px;color:var(--muted);font-weight:600;text-align:center;margin-top:8px;letter-spacing:.08em}

/* ---------- combine (poses + result) ---------- */
.combine{flex:1;display:grid;grid-template-columns:1fr auto minmax(0,1120px);
  gap:64px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:32px;align-items:stretch;justify-content:center}
.chip{
  width:calc(33.333% - 24px);min-width:300px;background:var(--card);border:3px solid var(--line);
  border-radius:30px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 50px -36px rgba(17,24,39,.4);
}
.chips.n1 .chip{width:70%}
.chips.n2 .chip{width:calc(50% - 18px)}
.chips.n3 .chip{width:calc(33.333% - 22px);min-width:0}
.chips.n4 .chip{width:calc(50% - 18px)}
.chip .ph{flex:1;min-height:250px;position:relative;background:var(--paper-2);overflow:hidden}
.chip .ph img{position:absolute;inset:18px;width:calc(100% - 36px);height:calc(100% - 36px);object-fit:contain}
.chip .nm{padding:18px 22px;font-size:34px;font-weight:600;text-align:center;color:var(--ink);background:var(--card);line-height:1.25}
.chip.newpose .nm{color:var(--gold-dk)}
.chip.newpose .ph{background:#FBF5E4}
.newmark{font-size:92px;color:var(--gold);font-weight:700;line-height:1;text-align:center}
.newmark span{display:block;font-size:30px;color:var(--muted);font-weight:600;margin-top:10px}

/* ---------- placeholder ---------- */
.ph-box{
  width:100%;height:100%;flex:1 1 0;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  background:repeating-linear-gradient(135deg,#EDF1F5 0 30px,#E4E9EF 30px 60px);
  border-radius:16px;padding:60px;text-align:center;
}
.ph-box .ic{font-size:110px;line-height:1;color:var(--gold)}
.ph-box .t1{font-size:50px;font-weight:700;color:var(--ink)}
.ph-box .t2{font-size:32px;color:var(--muted);line-height:1.45;word-break:break-all;max-width:92%}
.ph-box code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:28px;background:rgba(17,24,39,.07);padding:6px 14px;border-radius:10px;display:inline-block;margin-top:6px}

/* ---------- title + section slides ---------- */
.slide.dark::before{
  background:
    radial-gradient(120% 100% at 12% -8%, rgba(212,175,55,.34) 0%, transparent 58%),
    radial-gradient(120% 100% at 100% 104%, rgba(232,139,0,.24) 0%, transparent 60%),
    linear-gradient(158deg,#3A2B15 0%,#241A0E 46%,#15100A 100%);
}
.bgimg{
  position:absolute;inset:0;background-position:center;background-size:cover;
  opacity:.34;mix-blend-mode:soft-light;filter:saturate(1.15) contrast(1.05);
}
.slide.dark{color:#fff}
.slide.dark h1.title{color:#fff}
.slide.dark .sub{color:#F3E6C4}
.slide.dark .eyebrow{color:var(--gold)}
.slide.dark .eyebrow::before{background:var(--gold)}
.slide.dark .progress{background:rgba(255,255,255,.14)}
.hero{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 300px;gap:38px}
/* ============================================================
   สระบน + วรรณยุกต์ ต้องไม่โดนตัด
   ============================================================
   ฟอนต์ Anuphan วางหมึกของสระซ้อนวรรณยุกต์ (ที่ · นิ่ง · เคลื่อน · ครั้ง)
   สูงถึง 1.119 em เหนือเส้นฐาน แต่ ascent ของฟอนต์คือ 1.025 em
   หมึกส่วนบนจึงล้นออกนอกกล่องของตัวอักษรเสมอ — ปกติไม่เป็นไร เพราะ
   เบราว์เซอร์วาดทับออกไปได้

   แต่หัวเรื่องพวกนี้ใช้ background-clip:text ระบายไล่สีทองแทนสีตัน
   ซึ่งวาดพื้นหลังได้แค่ "ในกล่องของตัวเอง" แล้วค่อยตัดตามรูปตัวอักษร
   หมึกที่ล้นออกนอกกล่องจึงไม่มีสีมาลง = วรรณยุกต์หายไปเฉย ๆ
   (สังเกตว่าหายเฉพาะตัวที่ซ้อนสองชั้น ส่วน ท่า ที่มีชั้นเดียวยังอยู่)

   แก้ด้วยการดันขอบกล่องขึ้น-ลงด้วย padding แล้วหักกลับด้วย margin เท่ากัน
   พื้นที่ระบายสีจึงกว้างพอคลุมหมึกส่วนที่ล้น ส่วนขนาดกล่องนอกเท่าเดิมเป๊ะ
   เลย์เอาต์ทุกหน้าไม่ขยับสักพิกเซล                                      */
.hero .big, .wide-hero .big, .wide-sec .num, .sumgrid .kpi b, .dsurl .u{
  padding-block:.32em;
  margin-block:-.32em;
}

.hero .big{
  font-family:"Anuphan",sans-serif;font-weight:700;font-size:150px;line-height:1.06;letter-spacing:-.02em;
  background:linear-gradient(176deg,#F7E6B4 0%,#E3C468 48%,#C29B31 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .lead{font-size:62px;line-height:1.36;color:#F6EEDC;font-weight:400;max-width:2700px}
.hero .rule{width:250px;height:8px;background:var(--gold);border-radius:4px;transform-origin:left center}
.hero .meta{font-size:42px;color:rgba(255,255,255,.66);line-height:1.5}
.hero .herologo{width:1320px;height:auto;margin-bottom:6px;margin-left:-26px}
.secnum{
  position:absolute;right:250px;bottom:190px;
  font-family:"Anuphan",sans-serif;font-size:500px;line-height:.8;font-weight:700;
  color:rgba(255,255,255,.07);
}

/* ============================================================
   ULTRA WIDE 48:9 — จอ 3 จอเรียงยาว จอละ 16:9 (3840x2160)
   ซ้าย  = ตำแหน่งในกระบวนการ (เสริม)
   กลาง = สไลด์หลัก เหมือนโหมดจอเดียวเป๊ะ ๆ
   ขวา  = ป้ายกำกับนิทรรศการ รายละเอียดที่ไม่พอลงจอหลัก (เสริม)
   ============================================================ */
.pane{position:absolute;top:0;left:0;width:3840px;height:2160px;overflow:hidden}
.pL,.pR{display:none}
html.ultra #stage{width:11520px}
html.ultra .pL{display:block;left:0}
html.ultra .pC{left:3840px}
html.ultra .pR{display:block;left:7680px}
/* เส้นแบ่งจอ (เปิดด้วย ?seam=1 ตอนจัดวาง) */
html.ultra.seam .pC,html.ultra.seam .pR{box-shadow:inset 3px 0 0 rgba(212,175,55,.55)}

/* ---------- โหมดจอเดียวยาว (จอ LED ผืนเดียว ไม่มีขอบจอคั่น) ----------
   ต่างจากโหมดแบ่ง 3 จอที่ตรงนี้: องค์ประกอบที่ควรมี "อันเดียวต่อจอ"
   เช่นแถบโลโก้ผู้สนับสนุนและโลโก้ AI NORA จะไม่ซ้ำ 3 ชุด
   เหลือแถบโลโก้ไว้ซ้ายสุด และโลโก้ AI NORA ไว้ขวาสุด ของผืนทั้งหมด   */
/* จัดการจริงใน wallDedupe() เพราะบาง pane ไม่มีโลโก้/wordmark
   จึงต้องดูจากลำดับซ้าย-ขวาของ pane ที่แสดงอยู่จริง */

/* ---------- pane รวมทุกจอ (span) — ใช้ผืนเดียวยาว 11520px ---------- */
.pW,.pLC,.pCR,.pCU{display:none}
/* รวมทั้งผนัง 3 จอ */
html.ultra .slide.span .pL,
html.ultra .slide.span .pC,
html.ultra .slide.span .pR{display:none}
html.ultra .slide.span .pW{display:block;left:0;width:11520px}
/* รวมซ้าย+กลาง เหลือจอขวาอิสระ */
html.ultra .slide.span-lc .pL,
html.ultra .slide.span-lc .pC{display:none}
html.ultra .slide.span-lc .pLC{display:block;left:0;width:7680px}
/* จอซ้ายอิสระ รวมกลาง+ขวา */
html.ultra .slide.span-cr .pC,
html.ultra .slide.span-cr .pR{display:none}
html.ultra .slide.span-cr .pCR{display:block;left:3840px;width:7680px}
/* สองคลิปพร้อมกัน — จอกลางคลิปหนึ่ง จอขวาอีกคลิปหนึ่ง (ขั้นตอนที่ 03)
   โหมดจอเดียว 16:9 ไม่มีจอขวาให้ใช้ จึงย่อทั้งสองจอลงครึ่งแล้ววางเรียงกัน
   คนที่ดูจากจอเดียว (หรือไฟล์ที่อัดจากโหมดนี้) จะได้เห็นครบทั้ง 22 คลิปเหมือนเดิม
   ส่วนโหมด ?panel=2 / ?panel=3 ยังได้จอละคลิปเต็มขนาด เพราะนับเป็นโหมดจอยาว */
html:not(.ultra) .slide.dual .pC,
html:not(.ultra) .slide.dual .pR{display:block;top:540px;transform:scale(.5);transform-origin:0 0;
  outline:8px solid var(--line);outline-offset:-8px}
html:not(.ultra) .slide.dual .pR{left:1920px}

/* จอกลางใช้เนื้อหาคนละแบบเมื่ออยู่โหมดจอยาว (เช่นการเทียบ 3 ทาง) */
html.ultra .slide.span-cu .pC{display:none}
html.ultra .slide.span-cu .pCU{display:block;left:3840px;width:3840px}

/* ปกใหญ่แบบรวมจอ */
.wide-hero{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:52px;padding:0 420px;text-align:center}
.wide-hero .herologo{width:1760px;height:auto}
.wide-hero .eyebrow{margin-bottom:0}
.wide-hero .big{
  font-family:"Anuphan",sans-serif;font-weight:700;font-size:236px;line-height:1.02;
  letter-spacing:-.03em;
  background:linear-gradient(176deg,#F7E6B4 0%,#E3C468 48%,#C29B31 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.wide-hero .lead{font-size:76px;line-height:1.34;color:#F6EEDC;font-weight:400;max-width:8200px}
.wide-hero .meta{font-size:52px;color:rgba(255,255,255,.66);line-height:1.5}
.wide-hero .logos{align-self:center}

/* ปกหมวดแบบรวมจอ: เลขใหญ่ซ้าย · ชื่อขั้นกลาง · บันไดขั้นตอนเรียงยาวด้านล่าง */
.wide-sec{position:absolute;inset:150px 260px 420px;display:flex;align-items:center;gap:150px}
.wide-sec .num{
  flex:0 0 auto;font-size:900px;line-height:.78;font-weight:700;letter-spacing:-.05em;
  background:linear-gradient(176deg,#F7E6B4 0%,#D9B658 55%,#A9821F 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.wide-sec .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:44px}
.wide-sec .tx .big{
  font-family:"Anuphan",sans-serif;font-weight:700;font-size:260px;line-height:1.04;
  letter-spacing:-.03em;color:#fff;
}
.wide-sec .tx .lead{font-size:80px;line-height:1.34;color:#F3E6C4;max-width:6600px}
/* ปกขั้นตอนบนจอกลางจอเดียว (3840px) — เลขอยู่บน ชื่อขั้นตอนอยู่ล่าง */
.pCU .wide-sec{inset:170px 210px 240px;flex-direction:column;align-items:flex-start;
  justify-content:center;gap:56px}
.pCU .wide-sec .num{font-size:430px;line-height:.78}
.pCU .wide-sec .tx{gap:32px}
.pCU .wide-sec .tx .big{font-size:132px}
.pCU .wide-sec .tx .lead{font-size:56px;max-width:3350px}
.secfoot{position:absolute;left:210px;bottom:120px}
/* ---------- กองภาพตัวอย่าง วางเอียงซ้อนกันเหมือนกองรูปถ่าย ---------- */
.pstack{position:relative;flex:1;min-width:0;min-height:0}
.pstack .pc{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) translate(var(--x),var(--y)) rotate(var(--r));
  background:#FFFDF8;padding:26px 26px 18px;border-radius:12px;
  box-shadow:0 46px 90px -34px rgba(0,0,0,.6),0 0 0 2px rgba(17,24,39,.07);
  display:flex;flex-direction:column;gap:12px;
}
.pstack .pc img{height:var(--ih,1180px);width:auto;max-width:none;object-fit:contain;display:block;border-radius:4px}
.pstack .pc i{font-style:normal;font-size:34px;font-weight:600;color:#4B5563;text-align:center;line-height:1.2}
/* กองย่อสำหรับปกขั้นตอนบนจอเดียว 16:9 */
.pstack.side{position:absolute;left:auto;right:170px;top:0;bottom:0;width:1720px;flex:none}
.pstack.side .pc{padding:20px 20px 14px}
.pstack.side .pc img{height:var(--ih,1120px)}
.pstack.side .pc i{font-size:30px}
.hero.dvd{padding-right:2020px}

.wide-foot{position:absolute;left:260px;bottom:150px}

html.motion .slide.on .wide-hero .herologo{animation:riseIn .9s cubic-bezier(.2,.7,.3,1) both}
html.motion .slide.on .wide-hero .big     {animation:riseIn .9s cubic-bezier(.2,.7,.3,1) .14s both}
html.motion .slide.on .wide-hero .lead    {animation:riseIn .9s cubic-bezier(.2,.7,.3,1) .3s both}
html.motion .slide.on .wide-sec .num      {animation:riseIn 1s cubic-bezier(.2,.7,.3,1) both}
html.motion .slide.on .wide-sec .tx .big  {animation:riseIn .9s cubic-bezier(.2,.7,.3,1) .16s both}
html.motion .slide.on .wide-sec .tx .lead {animation:riseIn .9s cubic-bezier(.2,.7,.3,1) .3s both}
html.motion .slide.on .pstack .pc{animation:dealIn .85s cubic-bezier(.2,.7,.3,1) both;
  animation-delay:calc(var(--i) * .13s)}
@keyframes dealIn{
  from{opacity:0;
    transform:translate(-50%,-50%) translate(var(--x),calc(var(--y) + 110px)) rotate(0deg) scale(.93)}
  to  {opacity:1;
    transform:translate(-50%,-50%) translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}
}

/* ---------- เลย์เอาต์ในผืนกว้าง (2 จอ = 7680 / 3 จอ = 11520) ---------- */
.wideband{position:absolute;inset:0;display:flex;flex-direction:column;padding:120px 150px 150px}
.wideband .wb-hd{display:flex;align-items:flex-start;gap:60px;margin-bottom:44px}
.wideband .wb-hd .t{flex:1;min-width:0}
.wideband h2{font-size:110px;font-weight:700;color:var(--ink);line-height:1.12;letter-spacing:-.02em}
.slide.dark .wideband h2{color:#fff}
.wideband .wb-sub{margin-top:16px;font-size:46px;color:var(--body);line-height:1.32}
.slide.dark .wideband .wb-sub{color:#EFE3CB}
.wideband .wb-body{flex:1;min-height:0;display:flex;align-items:stretch;gap:80px}
.wideband .wb-body > *{min-height:0}
.wideband .wb-body > .duowide{max-width:5800px;margin:0 auto}
/* คู่ภาพแนวตั้ง (ต้นฉบับ/ฟื้นฟู) — บีบให้แคบกว่าคู่วิดีโอ ไม่เหลือพื้นว่างสองข้าง */
.wideband .wb-body > .duowide.portrait{max-width:4600px}
.wideband .wb-body > .cmp{flex:1;min-width:0;height:100%}
.wideband .wb-ft{margin-top:40px;display:flex;align-items:center;gap:40px;
  font-size:34px;color:var(--muted);font-weight:500}
.wideband .wb-ft .grow{flex:1}

/* แถบท่ารำเรียงยาว (ท่าครู ๑๒ ท่า) */
.strip{flex:1;min-width:0;height:100%;display:flex;align-items:stretch;gap:26px}
.strip .cell{flex:1;min-width:0;background:var(--card);border:3px solid var(--line);border-radius:26px;
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 50px -36px rgba(17,24,39,.4)}
.strip .cell .im{flex:1;min-height:0;position:relative;background:var(--paper-2);overflow:hidden}
.strip .cell .im img{position:absolute;inset:16px;width:calc(100% - 32px);height:calc(100% - 32px);object-fit:contain}
.strip .cell .nm{padding:16px 12px;font-size:30px;font-weight:600;text-align:center;color:var(--ink);line-height:1.2}
.strip.grid6{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:min-content;
  gap:30px;align-content:center;justify-items:stretch}
.strip.grid6 .cell .im{flex:none;aspect-ratio:3/5}
.strip.grid6 .cell .nm{font-size:38px}
.strip .cell .no{position:absolute}

/* ไทม์ไลน์กระบวนการเรียงยาว */
.tline2{flex:1;height:100%;display:flex;align-items:center;gap:0;position:relative}
.tline2::before{content:"";position:absolute;left:120px;right:120px;top:50%;height:8px;
  background:linear-gradient(90deg,var(--gold),var(--saffron));border-radius:4px;opacity:.5}
.tline2 .node{flex:1;display:flex;flex-direction:column;align-items:center;gap:26px;position:relative}
.tline2 .dot{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;
  font-size:70px;font-weight:700;color:#2E2405;background:var(--gold);
  box-shadow:0 0 0 18px var(--paper),0 26px 54px -30px rgba(166,132,31,.8)}
.slide.dark .tline2 .dot{box-shadow:0 0 0 18px #1B1408,0 26px 54px -30px rgba(0,0,0,.7)}
.tline2 .cap{text-align:center;max-width:1500px}
.tline2 .cap b{display:block;font-size:52px;font-weight:600;color:var(--ink);line-height:1.2}
.tline2 .cap span{display:block;font-size:34px;color:var(--muted);margin-top:10px;line-height:1.3}
.slide.dark .tline2 .cap b{color:#fff}
.slide.dark .tline2 .cap span{color:rgba(255,255,255,.66)}

/* การ์ดสรุป / เครดิต */
.sumgrid{flex:1;height:100%;display:flex;align-items:stretch;gap:34px}
.sumgrid .kpi{flex:1;background:rgba(255,255,255,.06);border:3px solid rgba(255,255,255,.16);
  border-radius:34px;padding:56px 52px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.sumgrid .kpi b{font-size:190px;line-height:.9;font-weight:700;
  background:linear-gradient(176deg,#F7E6B4,#D9B658 55%,#A9821F);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sumgrid .kpi span{font-size:46px;color:#F1E6CE;line-height:1.3;font-weight:500}
/* แผ่นข้อชี้แจง — ข้อความยาวกว่าตัวเลขสรุป จัดชิดบนและขยายตัวอักษร */
.sumgrid.facecol .kpi{gap:30px;padding:70px 60px}
.sumgrid.facecol .kpi b{font-size:150px}
.sumgrid.facecol .kpi span{font-size:62px}
/* หน้าปิดท้าย — จอซ้ายผู้สนับสนุน จอกลางสรุป จอขวาเครดิต
   โลโก้ผู้สนับสนุนเป็นภาพเข้มบนพื้นขาว จึงต้องมีการ์ดขาวรองบนสไลด์พื้นเข้ม */
.sponsors{flex:1;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:170px;text-align:center}
.sponsors .grp{display:flex;flex-direction:column;align-items:center;gap:56px}
.sponsors .row{display:flex;align-items:stretch;justify-content:center;gap:80px}
.sponsors .box{flex:0 0 auto;background:#fff;border-radius:44px;padding:48px 64px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 22px 48px -30px rgba(0,0,0,.65)}
.sponsors .box img{display:block;width:auto;height:calc(340px * var(--k,1));max-width:1300px}
.sponsors .lbl{font-size:72px;font-weight:700;color:var(--gold);letter-spacing:.08em}
.sponsors .lbl.org{font-size:80px;color:#F1E6CE;letter-spacing:.02em}

/* ตารางท่าใหม่ — การ์ดละท่า เรียงกลางจอ แถวสุดท้ายไม่ครบก็ยังอยู่กลาง
   จึงใช้ flex-wrap ไม่ใช่ grid (grid จะดันแถวสุดท้ายไปชิดซ้าย) */
.newgrid{flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:44px;
  align-content:center;justify-content:center}
.newgrid .np{flex:0 0 calc(25% - 33px);min-width:0;display:flex;flex-direction:column;gap:16px;
  background:rgba(255,255,255,.06);border:3px solid rgba(227,196,104,.42);border-radius:34px;
  padding:42px 40px}
.newgrid .np .mark{font-size:56px;line-height:1;color:var(--gold)}
.newgrid .np .nm{font-size:62px;font-weight:700;color:#fff;line-height:1.15}
.newgrid .np .meta{font-size:38px;color:#E3C468;line-height:1.3}
.newgrid .np .nb{font-size:36px;color:rgba(255,255,255,.7);line-height:1.35}
.slide:not(.dark) .newgrid .np{background:var(--card);border-color:var(--line)}
.slide:not(.dark) .newgrid .np .nm{color:var(--ink)}
.slide:not(.dark) .newgrid .np .meta{color:var(--gold-dk)}
.slide:not(.dark) .newgrid .np .nb{color:var(--muted)}
.sumgrid.grid2{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:44px}
.sumgrid.grid2 .kpi b{font-size:250px}
.sumgrid.grid2 .kpi span{font-size:62px}
.credits.stack{flex-direction:column;gap:72px;align-items:stretch;justify-content:center}
.credits.stack .col{flex:0 0 auto;gap:30px}
.credits.stack .col h3{font-size:58px}
.credits.stack .col p{font-size:58px}
.credits.stack .col p small{font-size:42px;margin-top:8px}
/* โหมดจอเดียว 16:9 ไม่มีจอซ้าย/ขวา จึงเรียงสรุปไว้บน เครดิตไว้ล่าง ในหน้าเดียว */
/* หน้าชุดข้อมูลเปิด */
.dscol{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.dsgrid{flex:1;min-height:0;display:flex;flex-direction:column;gap:36px;justify-content:center}
.dsgrid .ds{background:rgba(255,255,255,.06);border:3px solid rgba(227,196,104,.42);
  border-radius:30px;padding:38px 44px;display:flex;flex-direction:column;gap:12px}
.dsgrid .ds .nm{font-size:62px;font-weight:700;color:#fff;line-height:1.15}
.dsgrid .ds .dd{font-size:42px;color:rgba(255,255,255,.72);line-height:1.35}
.dsurl{flex:0 0 auto;margin-top:44px;display:flex;flex-direction:column;gap:14px;align-items:center;
  text-align:center}
.dsurl .lb{font-size:42px;color:rgba(255,255,255,.7)}
.dsurl .u{font-size:104px;font-weight:700;letter-spacing:.01em;
  background:linear-gradient(176deg,#F7E6B4 0%,#E3C468 48%,#C29B31 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.slide:not(.dark) .dsgrid .ds{background:var(--card);border-color:var(--line)}
.slide:not(.dark) .dsgrid .ds .nm{color:var(--ink)}
.slide:not(.dark) .dsgrid .ds .dd{color:var(--muted)}
.slide:not(.dark) .dsurl .lb{color:var(--muted)}
.endstack{flex:1;min-height:0;display:flex;flex-direction:column;gap:80px}
.endstack .sumgrid{flex:0 0 640px;height:auto}
.endstack .credits{flex:1;height:auto;align-items:flex-start}
/* ---- ทีมทำงานในหน้าเครดิต ----
   ภาพถูกครอปเป็นจัตุรัสจัดใบหน้าให้ตรงกันมาแล้ว ที่นี่จึงแค่ตัดเป็นวงกลม
   object-fit:cover กันภาพยืดถ้าวันหนึ่งมีคนเปลี่ยนไฟล์เป็นสัดส่วนอื่น */
.team{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:34px}
.team h3{font-size:52px;font-weight:700;color:var(--gold);letter-spacing:.04em;margin:0 0 6px}
.team .who{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.team .ph{width:300px;height:300px;border-radius:50%;overflow:hidden;flex:0 0 auto;
  background:#241E16;border:4px solid rgba(227,196,104,.42);
  box-shadow:0 18px 46px rgba(0,0,0,.5)}
.team .ph img{width:100%;height:100%;object-fit:cover;display:block}
.team .lead .ph{width:430px;height:430px;border-width:6px;border-color:rgba(227,196,104,.72)}
.team .nm{font-size:42px;font-weight:600;line-height:1.3;max-width:15ch}
.team .lead .nm{font-size:52px;max-width:22ch}
.team .rl{font-size:34px;color:var(--muted);line-height:1.3}
/* ชื่อย่อโผล่เฉพาะที่แคบ ถ้าไม่ได้ตั้ง short ไว้ ก็ใช้ชื่อเต็มตามเดิม */
.team .nm .shrt{display:none}
.endstack .team .nm:has(.shrt) .full{display:none}
.endstack .team .nm .shrt{display:inline}
.team .row{display:flex;gap:40px;align-items:flex-start;justify-content:center}
/* หัวหน้าสองคนอยู่แถวเดียวกัน วงเท่ากัน — คนละทีมแต่ระดับเดียวกัน
   flex-start ให้ขอบบนของวงตรงกัน ต่อให้ชื่อใต้ภาพยาวไม่เท่ากัน */
.team .leads{display:flex;gap:72px;align-items:flex-start;justify-content:center}

/* จอขวาโหมด 48:9 — เครดิตเป็นข้อความคอลัมน์ซ้าย ทีมงานอยู่ครึ่งขวาที่ว่างอยู่ */
.credpane{display:flex;gap:90px;align-items:center;height:100%}
.credpane .credits.stack{flex:1 1 auto}

/* จอเดียว 16:9 — ทีมงานเป็นแถวเดียว ชิดขวาให้พ้นแถบโลโก้ผู้สนับสนุน
   ที่ปักอยู่มุมซ้ายล่างของ frame() ถ้าปล่อยให้ชิดซ้ายจะทับกันพอดี */
.endstack{gap:48px}
.endstack .team{flex-direction:row;align-items:center;gap:52px;
  margin:0 4px 0 auto;align-self:flex-end}
.endstack .team h3{margin:0;font-size:38px;white-space:nowrap}
.endstack .team .who{gap:10px}
.endstack .team .ph{width:150px;height:150px;border-width:3px}
.endstack .team .lead .ph{width:190px;height:190px;border-width:4px}
.endstack .team .nm{font-size:26px;max-width:none;white-space:nowrap}
.endstack .team .lead .nm{font-size:28px;max-width:none}
.endstack .team .rl{font-size:22px}
.endstack .team .row{gap:38px}
.endstack .team .leads{gap:34px}
.credits{flex:1;height:100%;display:flex;gap:100px;align-items:center}
.credits .col{flex:1;display:flex;flex-direction:column;gap:26px}
.credits .col h3{font-size:44px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.credits .col p{font-size:42px;line-height:1.4;color:#F1E6CE}
.credits .col p small{display:block;font-size:32px;color:rgba(255,255,255,.6);margin-top:6px}

/* คู่ภาพ/วิดีโอในผืนกว้าง */
.duowide{flex:1;min-width:0;height:100%;display:grid;grid-template-columns:1fr auto 1fr;gap:70px;align-items:stretch}
/* เทียบภาพทรงตั้งบนจอเดียว — ล็อกความกว้างกรอบให้ใกล้สัดส่วนภาพ (ราว 0.6)
   ถ้าปล่อยให้กรอบกว้างเต็มคอลัมน์ ภาพแนวตั้งจะถูกจำกัดด้วยความสูง
   แล้วเหลือพื้นว่างซ้าย-ขวาข้างละเกือบครึ่งกรอบ */
.duowide.tall{grid-template-columns:minmax(0,880px) auto minmax(0,880px);
  justify-content:center;gap:56px}
/* กฎรวมของ .panel ใช้ width/height:auto จึงไม่ขยายภาพที่เล็กกว่ากรอบ
   ภาพสแกนจากหนังสือกว้างแค่ ~730px แต่กรอบกว้าง ~870px ภาพเลยลอยเล็กกลางกรอบ
   ตรงนี้บังคับให้เต็มกรอบแล้วค่อย contain รักษาสัดส่วน */
.panel.tight .body > img:only-child,.panel.tight .body > video:only-child{
  inset:13px;width:calc(100% - 26px);height:calc(100% - 26px);
  max-width:none;max-height:none;object-fit:contain}
/* โหมดจอเดียว 16:9 — วางครบ 3 ท่าในจอเดียว คอลัมน์ละท่า
   ในคอลัมน์มีทั้งภาพสแกน ภาพที่ฟื้นฟู และคำอธิบาย เหมือนที่แต่ละจอบนผนังได้รับ
   ป้ายหัวกรอบย่อลงเพราะกรอบแคบกว่าบนผนังราว 3 เท่า */
.trio3{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:54px}
.trio3 .t3{min-width:0;display:flex;flex-direction:column;gap:20px;justify-content:center}
.trio3 .t3 .hd{flex:0 0 auto;font-size:52px;font-weight:700;color:var(--ink);line-height:1.2;text-align:center}
.trio3 .t3 .hd small{display:block;font-size:30px;font-weight:600;color:var(--gold-dk);letter-spacing:.06em;margin-bottom:6px}
/* คอลัมน์กว้างราว 1100px กรอบละ ~545px ภาพแนวตั้งสัดส่วน 0.64
   ถ้าปล่อยให้กรอบสูงเต็มคอลัมน์ (สัดส่วน 0.44) ภาพจะถูกจำกัดด้วยความกว้าง
   แล้วเหลือช่องว่างบน-ล่างกรอบละเกือบ 400px จึงตัดความสูงกรอบไว้ให้พอดีภาพ */
.trio3 .t3 .pair{flex:1 1 auto;min-height:0;max-height:930px;
  display:grid;grid-template-columns:1fr 1fr;gap:16px}
.trio3 .panel{border-radius:26px;border-width:2px}
.trio3 .panel .cap{padding:14px 18px;gap:12px}
.trio3 .panel .cap .lbl{font-size:26px}
.trio3 .panel .cap .badge{font-size:20px;padding:5px 14px}
.trio3 .panel .body{padding:14px}
.trio3 .panel.tight .body > img:only-child{inset:8px;width:calc(100% - 16px);height:calc(100% - 16px)}
.slide.dark .trio3 .t3 .hd{color:#fff}

.cmpcol{flex:1;min-height:0;display:flex;flex-direction:column;gap:30px}
.cmpcol .duowide{flex:1;min-height:0;height:auto}
/* การ์ดเทียบก่อน-หลังจากรายงาน เป็นภาพสำเร็จรูปใบเดียว ให้พอดีพื้นที่ที่เหลือ */
/* แถวการ์ดเทียบก่อน-หลัง — บนผนังจอละ 4 ใบ ในโหมดจอเดียวห่อเป็น 6x2
   การ์ดจากรายงานมีพื้นขาวและป้ายชื่อท่าในตัวอยู่แล้ว จึงไม่ใส่กรอบซ้อนอีก */
.fgrid{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:30px}
.fgrid.wrap{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:22px}
.fgrid .fcard{min-width:0;min-height:0;margin:0;display:flex;flex-direction:column;gap:12px}
.fgrid .fcard img{flex:1;min-height:0;width:100%;object-fit:contain;
  filter:drop-shadow(0 18px 34px rgba(17,24,39,.28))}
.fgrid .fcard figcaption{flex:0 0 auto;font-size:34px;font-weight:600;color:var(--ink);
  text-align:center;line-height:1.2}
.fgrid.wrap .fcard figcaption{font-size:26px}
.slide.dark .fgrid .fcard figcaption{color:#F1E6CE}

/* การ์ดเทียบจากรายงานมีพื้นขาวในตัวอยู่แล้ว ถ้าใส่กรอบขาวซ้อนอีกชั้น
   จะเห็นเป็นกล่องขาวใหญ่ว่าง ๆ ข้างละครึ่ง จึงปล่อยให้ภาพลอยกลางพื้นที่แทน
   แล้วใช้ drop-shadow ซึ่งเกาะรูปจริงของภาพ ไม่ใช่กรอบ */
.figbox{flex:1;min-height:0;position:relative}
.figbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 26px 46px rgba(17,24,39,.32))}
/* สองแผงข้าง ๆ ต้องสูงเต็มผืน (stretch) แต่ลูกศรตรงกลางไม่ต้อง
   ถ้าปล่อยให้ stretch ตามไปด้วย ตัวลูกศรจะไปเกาะขอบบนของช่อง ไม่ตรงกลางแกน Y */
.duowide > .arrow{align-self:center}
.trio{flex:1;display:flex;flex-direction:column;gap:0}
.facebox{flex:0 0 auto;min-width:0;height:100%;display:flex;align-items:stretch;justify-content:center;
  background:rgba(255,255,255,.06);border:3px solid rgba(255,255,255,.16);border-radius:28px;padding:26px}
.facebox img{align-self:stretch;height:auto;width:auto;max-width:100%;object-fit:contain;border-radius:12px}

/* ---------- จอซ้าย: ตำแหน่งในกระบวนการ ---------- */

.ladder .tx b{display:block;font-size:46px;font-weight:600;color:var(--ink);line-height:1.2}
.ladder .tx span{display:block;font-size:32px;color:var(--muted);margin-top:6px;line-height:1.3}

.ladder li.cur{border-color:var(--gold);background:var(--gold-soft);

/* ---------- จอขวา: ป้ายกำกับนิทรรศการ ---------- */
.wr{position:absolute;inset:120px 150px 150px;display:flex;flex-direction:column;gap:34px}
.wr h2{font-size:88px;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:-.015em}

/* ============================================================
   ANIMATION — เล่นใหม่ทุกครั้งที่สไลด์ถูกแสดง
   ปิดทั้งหมดได้ด้วย ?nomotion=1
   ============================================================ */
@keyframes riseIn{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes inL{from{opacity:0;transform:translateX(-90px) scale(.97)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(90px) scale(.97)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.4)}60%{transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
@keyframes wipeX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.055)}}
@keyframes settle{from{transform:scale(1.03)}to{transform:scale(1)}}
@keyframes nudgeX{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes numIn{from{opacity:0;transform:translateY(90px) scale(.94)}to{opacity:.07;transform:none}}

/* ============================================================
   ชุด intro — ม่านเปิดงาน
   ============================================================
   ม่านเป็น "เลเยอร์คลุม" ไม่ใช่หน้าหนึ่งใน SLIDES
   จึงไม่ไปยุ่งกับไทม์ไลน์ เลขหน้า หรือนาฬิกาโลกเลย — จำนวนหน้าของโหมดไม่เปลี่ยน
   และวางไว้ใน #viewport ไม่ใช่ใน #stage เพราะต้องคลุม "จอจริง" ทั้งบาน
   ไม่ใช่ผืนเวทีที่ถูกย่อด้วย transform (ไม่งั้นม่านจะโดนย่อไปด้วย)      */
/* ม่านอยู่ "ใน" #stage ไม่ใช่ใน #viewport
   จึงกว้างเท่าผืนเวทีของโหมดที่เลือกอยู่ — 3840 ในโหมด 16:9 และ 11520 ในโหมด 48:9
   และถูกย่อด้วย transform เดียวกับสไลด์ ม่านจึงพอดีกับกรอบภาพเสมอ
   ไม่ล้นไปคลุมแถบดำด้านบน-ล่างตอนหน้าต่างไม่ได้สัดส่วนเดียวกับเวที

   ทุกขนาดในบล็อกนี้เป็น "พิกเซลของเวที" เหมือนสไลด์อื่น ไม่ใช่ vw
   จีบผ้าและตัวอักษรจึงมีขนาดจริงเท่ากันทุกโหมดและทุกความละเอียดจอ

   พื้นหลังต้องโปร่ง ไม่ใช่สีเข้ม — ตอนม่านแยกออก สิ่งที่ต้องโผล่มาคือสไลด์
   ที่อยู่ข้างล่าง ถ้าใส่สีไว้ จะเปิดม่านมาเจอพื้นดำเปล่า ๆ แทนหน้าแรก */
#curtain{position:absolute;inset:0;z-index:40;display:none;overflow:hidden;background:transparent}
html.deck-intro #curtain{display:block}
/* เปิดม่านแล้วแต่ยังอยู่ในชุด intro — ม่านหายไป เหลือหน้าแรกค้างไว้
   รอสแตฟฟ์กดเข้าชุดหลักเอง ไม่ใช่ระบบพาไปเอง */
html.deck-intro.curtain-up #curtain{display:none}

/* ---- ผืนผ้า ----
   อ้างจากภาพม่านจริงที่ได้มา: แดงสด ผ้าด้าน ไม่มีทองเลย
   จีบเป็นคลื่นกว้างและนุ่ม ไม่ใช่ซี่ถี่คอนทราสต์จัด
   หัวผ้าเข้มชัดเพราะอยู่ในเงาของราง แล้วค่อยสว่างลงมาและสว่างค้างไว้จนถึงชายผ้า

   คาบของจีบสามชั้น 300 / 137 / 1130 px ตั้งใจให้หารกันไม่ลงตัว
   ลายจึงไม่ซ้ำเป็นบล็อกให้จับได้ เหมือนผ้าจริงที่จีบไม่เท่ากันทุกลูก        */
.cfabric{
  position:absolute;inset:0;
  background-color:#C4132A;
  background-image:
    /* เงาจากรางด้านบน · ชายผ้าเข้มลงเล็กน้อย */
    linear-gradient(180deg,
      rgba(0,0,0,.76) 0%, rgba(0,0,0,.50) 4%, rgba(0,0,0,.20) 13%,
      rgba(0,0,0,.04) 26%, rgba(0,0,0,0) 44%,
      rgba(0,0,0,0) 88%, rgba(0,0,0,.18) 100%),
    /* เงาขอบนอก (ชิดผนัง) กับขอบใน (ชายที่มาชนกลาง) */
    linear-gradient(90deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,0) 12%,
      rgba(0,0,0,0) 86%, rgba(0,0,0,.28) 100%),
    /* จีบใหญ่ — กว้าง นุ่ม คอนทราสต์ต่ำ */
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.42) 0px,
      rgba(0,0,0,.15) 52px,
      rgba(255,196,186,.07) 140px,
      rgba(0,0,0,.13) 222px,
      rgba(0,0,0,.42) 300px),
    /* คลื่นย่อยกับคลื่นกว้าง คนละจังหวะ ทำลายความสม่ำเสมอของชั้นบน */
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.10) 0px, rgba(255,196,186,.05) 70px, rgba(0,0,0,.10) 137px),
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.15) 0px, rgba(255,196,186,.06) 470px, rgba(0,0,0,.15) 1130px);
}

.cpanel{
  position:absolute;top:0;bottom:0;width:52%;      /* เกิน 50% ให้เหลื่อมกัน ไม่มีร่องกลาง */
  will-change:transform;
}
/* บานซ้ายทับบานขวาตรงกลาง และทอดเงาลงบานที่อยู่ใต้ */
.cpanel.l{left:0;transform-origin:left center;z-index:2;box-shadow:22px 0 70px rgba(0,0,0,.5)}
.cpanel.r{right:0;transform-origin:right center;z-index:1}
.cpanel.r .cfabric{transform:scaleX(-1)}           /* พลิกจีบให้สมมาตรกับฝั่งซ้าย */

/* ชายผ้าด้านในเป็นรอยพับเข้ม ไม่มีริ้วทอง — ม่านในภาพอ้างอิงไม่มีทองเลยสักจุด */
.cedge{position:absolute;top:0;bottom:0;z-index:3}
.cpanel.l .cedge{right:0;width:26px;
  background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.55))}
.cpanel.r .cedge{left:0;width:64px;
  background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,0))}

/* ตะขอแขวนสีเข้ม — อยู่ "ใน" บานม่าน ไม่ใช่ติดกับราง
   เวลารูดม่าน ตะขอจึงเลื่อนและอัดกันไปพร้อมผ้า เหมือนของจริง
   คาบเท่าจีบใหญ่ ตะขอจึงตกตรงหัวจีบพอดี */
.chooks{
  position:absolute;top:44px;left:0;right:0;height:62px;z-index:4;
  background-image:repeating-linear-gradient(90deg,
    rgba(0,0,0,0) 0px, rgba(0,0,0,0) 116px,
    #241D1F 116px, #241D1F 178px,
    rgba(0,0,0,0) 178px, rgba(0,0,0,0) 300px);
}

/* ---- เปิดม่าน ----
   ผ้าหนักไม่ได้ออกตัวทันทีและไม่ได้เลื่อนเป็นแผ่นแข็ง จังหวะจึงเป็น
     ออกตัวช้า ๆ (ความเฉื่อยของผ้า) → รูดเข้าหาข้างจนจีบอัดกัน → ค่อยหลุดออกนอกจอ

   skewX ที่ค่อย ๆ เพิ่มแล้วคลายกลับ = ชายล่างลากตามหลังหัวผ้า
   เป็นตัวที่ทำให้ดู "พริ้ว" มากที่สุด ผ้าที่ถูกดึงไม่ได้ตั้งฉากตลอดเวลา  */
@keyframes curtainL{
  0%   { transform:skewX(0deg)    scaleX(1)   translateX(0) }
  16%  { transform:skewX(1.5deg)  scaleX(.90) translateX(0) }
  42%  { transform:skewX(2.4deg)  scaleX(.58) translateX(0) }
  66%  { transform:skewX(2.0deg)  scaleX(.30) translateX(0) }
  84%  { transform:skewX(1.0deg)  scaleX(.19) translateX(-120%) }
  100% { transform:skewX(0deg)    scaleX(.17) translateX(-600%) }
}
@keyframes curtainR{
  0%   { transform:skewX(0deg)    scaleX(1)   translateX(0) }
  16%  { transform:skewX(-1.5deg) scaleX(.90) translateX(0) }
  42%  { transform:skewX(-2.4deg) scaleX(.58) translateX(0) }
  66%  { transform:skewX(-2.0deg) scaleX(.30) translateX(0) }
  84%  { transform:skewX(-1.0deg) scaleX(.19) translateX(120%) }
  100% { transform:skewX(0deg)    scaleX(.17) translateX(600%) }
}
/* เคยมี @keyframes cripple เลื่อน background-position ของลายจีบทีละชั้น
   ให้จีบไถลผ่านกันเองระหว่างรูด — เอาออกแล้ว อย่าใส่กลับ

   background-position ไม่ใช่คุณสมบัติที่คอมโพสิตเตอร์ทำได้ เบราว์เซอร์ต้อง
   "วาดผ้าใหม่ทั้งผืนทุกเฟรม" ผืนหนึ่งกว้าง 52% ของเวที = ~6000×2160px
   ในโหมด 48:9 คูณสองบาน คูณ 60 เฟรมต่อวินาที บนราสเบอร์รีพายคือคอขวดทันที

   วัดด้วย tests/curtain-perf.mjs หน่วง CPU 12 เท่า ก่อน/หลังติดกัน
                 มี cripple            ไม่มี
     ?panel=2     5.0 fps ค้าง 2800ms   26.4 fps ค้าง 100ms
     ?ultra=1    21.6 fps ค้าง  650ms   54.0 fps ค้าง 350ms
     16:9         3.2 fps ค้าง 1833ms   21.4 fps ค้าง 100ms
   และเทียบภาพทีละพิกเซลแล้วแทบไม่ต่าง (ค่าเฉลี่ย 1.5/255)
   เพราะระยะที่จีบเลื่อนคือ 26-138px บนเวทีกว้างหมื่นกว่าพิกเซล ขณะที่ทั้งบาน
   กำลังหดจาก 100% เหลือ 17% อยู่แล้ว ตามองไม่ทันอยู่ดี

   เคยลองแยกลายจีบเป็นดิวลูกสามชั้นแล้วเลื่อนด้วย transform (คอมโพสิตได้)
   ช้ากว่าเดิมอีก — สามเลเยอร์ยักษ์ซ้อนกันแล้วต้องผสมอัลฟาทุกเฟรม
   ได้ 0.2/6.2 fps เทียบกับ 11/24 ของการตัดทิ้งเฉย ๆ                       */
/* ไม่มีหน่วงแล้ว — เดิมหน่วง .25s ไว้ให้ชื่องานกลางม่านจางก่อน
   ตอนนี้ม่านเปล่า ๆ กดแล้วต้องขยับทันที ไม่ให้รู้สึกว่าปุ่มไม่ติด */
/* --copen เป็นค่าติดลบเท่ากับเวลาที่คำสั่งใช้เดินทางมาถึงจอนี้
   ม่านจึงเริ่มที่เฟรม "ผ่านมาแล้วเท่านั้น" ไม่ใช่เฟรมแรกเสมอ
   จอสามบานได้รับคำสั่งห่างกันหลักสิบ ms ถ้าไม่หักออก ม่านจะรูดเหลื่อมกัน */
html.motion #curtain.open .cpanel.l{
  animation:curtainL 4.2s cubic-bezier(.42,0,.14,1) var(--copen,0ms) forwards}
html.motion #curtain.open .cpanel.r{
  animation:curtainR 4.2s cubic-bezier(.42,0,.14,1) var(--copen,0ms) forwards}
/* ทั้งสองเส้นข้างบนขยับแค่ transform อย่างเดียว คอมโพสิตเตอร์รับไปทำได้หมด
   ไม่มีการวาดใหม่สักเฟรม — เพิ่มคุณสมบัติอื่นเข้าไปเมื่อไรก็เสียข้อนี้ทันที */
/* ปิดอนิเมชันไว้ = ไม่ต้องรูด ม่านหายไปพร้อมกับที่ชุดสลับเป็นชุดหลัก */

/* รางม่านสีเข้มด้านบน อยู่กับที่ ไม่เลื่อนตามผ้า */
.crod{
  position:absolute;top:0;left:0;right:0;height:50px;z-index:6;
  background:linear-gradient(180deg,#453B3D,#1A1516 58%,#0C0A0A);
  box-shadow:0 14px 32px rgba(0,0,0,.5);
}

/* ---------- controls ---------- */
#ui{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:999px;
  background:rgba(12,16,22,.84);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.14);
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;
}
#ui.show{opacity:1;pointer-events:auto}
/* ป้ายตอนสั่งเต็มจอจาก controller แล้วเบราว์เซอร์ขอ "การกด" ก่อน
   ต้องเห็นชัดจากระยะไกลและอยู่เหนือทุกอย่าง คนคุมงานจะได้เดินไปกดได้ถูกจอ
   โผล่เฉพาะตอนรอ — ไม่ได้ค้างไว้ตลอด และหายเองใน 45 วินาที */
#armfull{
  position:fixed;left:50%;top:44px;transform:translateX(-50%);
  display:none;align-items:center;gap:16px;z-index:120;
  padding:20px 34px;border-radius:999px;
  background:rgba(12,16,22,.92);backdrop-filter:blur(14px);
  border:2px solid rgba(227,196,104,.85);color:#F6EEDC;
  font-size:34px;font-weight:600;letter-spacing:.01em;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  animation:armPulse 1.4s ease-in-out infinite;
}
html.armfull #armfull{display:flex}
#armfull b{color:var(--gold);font-weight:700}
@keyframes armPulse{50%{border-color:rgba(227,196,104,.30)}}
html.nomotion #armfull{animation:none}
#ui button{
  appearance:none;border:0;background:rgba(255,255,255,.10);color:#fff;
  font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer;
}
#ui button:hover{background:rgba(255,255,255,.22)}
#ui button.on{background:var(--gold);color:#2E2405}
#ui .sep{width:1px;height:22px;background:rgba(255,255,255,.18)}
#ui .grp{display:flex;align-items:center;gap:10px}
#ui [data-panels].hide{display:none}
#ui .info{color:var(--gold);font-size:13px;font-weight:600;padding:0 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="curtain">
      <div class="cpanel l"><div class="cfabric"></div><div class="chooks"></div><div class="cedge"></div></div>
      <div class="cpanel r"><div class="cfabric"></div><div class="chooks"></div><div class="cedge"></div></div>
      <div class="crod"></div>
    </div>
  </div>
</div>

<!-- ไม่ใส่ไอคอน ⛶ ตรงนี้ — ฟอนต์ของสไลด์ไม่มีตัวนั้น ขึ้นเป็นกล่องสี่เหลี่ยม -->
<div id="armfull"><span>กดปุ่มใดก็ได้<b> ที่จอนี้ </b>เพื่อเข้าเต็มจอ</span></div>

<div id="ui">
  <button data-act="prev">◀</button>
  <button data-act="toggle">⏸ หยุด</button>
  <button data-act="next">▶</button>
  <span class="info" id="uiInfo">–</span>
  <span class="sep"></span>
  <button data-mode="0" data-fam="s" title="จอเดียว 16:9">16:9</button>
  <button data-mode="w" data-fam="w" title="จอ 3 จอเรียงกัน จอละ 16:9">48:9 แบ่ง 3</button>
  <span class="sep" data-panels></span>
  <span class="grp" data-panels>
    <button data-mode="0" title="เนื้อหาหลักจอเดียว ไม่แบ่งจอ">เดี่ยว</button>
    <button data-mode="1" title="เฉพาะจอซ้าย">จอ 1</button>
    <button data-mode="2" title="เฉพาะจอกลาง">จอ 2</button>
    <button data-mode="3" title="เฉพาะจอขวา">จอ 3</button>
  </span>
  <span class="sep"></span>
  <button data-act="full">⛶ เต็มจอ</button>
  <button data-act="restart">↻ เริ่มใหม่</button>
</div>

<script>
/* ================================================================
   1. CONFIG — แก้ได้ตรงนี้
   ================================================================ */
const CONFIG = {
  SHOW_DIVIDERS : true,   // false = เอาสไลด์ปกขั้นตอนออก
  /* ---- เปิด/ปิดช่วงที่สื่อยังไม่พร้อม ----------------------------------
     นิทรรศการเปิดให้คนนอกดู ถ้าไฟล์ยังไม่มา สไลด์จะขึ้นกล่อง "อยู่ระหว่างจัดเตรียม"
     ซ้ำ ๆ หลายสิบหน้า ให้ตั้งเป็น false ปิดช่วงนั้นไปเลย
     รอบการแสดงจะยืดหน้าที่เหลือให้ครบ 30 นาทีเองโดยอัตโนมัติ            */
  SHOW_COLORIZE : true,   // 8 หน้า — แสดงเฉพาะไฟล์ที่มีอยู่ใน assets/color/
  SHOW_TWOSETS  : true,   // 4 หน้า หน้าละ 3 คลิป — ต้องมีไฟล์ใน assets/drive/
  SHOW_STUDENT  : true,   //  6 หน้า — ต้องมีไฟล์ assets/students/นักศึกษา-N.mp4
  /* ---- ผังรายการ 30 นาที : วินาทีตั้งต้นต่อหน้า ----------------------
     หน้าที่มีวิดีโอจะเพิ่มเวลาอัตโนมัติให้ไม่น้อยกว่าคลิปยาวที่สุดในหน้า
     จาก assets/durations.json ทุกจอจึงยังคำนวณไทม์ไลน์เดียวกันได้       */
  DWELL : {
    title     : 14,   // ปกใหญ่
    timeline  : 26,   // ไทม์ไลน์กระบวนการ
    divider   : 10,   // ปกขั้นตอน (5 ใบ)
    poses12   : 22,   // ภาพจากหนังสือ 2 หน้า หน้าละ 6 ท่า
    compare   : 30,   // เปรียบเทียบ ต้นฉบับ/ซ่อมแซม (12)
    combine   : 25,   // ภาพท่า + ภาพท่า = วิดีโอ (22)
    colorize  : 19,   // ขาวดำ/ใส่สี (22)
    student   : 30,   // นักศึกษารำ (6)
    threeway  : 26,   // 3 คลิปพร้อมกัน จอละคลิป (4)
    summary   : 25,   // สรุปผลงาน
    credits   : 20,   // เครดิต
  },
  CYCLE_TARGET_SEC : 1800,   // ยืด/หดทุกหน้าตามสัดส่วน ให้รอบลงตัว 30 นาที
                             // ใส่ 0 = ใช้เวลาตาม DWELL ตรง ๆ ไม่ปรับ
  /* ---- ที่มาของวิดีโอ ----
     สื่อทั้งหมดถูกฝังลง docker image แล้ว คอนเทนเนอร์จึงไม่ต้องต่อออกไปที่ไหนเลย
       true  = เล่นจากไฟล์ assets/videos/<id>.mp4 ในอิมเมจ  ← ค่าที่ใช้ deploy
       false = ขอผ่าน AINORA_BASE + /videos/<id>/file (ต้องมี proxy ให้)
     เติมไฟล์ด้วย sh deploy/fetch-media.sh ก่อน docker build                  */
  USE_LOCAL_VIDEOS: true,
  AINORA_BASE     : '/exhibition',   // ใช้เฉพาะเมื่อ USE_LOCAL_VIDEOS = false
  DIR_VIDEOS    : 'assets/videos/',
  ANIMATE       : true,   // false = ปิดอนิเมชันทั้งหมด (หรือใส่ ?nomotion=1 ที่ URL)
  ULTRA         : false,  // true = เปิดโหมดจอยาว 48:9 เป็นค่าเริ่มต้น (หรือใส่ ?ultra=1)
                          // ?panel=1|2|3 = แสดงเฉพาะจอซ้าย/กลาง/ขวา (แยกเครื่องต่อจอละเครื่อง)
                          // ?seam=1      = ขึ้นเส้นแบ่งจอ ใช้ตอนจัดวาง/ตรวจงาน
  SYNC          : 'auto', // 'auto' = เปิดเองเมื่อใช้ panel= (จอแยกเครื่อง) · true = เปิดตลอด
                          // false = ปิด  |  ?sync=1 / ?sync=0 สั่งทับได้
                          // โหมดนี้คำนวณว่า "ตอนนี้ควรอยู่หน้าไหน" จากนาฬิกาจริง
                          // ทุกเครื่องจึงตรงกันเองโดยไม่ต้องเชื่อมต่อกัน
  SYNC_EPOCH    : Date.UTC(2026, 0, 1),  // จุดเริ่มนับเวลาที่ทุกเครื่องใช้ร่วมกัน
  HERO_BG       : 'assets/static/background.png',   // ภาพพื้นหลังลายไทย (อยู่ในอิมเมจ)
  DIR_COMPARE   : 'assets/compare/',   // ภาพต้นฉบับ/ซ่อมแซม (จากโฟลเดอร์ เปรียบเทียบ-ต้นฉบับ-ซ่อมแซม)
  /* ---- ปิดไว้: path ../ วิ่งออกไปนอก /exhibition/ ซึ่ง service ไม่ให้บริการ ----
     ถ้าจะเปิดไฟล์จากโฟลเดอร์ Nora/ ตรง ๆ (ไม่ผ่าน nginx) ค่อยใส่ค่ากลับเข้าไป
       ALT_COMPARE : '../เปรียบเทียบ-ต้นฉบับ-ซ่อมแซม/'
       ALT_DRIVE   : '../วิดีโอ/'                                            */
  ALT_COMPARE   : '',
  ALT_DRIVE     : '',
  DIR_POSES     : 'assets/poses/',     // เฟรมท่ารำที่ตัดจากวิดีโอ ด้วย frame-picker.html
                                       // ตั้งชื่อ <videoId>-<ลำดับท่าเริ่มจาก 0>.jpg
  /* ภาพท่าบนสไลด์ "ภาพท่า + ภาพท่า = วิดีโอ" เอามาจากที่เดียว ไม่ไล่สำรอง
       'compare' = ภาพท่าที่ฟื้นฟูจากตำรา (มี ๑๑ ท่า ใช้ได้ทันที)
       'frames'  = เฟรมที่ตัดจากวิดีโอ (ต้องตัด 66 ภาพด้วย frame-picker.html ก่อน) */
  POSE_SRC      : 'compare',
  DIR_RESTORE   : 'assets/restore/',   // การ์ดเทียบก่อน-หลัง จากรายงานฟื้นฟูภาพ ๖๓ ภาพ
  DIR_DRIVE     : 'assets/drive/',     // วิดีโอจาก Google Drive (โฟลเดอร์ วิดีโอ)
  DIR_COLOR     : 'assets/color/',     // วิดีโอที่ใส่สีแล้ว
  DIR_STUDENT   : 'assets/students/',  // วิดีโอ/ภาพ นักศึกษา-นักเรียนรำ
  DIR_TEAM      : 'assets/team/',      // ภาพทีมทำงาน (ครอปจัดใบหน้าไว้แล้ว)
};
/* แถบโลโก้ผู้สนับสนุน — แสดงทุกสไลด์แทนการเขียนชื่อหน่วยงาน
   ถ้าไฟล์ยังไม่มี จะขึ้นกรอบประบอกชื่อหน่วยงานไว้ให้รู้ว่าต้องวางไฟล์อะไร */
// k = ตัวคูณความสูง ปรับให้น้ำหนักสายตาเท่ากัน (สัดส่วนโลโก้ต่างกันมาก
//     ตราครุฑสูงแคบ 0.65 : โลโก้ PSU กว้าง 3.78)
// ไฟล์อยู่ใน brand/ ทั้งหมด — ไม่ดึงจากเว็บต้นทางแล้ว ทุก request ต้องผ่าน nginx
// ถ้าไฟล์หาย ให้รัน brand/fetch-logos.sh ดึงมาวางใหม่ (ที่มาของแต่ละไฟล์อยู่ในสคริปต์)
const SPONSORS = [
  { file:'brand/logo-moc.png',  k:1.16, name:'กระทรวง\nวัฒนธรรม' },
  { file:'brand/logo-ocac.png', k:1.00, name:'สำนักงานศิลปวัฒนธรรม\nร่วมสมัย' },
  { file:'brand/logo-psu.png',  k:0.80, name:'มหาวิทยาลัย\nสงขลานครินทร์' },
];
function logoStrip(){
  return '<div class="logos">' + SPONSORS.map(sp =>
    `<img alt="${esc(sp.name.replace(/\n/g,' '))}" data-logo='${esc(JSON.stringify(sp.name))}'

const INLINE = (typeof window !== 'undefined' && window.__INLINE) || {};

/* cmp(ชื่อไฟล์) → ที่อยู่ของภาพ ทางเดียว ไม่มีสำรอง

   ถ้าจะใช้ PNG ต้นฉบับแทน ให้ตัด .replace(...) บรรทัดล่างออก                */
const cmp = f => INLINE[f]
  ? [INLINE[f]]
  : [CONFIG.DIR_COMPARE + f.replace(/\.png$/i, '.jpg')];
/* การ์ดเทียบจากรายงานฟื้นฟู — ผ่าน INLINE เหมือน cmp() เพื่อให้ไฟล์พรีวิวก้อนเดียวฝังภาพได้ */
const res = f => INLINE[f] ? [INLINE[f]] : [CONFIG.DIR_RESTORE + f];
const drv = f => [CONFIG.DIR_DRIVE + f]
  .concat(CONFIG.ALT_DRIVE ? [CONFIG.ALT_DRIVE + f] : []);

const E = (tag, cls, html) => { const n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const enc = p => /^data:/.test(p) ? p : p.split('/').map(encodeURIComponent).join('/');

/* ?dev=1 = โหมดผู้ดูแล เห็นชื่อไฟล์ที่ยังขาดบนกล่องว่าง
   ค่าปกติ (ไม่ใส่) = โหมดนิทรรศการ ไม่โชว์ path ให้คนดูเห็น */
const DEV = /[?&]dev=1/.test(location.search);
function phBox(kind, file){
  let f = String(file || '');
  if(/^data:/.test(f)) f = '(ภาพที่ฝังในไฟล์)';
  else if(f.length > 90) f = f.slice(0, 88) + '…';
  const dev = DEV ? `<div class="t2">วางไฟล์ไว้ที่<code>${esc(f)}</code></div>` : '';
  return `<div class="ph-box"><div class="ic">${kind==='video'?'▶':'▧'}</div>
    <div class="t1">${kind==='video'?'วิดีโอ':'ภาพ'}ส่วนนี้อยู่ระหว่างจัดเตรียม</div>
    ${dev || '<div class="t2">โครงการยังดำเนินอยู่ — ส่วนนี้จะเพิ่มเข้ามาในนิทรรศการเร็ว ๆ นี้</div>'}
    </div>`;
}
/* media builders — เก็บรายการไฟล์สำรองไว้ใน data-srcs
   ถ้าไฟล์แรกโหลดไม่ได้จะไล่ลองไฟล์ถัดไป ถ้าหมดแล้วจึงขึ้นกล่อง "รอไฟล์" */
/* เดิมลอง .webm ต่อท้าย — ตัดออก ให้เหลือ request เดียวต่อไฟล์ */
const alt = p => [p];
function mediaImg(paths){
  const L = Array.isArray(paths) ? paths : [paths];
  return `<img alt="" data-srcs='${esc(JSON.stringify(L))}' data-i="0" src="${enc(L[0])}">`;
}
function mediaVid(paths, extraClass){
  const L = Array.isArray(paths) ? paths : [paths];
  return `<video class="v ${extraClass||''}" muted playsinline preload="metadata"
    data-srcs='${esc(JSON.stringify(L))}' data-i="0" src="${enc(L[0])}"></video>`;
}
function panel(label, badge, inner, alt, twoUp, cls){
  return `<div class="panel${alt?' alt':''}${cls?' '+cls:''}">
    <div class="cap">${badge?`<span class="badge">${esc(badge)}</span>`:''}<span class="lbl">${esc(label)}</span></div>
    <div class="body${twoUp?' two':''}">${inner}</div></div>`;
}

const pairOf = name => {
  const p = PAIRS.find(x => x.book === name);
  if(!p) throw new Error('ไม่มีท่าชื่อ ' + name + ' ใน PAIRS');
  return p;
};
const shotO = name => ({ srcs:imgOrig(pairOf(name)),   tag:name });
const shotF = name => {
  const p = pairOf(name);
  if(p.pending) throw new Error('ท่า ' + name + ' ยังไม่มีภาพที่ฟื้นฟูแล้ว');
  return { srcs:imgFix(p)[0], tag:name };
};

/* ROT/OFF เรียงสลับซ้าย-ขวา ให้กองดูเป็นธรรมชาติ ไม่ใช่เอียงทางเดียวกันหมด */
const ROT = [-7, 4.5, -3.5, 7, -5];
const OFF = [34, -30, 26, -34, 30];
function photoStack(items, opt){
  const o = opt || {}, n = items.length;
  const step = o.step || (n > 3 ? 760 : 900);
  return `<div class="pstack ${o.cls || ''}">` + items.map((it,i)=>{
    const x = Math.round((i - (n-1)/2) * step);
    return `<div class="pc" style="--x:${x}px;--y:${OFF[i % OFF.length]}px;`
         + `--r:${ROT[i % ROT.length]}deg;--i:${i};z-index:${i+1}`
         + (o.ih ? `;--ih:${o.ih}px` : '') + `">`
         + mediaImg(it.srcs) + `<i>${esc(it.tag)}</i></div>`;
  }).join('') + `</div>`;
}

  const o = imgOrig(p);
  return `<div class="cell" style="--i:${i}">
      <div class="im"><img alt="" data-chip="1" data-fb='${esc(JSON.stringify(['▧','ภาพสแกน']))}'

      <div class="nm">${esc(thNum(p.no))} ${esc(p.book)}</div>
    </div>`;
};
[0, 1].forEach(half => {
  const set   = PAIRS.slice(half * 6, half * 6 + 6);
  const cells = set.map(scanCell).join('');
  const rng   = thNum(+set[0].no) + '–' + thNum(+set[set.length - 1].no);
  const SUB   = 'ภาพสแกนจากหนังสือ · ท่าที่ ' + rng + ' จาก ๑๒';

    },

function poseCompare(p){
  const fixed = imgFix(p).map(mediaImg).join('');
  return band({ eyebrow:'ท่าที่ ' + thNum(p.no) + ' จาก ' + thNum(RESTORED_PAIRS.length), h2:82, title:esc(p.book),

    nologo:true,
    body:`<div class="cmpcol">
      <div class="duowide portrait tall">
        ${panel('ภาพสแกนจากหนังสือ', thNum(p.no), mediaImg(imgOrig(p)), false, false, 'tight')}
        <div class="arrow">»<small>ฟื้นฟู</small></div>
        ${panel('ภาพที่ฟื้นฟูแล้ว', thNum(p.no), fixed, true, p.two, 'tight')}
      </div>
    </div>` });
}
for(let i = 0; i < RESTORED_PAIRS.length; i += 3){
  const set = RESTORED_PAIRS.slice(i, i + 3);
  const rng = thNum(i + 1) + '–' + thNum(i + set.length);
  push({ dur:D.compare, step:1, spanCU:true,
    wall:{ head:stepEB(1), title:'ท่าที่ ' + rng + ' จาก ' + thNum(RESTORED_PAIRS.length),

    left: ()=> poseCompare(set[0]),

        </div>`).join('')}</div>` })});
}

  wall:{ head:stepEB(1) + ' — ชุดที่ ๕ และ ๖', title:'ภาพชุดที่ยังรอยืนยันชื่อท่า',

/* ---- ขั้นที่ 03 สร้างการเคลื่อนไหว — จอกลางกับจอขวาเล่นคนละคลิปพร้อมกัน ---- */
divider(2);

/* สมการ  ภาพท่า + ภาพท่า = วิดีโอ  ของหนึ่งคลิป พอดีจอ 3840 หนึ่งจอ
   เดิมกางเต็มสองจอ (spanCR) สไลด์หนึ่งจึงได้คลิปเดียว 22 คลิป = 22 หน้า
   ย่อลงจอเดียวแล้ววางทั้งจอกลางและจอขวา สไลด์หนึ่งเล่นได้ 2 คลิปพร้อมกัน
   เหลือ 11 หน้า ประหยัดเวลาไปครึ่งหนึ่งโดยไม่ต้องตัดคลิปไหนออก
   จอซ้ายยังเป็นบันไดขั้นตอนตามเดิม (paneL ค่าเริ่มต้น)                    */
function clipUnit(entry, i){
  const id = entry[0], title = entry[1];
  const poses = title.split('→').map(x => x.trim());
  const nNew  = poses.filter(x => /ท่าใหม่/.test(x)).length;
  const visiblePoses = poses.map((nm, k) => ({ nm, k }))
    .filter(({ nm }) => nm !== 'ท่าพนมมือ');
  const chips = visiblePoses.map(({ nm, k })=>{
    const isNew = /ท่าใหม่/.test(nm);
    const srcs  = poseSrc(id, k, nm);
    const fb    = isNew ? ['✦','ท่าที่ AI สร้างใหม่'] : ['▧','ภาพท่านี้อยู่ระหว่างจัดเตรียม'];
    return `<div class="chip${isNew?' newpose':''}" style="--i:${k}">
        <div class="ph"><img alt="" data-chip="1" data-fb='${esc(JSON.stringify(fb))}'
          data-srcs='${esc(JSON.stringify(srcs))}' data-i="0" src="${enc(srcs[0])}"></div>
        <div class="nm">${esc(nm)}</div></div>`;
  }).join('');
  return frame({ eyebrow:stepEB(2),
    section:stepFoot(2, i + 1, VIDEOS.length),
    title:esc(title),
    /* ป้ายกำกับจอขวาถูกแทนที่ด้วยคลิปที่สองแล้ว ข้อมูลที่เคยอยู่ตรงนั้น
       จึงย้ายมาไว้บรรทัดใต้หัวข้อ ให้ยังอ่านได้ครบจากจอเดียวกัน */
    sub:'คลิปที่ ' + thNum(i+1) + ' จาก ' + thNum(VIDEOS.length) + ' · ประกอบจาก ' + thNum(poses.length) + ' ท่า'
      + (nNew ? ' · ท่าที่ AI สร้างใหม่ ' + thNum(nNew) + ' ท่า' : ''),
    body:`<div class="combine">
      <div class="chips n${Math.min(visiblePoses.length,4)}">${chips}</div>
      <div class="arrow">»<small>ได้เป็น</small></div>
      ${panel('วิดีโอที่ AI สร้างได้','ผลลัพธ์', mediaVid(vurl(id)), true)}
    </div>` });
}
for(let i = 0; i < VIDEOS.length; i += 2){
  const A = VIDEOS[i], B = VIDEOS[i + 1];
  const nPair  = i / 2 + 1;
  const nPairs = Math.ceil(VIDEOS.length / 2);
  push({ dur:D.combine, step:2, dual:true,
    vids:B ? [A[0], B[0]] : [A[0]],
    section:stepFoot(2, nPair, nPairs),
    html: clipUnit(A, i),
    right:()=> B ? clipUnit(B, i + 1) : '' });
}

/* ลงสี (อยู่ในขั้นที่ 03) — โหมด 1｜1｜1 (ค่าเริ่มต้น) */
if(CONFIG.SHOW_COLORIZE) COLOR_VIDEOS.forEach(([id,title],i)=>{

      rows:[['ต้นทาง', 'วิดีโอขาวดำ สร้างจากภาพขาวดำในตำรา'],
            ['สิ่งที่เพิ่มเข้ามา', 'สีเครื่องแต่งกาย เครื่องประดับ และฉาก']],
      note:'ภาพในตำราเป็นภาพขาวดำ วิดีโอที่สร้างจึงเป็นขาวดำตามต้นฉบับ '
         + 'การลงสีอ้างอิงสีเครื่องแต่งกายโนราตามธรรมเนียมจริง ไม่ใช่การเดาสีเอง',
      },
    html: frame({ eyebrow:stepEB(2) + ' — ลงสี',
      section:stepFoot(2, i+1, COLOR_VIDEOS.length) + ' (ลงสี)',
      title:esc(title),
      sub:'คลิปที่ ' + thNum(i+1) + ' จาก ' + thNum(COLOR_VIDEOS.length) + ' · ขาวดำตามต้นฉบับ → ลงสีเครื่องแต่งกายและฉาก',
      body:`<div class="cmp">
        ${panel('วิดีโอขาวดำ (ต้นทาง)','ก่อน', mediaVid(vurl(id)))}
        <div class="arrow">»<small>ลงสี</small></div>

/* ---- ขั้นที่ 04 ถอดรหัสท่ารำสู่ตำแหน่งในคอมพิวเตอร์ — จอละคลิป สไลด์ละ 3 คลิป ---- */
divider(3);

/* คลิปทั้ง 12 ในโฟลเดอร์ "วิดีโอ" บน Google Drive เป็นภาพซ้อนโครงร่างข้อต่อ
   (pose overlay) — ตัวผู้รำในวิดีโอ ทับด้วยเส้นสีตามตำแหน่งข้อต่อที่ตรวจจับได้
   วางจอละคลิป สไลด์หนึ่งจึงได้ 3 คลิปเล่นพร้อมกัน 12 คลิป = 4 หน้า
   ไฟล์อยู่ที่ assets/drive/<ชื่อไฟล์>.mp4 เติมด้วย deploy/fetch-media.sh */
function drivePane(entry, i){
  const id = entry[0], file = entry[1];
  const title = (VIDEOS.find(v => v[0] === id) || [, file.replace(/\.mp4$/,'')])[1];
  return band({ eyebrow:'คลิปที่ ' + thNum(i + 1) + ' จาก ' + thNum(DRIVE_PAIRS.length),
    h2:66, title:esc(title),
    sub:'เส้นสีคือตำแหน่งข้อต่อที่ถอดออกมาจากการเคลื่อนไหว',
    body:`<div class="cmp solo clip">${
      panel('โครงร่างท่ารำที่คอมพิวเตอร์อ่านได้', 'ตำแหน่งข้อต่อ',
        mediaVid(drv(file).flatMap(alt)), true)}</div>` });
}
if(CONFIG.SHOW_TWOSETS) for(let i = 0; i < DRIVE_PAIRS.length; i += 3){
  const set    = DRIVE_PAIRS.slice(i, i + 3);
  const nPage  = i / 3 + 1;
  const nPages = Math.ceil(DRIVE_PAIRS.length / 3);
  const rng    = thNum(i + 1) + '–' + thNum(i + set.length);
  push({ dur:D.threeway, step:3, spanCU:true,
    vids:set.map(e => e[0]),
    section:stepFoot(3, nPage, nPages),
    /* จอซ้าย/กลาง/ขวา คลิปละจอ — ?panel=1|2|3 จึงได้จอละคลิปเต็มขนาด */
    left: ()=> drivePane(set[0], i),
    midU: ()=> set[1] ? drivePane(set[1], i + 1) : '',
    right:()=> set[2] ? drivePane(set[2], i + 2) : '',
    /* โหมดจอเดียว 16:9 วางสามคลิปเรียงกันในจอเดียว จะได้ครบทั้ง 12 คลิปเหมือนกัน */
    html: frame({ eyebrow:stepEB(3),
      section:stepFoot(3, nPage, nPages),
      title:'ท่ารำกลายเป็นตำแหน่งในคอมพิวเตอร์',
      sub:'คลิปที่ ' + rng + ' จาก ' + thNum(DRIVE_PAIRS.length)
        + ' · เส้นสีคือตำแหน่งข้อต่อที่คอมพิวเตอร์อ่านออกมาจากวิดีโอทีละเฟรม',
      body:`<div class="cmp3">${set.map((e,k)=>{
        const title = (VIDEOS.find(v => v[0] === e[0]) || [, e[1].replace(/\.mp4$/,'')])[1];
        return panel(title, thNum(i + k + 1), mediaVid(drv(e[1]).flatMap(alt)), true);
      }).join('')}</div>` })});
}

    const poses = title.split('→').map(x => x.trim());

      if(!map.has(nm)) map.set(nm, { clips:new Set(), nb:new Set() });

      e.clips.add(i + 1);
      [poses[k-1], poses[k+1]].forEach(x => { if(x) e.nb.add(x); });
    });
  });
  return [...map.entries()]
    .sort((a, b) => a[0].localeCompare(b[0], 'th'))
    .map(([name, e]) => ({ name, clips:[...e.clips], nb:[...e.nb] }));

/* ================================================================
   4. RENDER + PLAYER
   ================================================================ */
/* อนิเมชัน: เติมคลาส motion ที่ <html> (ปิดด้วย ?nomotion=1 หรือ CONFIG.ANIMATE=false) */
const QS = new URLSearchParams(location.search);

/* ================================================================
   ค่าตั้งของ "เครื่องนี้" — จำไว้ในเครื่อง ไม่ผูกกับ query string
   ================================================================
   จอติดตั้งต้องส่ง ?screen=, ?group= หรือ query สำหรับงานควบคุม แล้วตั้งค่า
   จากมือถือ พอไฟดับหรือรีเฟรช เครื่องกลับมาเป็นเหมือนเดิมเอง
   ส่วน /exhibition/ เปล่า ๆ สงวนเป็นหน้าสาธารณะ ไม่อ่านค่าที่จำไว้

   ลำดับความสำคัญ: query string > ค่าที่จำไว้ > ค่าตั้งต้นใน CONFIG
   query string ยังใช้ได้และชนะเสมอ เอาไว้บังคับตอนตั้งเครื่องหรือทำ QR
   (localStorage ผูกกับ origin ของเบราว์เซอร์ ไม่ข้ามเครื่อง จึงเป็น
    "ค่าของเครื่องนี้" จริง ๆ · เปิดโหมดส่วนตัวแล้วเขียนไม่ได้ก็ไม่พัง) */
/* โหมดภาพตัวอย่างในหน้า controller — ไม่ใช่จอจริง
   เข้าได้สองทาง
     ?preview=1        เปิดตรง ๆ ไว้ทดสอบ
     window.__PREVIEW  หน้า controller ยัดตัวแปรนี้เข้ามาก่อนสคริปต์หลัก
                       เพราะมันโหลดสไลด์ผ่าน srcdoc ซึ่งไม่มี query string ให้ใช้
                       (เว็บตัวจริงส่ง CSP frame-ancestors 'none' มา
                        การ frame ด้วย src ปกติจึงถูกบล็อก ดู control.html)

   โหมดนี้ต้องไม่แตะอะไรที่เป็นของ "เครื่องจริง" เลย
   ห้ามเขียน localStorage · ห้ามรายงานตัวกับรีเลย์ · ไม่ต้องมีแถบปุ่ม */
const PREVIEW = QS.get('preview') === '1' || window.__PREVIEW === true;
/* URL เปล่าเป็นหน้าสาธารณะ คนทั่วไปอาจเปิดจากเครื่องที่เคยใช้คุมงานมาก่อน
   จึงต้องไม่รับชื่อจอ โหมด sync ม่าน หรือ 48:9 ที่ค้างอยู่ใน localStorage */
const PUBLIC_VIEW = !PREVIEW && location.search === '';

/* ?group=<ชื่อ> = แท็บนี้เป็นหนึ่งช่องของผนังจำลอง ใช้คู่กับ ?panel=1|2|3
   เปิดสามแท็บบนเครื่องเดียว ลากไปวางเรียงกัน แล้วสั่งพร้อมกันจาก controller
   ได้ภาพต่อเนื่องเหมือนผนัง 48:9 โดยไม่ต้องมีจอจริงสามบาน

   แท็บกลุ่มต้อง "ไม่ยุ่งกับค่าที่จำไว้" เด็ดขาด เพราะสามแท็บอยู่ origin เดียวกัน
   จึงใช้ localStorage ก้อนเดียวกัน ถ้าเขียน แท็บหลังจะทับโหมดของแท็บหน้าทันที
   (แท็บ 1 เขียน mode=1 · แท็บ 2 ทับเป็น 2 · แท็บ 3 ทับเป็น 3 แล้วพังทั้งชุด)
   แท็บกลุ่มจึงถูกกำหนดด้วย query string ล้วน ๆ เหมือนโหมดภาพตัวอย่าง          */
const GROUP = (QS.get('group') || '').trim().slice(0, 40);

/* ค่าที่จำไว้เป็นของ "เครื่องจริง" เท่านั้น แท็บจำลองกับภาพตัวอย่างไม่แตะ */
const EPHEMERAL = PREVIEW || PUBLIC_VIEW || !!GROUP;
const PREF = {
  get(k, d){ if(EPHEMERAL) return d;    // ต้องเริ่มสะอาด แล้วให้ query string / controller สั่ง
             try{ const v = localStorage.getItem('nora:' + k); return v === null ? d : v; }
             catch(e){ return d; } },
  set(k, v){ if(EPHEMERAL) return;
             try{ localStorage.setItem('nora:' + k, String(v)); }catch(e){} },
};

/* โหมดจอ: '0' 16:9 เดี่ยว · '1'|'2'|'3' เฉพาะจอซ้าย/กลาง/ขวา ·
   'w' 48:9 แบ่ง 3 · 'wall' 48:9 ผืนเดียวยาว */
const MODE_IN_URL = QS.has('panel') || QS.get('ultra') === '1' || QS.get('wall') === '1';
const BOOT_MODE = PUBLIC_VIEW ? '0'
  : MODE_IN_URL
  ? (Math.max(0, Math.min(3, parseInt(QS.get('panel'), 10) || 0))
      ? String(Math.min(3, parseInt(QS.get('panel'), 10)))
      : QS.get('wall') === '1' ? 'wall' : 'w')
  // แท็บกลุ่มที่ลืมใส่ ?panel= ให้ถือว่าเป็นช่องซ้าย ไม่ใช่ 16:9 เต็มจอ
  // ไม่งั้นจะได้ผนังจำลองที่มีช่องซ้ายซ้อนกับภาพเต็มโดยไม่รู้ตัว
  : GROUP ? '1'
  : PREF.get('mode', CONFIG.ULTRA ? 'w' : '0');

let PANEL_ON = /^[123]$/.test(BOOT_MODE) ? +BOOT_MODE : 0;  // จอที่กำลังครอปแสดง (0 = ไม่ครอป)
let WALL_ON  = BOOT_MODE === 'wall';                        // จอเดียวยาวเท่า 3 จอ
let ULTRA_ON = BOOT_MODE !== '0';
if(WALL_ON) document.documentElement.classList.add('wall');
if(ULTRA_ON) document.documentElement.classList.add('ultra');

/* 16:9 ใช้สไลด์นักศึกษาเดี่ยว 6 หน้า ส่วนผนัง 48:9 และจอ 1–3 ของผนัง
   ใช้ชุด 3 คลิปต่อหน้า 2 หน้า เลือกก่อนสร้าง DOM และคำนวณ timeline */
const WIDE_DECK = BOOT_MODE !== '0';
const ALL_SLIDES = SLIDES.slice();
SLIDES.splice(0, SLIDES.length, ...ALL_SLIDES.filter(s =>
  WIDE_DECK ? !s.studentSingle : !s.studentWide));

/* เส้นแบ่งจอ (ไว้เล็งตอนจัดวางจอจริง) */
let SEAM_ON = QS.has('seam') ? QS.get('seam') === '1' : PREF.get('seam') === '1';
if(SEAM_ON) document.documentElement.classList.add('seam');

/* โหมดซิงก์ตามนาฬิกา — จอแยกเครื่องกันแต่คำนวณเวลาเดียวกัน จึงแสดงหน้าเดียวกันพร้อมกัน */
const PREF_SYNC = PREF.get('sync', '');
let SYNC = (PREVIEW || PUBLIC_VIEW) ? false // ภาพตัวอย่าง/หน้าสาธารณะเดินอิสระ
         : QS.get('sync') === '1' ? true
           : QS.get('sync') === '0' ? false
           : PREF_SYNC === '1' ? true
           : PREF_SYNC === '0' ? false
           : (CONFIG.SYNC === 'auto' ? PANEL_ON > 0 : !!CONFIG.SYNC);

let MOTION_ON = CONFIG.ANIMATE
  && (QS.has('nomotion') ? QS.get('nomotion') !== '1' : PREF.get('motion', '1') === '1')
  && !matchMedia('(prefers-reduced-motion: reduce)').matches;
if(MOTION_ON) document.documentElement.classList.add('motion');

/* ---------- ชุดสไลด์ ----------------------------------------------
   main   รายการ 50 หน้าใน 16:9 หรือ 46 หน้าใน 48:9 ที่วนลูปตามปกติ
   intro  ม่านแดง CSS หน้าเดียว ค้างรอสั่ง "เปิดม่าน" จาก controller
          แล้วเล่นอนิเมชันแยกม่านเผยหน้าแรกของชุดหลัก

   ชุดที่เป็น overlay ไม่ได้เพิ่มหน้าเข้าไปในไทม์ไลน์ — เลขหน้า ความยาวรอบ
   และนาฬิกาโลกไม่เปลี่ยนเลย เพิ่มชุดใหม่แบบนี้จึงไม่กระทบของเดิม

   ชุดที่กำลังใช้ถูกจำไว้เหมือนค่าตั้งอื่น ๆ ก่อนพิธีเปิดตั้งไว้ที่ intro
   ไฟดับแล้วเปิดใหม่ม่านก็ยังปิดอยู่ พอเปิดม่านแล้วค่าเปลี่ยนเป็น main
   รีสตาร์ตกลางงานจึงกลับมาเล่นต่อ ไม่ใช่ปิดม่านใส่ผู้ชม

   ชุด intro มีสองสถานะในตัวมันเอง
     ม่านปิด   ค้างรอสั่ง
     ม่านเปิด  ม่านแยกออกแล้ว เหลือหน้าแรกค้างไว้ ยังไม่เริ่มวนลูป

   ด้วย ?panel=1 พอสั่งให้ไปจอ 2 จะได้จอว่าง เพราะ pane นั้นไม่เคยถูกสร้าง
   ตอนนี้สร้างทุก pane เสมอ (โหมดปกติที่ไม่ใส่ ?panel= ก็ทำแบบนี้อยู่แล้ว
   จึงไม่มีอะไรเปลี่ยนสำหรับเครื่องส่วนใหญ่) วิดีโอใน pane ที่ซ่อนถูก show() หยุดไว้ */
const want  = () => true;

const stage = document.getElementById('stage');
